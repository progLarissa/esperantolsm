let syncSt='local', dbRefs=null, pushing=false, pushAgain=false, pushT=null, lastPush=['',''];
function syncText(){ return {local:'○ Progreso konservita nur en ĉi tiu aparato',sync:'◌ Sinkronigado…',ok:'● Progreso sinkronigita kun via konto',err:'○ Sinkronigo malsukcesis: nova provo ĉe la sekva konservo',full:'○ Memoro plena: la progreso restas en ĉi tiu aparato'}[syncSt]; }
function setSync(st){ syncSt=st; const el=$('#syncline'); if(el){ el.textContent=syncText(); el.className='syncline '+st; } }
function splitState(){ const o=JSON.parse(JSON.stringify(S)); const texts={write:o.write,corr:o.corr,gen:o.gen,examGen:o.examGen,lt:o.lt}; delete o.write; delete o.corr; delete o.gen; delete o.examGen; delete o.lt; return [JSON.stringify(o),JSON.stringify(texts)]; }
function schedulePush(){ if(!dbRefs) return; clearTimeout(pushT); pushT=setTimeout(push,2500); }
async function push(){
  if(!dbRefs) return; if(pushing){ pushAgain=true; return; }
  pushing=true;
  try{
    const [c,t]=splitState();
    if(c!==lastPush[0]){ await dbRefs.core.set({json:c,at:S.at||0}); lastPush[0]=c; }
    if(t!==lastPush[1]){ await dbRefs.texts.set({json:t,at:S.at||0}); lastPush[1]=t; }
    setSync('ok');
  }catch(e){ setSync(e&&e.code==='quota_exceeded'?'full':'err'); }
  pushing=false;
  if(pushAgain){ pushAgain=false; push(); }
}
function mergeState(a,b){
  const [n,o]=(a.at||0)>=(b.at||0)?[a,b]:[b,a];
  const r=JSON.parse(JSON.stringify(n)), O=JSON.parse(JSON.stringify(o));
  ['ex','read','corr','gen','lesson','voc','tab','cult','spk','myvoc','orale','wpm','asc','exam','examGen','plan','story','rt','rad','radLog','lt'].forEach(f=>{ r[f]=Object.assign({},O[f]||{},r[f]||{}); });
  r.write=Object.assign({},O.write||{},r.write||{});
  Object.keys(O.write||{}).forEach(k=>{ if(O.write[k]&&O.write[k].done&&r.write[k]) r.write[k].done=true; });
  r.days=Object.assign({},O.days||{}); Object.entries(n.days||{}).forEach(([k,v])=>{ r.days[k]=Math.max(v,r.days[k]||0); });
  r.errDel=Object.assign({},O.errDel||{}); Object.entries(n.errDel||{}).forEach(([k,v])=>{ r.errDel[k]=Math.max(v,r.errDel[k]||0); });
  r.err=Object.assign({},O.err||{}); Object.entries(n.err||{}).forEach(([k,v])=>{ if(!r.err[k]||v.u>=r.err[k].u) r.err[k]=v; });
  Object.keys(r.err).forEach(k=>{ if(r.errDel[k]&&r.err[k].u<=r.errDel[k]) delete r.err[k]; });
  const cut=Date.now()-60*864e5; Object.keys(r.errDel).forEach(k=>{ if(r.errDel[k]<cut) delete r.errDel[k]; });
  r.log=Object.assign({},O.log||{}); Object.entries(n.log||{}).forEach(([k,v])=>{ if(!r.log[k]||v.length>=r.log[k].length) r.log[k]=v; });
  r.mastered=Math.max(n.mastered||0,o.mastered||0);
  ['verbi','falsi'].forEach(f=>{ r[f]=r[f]||{}; const x=O[f]||{}; ['ok','tot','best'].forEach(z=>{ r[f][z]=Math.max(r[f][z]||0,x[z]||0); }); });
  r.lab=r.lab||{}; Object.keys(O.lab||{}).forEach(m=>{ r.lab[m]=r.lab[m]||{ok:0,tot:0}; r.lab[m].ok=Math.max(r.lab[m].ok,O.lab[m].ok||0); r.lab[m].tot=Math.max(r.lab[m].tot,O.lab[m].tot||0); });
  r.tests=Object.assign({},O.tests||{}); Object.entries(n.tests||{}).forEach(([k,v])=>{ const p=r.tests[k]; r.tests[k]=!p?v:{...v,best:Math.max(v.best||0,p.best||0),passed:!!(v.passed||p.passed),pdate:v.pdate||p.pdate,dist:!!(v.dist||p.dist)}; });
  r.plan=Object.assign({},(O.plan||{}),(n.plan||{})); r.plan.tick=Object.assign({},(O.plan&&O.plan.tick)||{},(n.plan&&n.plan.tick)||{});
  r.name=n.name||o.name; r.at=Math.max(a.at||0,b.at||0);
  return r;
}
async function pullMerge(){
  const [a,b]=await Promise.all([dbRefs.core.get(),dbRefs.texts.get()]);
  if(a.exists){
    let remote=null;
    try{ remote=JSON.parse(a.data().json); if(b.exists) Object.assign(remote,JSON.parse(b.data().json)); }catch(e){ remote=null; }
    if(remote){
      const before=JSON.stringify(S);
      const merged=mergeState(S,remote);
      Object.keys(S).forEach(k=>delete S[k]); Object.assign(S,merged); ensureDefaults();
      try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
      if(JSON.stringify(S)!==before){ const r=route(); renderNav(r); if(r.type==='home') renderHome(); else if(r.type==='ripasso') renderRipasso(); }
    }
  }
  await push();
}
async function initSync(){
  if(!window.claude||!window.claude.use){ setSync('local'); return; }
  setSync('sync');
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user? await user.id() : null;
    if(!db||!uid){ setSync('local'); return; }
    const col=db.collection('data/users/'+uid);
    dbRefs={core:col.doc('esperanto'),texts:col.doc('esperanto-texts')};
    await pullMerge();
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && dbRefs) pullMerge().catch(()=>{}); });
  }catch(e){ dbRefs=null; setSync('local'); }
}

const canSpeak = false; /* sem voz: o caderno é só de leitura e escrita */
let speakingId=null;
function speakBtnHTML(id){ return canSpeak?`<button class="btn speak" id="${id}" type="button" aria-pressed="false">▶ Aŭskulti</button>`:''; }
function textOf(el,skip){ if(!el) return ''; const c=el.cloneNode(true); c.querySelectorAll(skip||'.speak').forEach(x=>x.remove()); c.querySelectorAll('p,li,h2,h3').forEach(x=>x.append('. ')); return c.textContent.replace(/\s+/g,' ').replace(/(\.\s*){2,}/g,'. ').trim(); }
const ONES=['','unu','du','tri','kvar','kvin','ses','sep','ok','naŭ'];
function eoNum(n){ n=Math.floor(Math.abs(+n)||0); if(n===0) return 'nul';
  const part=x=>{ const c=Math.floor(x/100), d=Math.floor(x%100/10), u=x%10, o=[]; if(c) o.push(c===1?'cent':ONES[c]+'cent'); if(d) o.push(d===1?'dek':ONES[d]+'dek'); if(u) o.push(ONES[u]); return o.join(' '); };
  const out=[], mi=Math.floor(n/1e6), th=Math.floor(n/1000)%1000, r=n%1000;
  if(mi) out.push(mi===1?'unu miliono':part(mi%1000)+' milionoj'); if(th) out.push(th===1?'mil':part(th)+' mil'); if(r) out.push(part(r)); return out.join(' '); }
function allVoices(){ try{ return speechSynthesis.getVoices()||[]; }catch(e){ return []; } }
const VLAB={eo:'esperanto',pl:'pola (proksimuma)',it:'itala (proksimuma)',es:'hispana (proksimuma)'};
function vLang(){ const vs=allVoices(), m=S.vmode||'auto', has=l=>vs.some(v=>new RegExp('^'+l,'i').test(v.lang));
  if(m!=='auto'&&has(m)) return m; for(const l of ['eo','pl','it','es']) if(has(l)) return l; return 'eo'; }
const LTAG={eo:'eo',pl:'pl-PL',it:'it-IT',es:'es-ES'};
function langVoices(){ const l=vLang(), re=new RegExp('^'+l,'i'), good=v=>/natural|neural|premium|enhanced|google|online/i.test(v.name); return allVoices().filter(v=>re.test(v.lang)).sort((a,b)=>(good(b)?1:0)-(good(a)?1:0)); }
function mainVoice(){ return langVoices()[0]||null; }
/* Sem voz de esperanto, a pronúncia é aproximada com a ortografia polonesa (acento na penúltima, como em esperanto) ou italiana. */
function translit(t){
  const l=vLang(); t=String(t).replace(/\d+/g,m=>eoNum(m)).replace(/[«»]/g,'');
  if(l==='eo') return t;
  let s=t.toLowerCase();
  if(l==='pl'){
    s=s.replace(/([csz])i(?=[aeiouŭ])/g,'$1y').replace(/([csz])i/g,'$1y').replace(/i(?=[aeou])/g,'ij')
     .replace(/ĉ/g,'cz').replace(/ĝ/g,'dż').replace(/ĥ/g,'ch').replace(/ĵ/g,'ż').replace(/ŝ/g,'sz').replace(/ŭ/g,'ł').replace(/v/g,'w');
    return s;
  }
  if(l==='it'){
    s=s.replace(/c/g,'z').replace(/k(?=[ei])/g,'ch').replace(/g(?=[ei])/g,'gh')
     .replace(/ĉ(?=[ei])/g,'c').replace(/ĉ/g,'ci').replace(/[ĝĵ](?=[ei])/g,'g').replace(/[ĝĵ]/g,'gi').replace(/ŝ(?=[ei])/g,'sc').replace(/ŝ/g,'sci')
     .replace(/ĥ/g,'k').replace(/h/g,'').replace(/j/g,'i').replace(/ŭ/g,'u');
    return s;
  }
  return s.replace(/c/g,'ts').replace(/ĉ/g,'ch').replace(/[ĝĵ]/g,'y').replace(/ŝ/g,'sh').replace(/ĥ/g,'j').replace(/h/g,'j').replace(/j(?![aeiou])/g,'i').replace(/ŭ/g,'u').replace(/z/g,'s');
}
function stopSpeak(){ try{ if(canSpeak) speechSynthesis.cancel(); }catch(e){} if(speakingId){ const b=document.getElementById(speakingId); if(b){ b.textContent=b.dataset.label||'▶ Aŭskulti'; b.setAttribute('aria-pressed','false'); } } speakingId=null; }
function speak(text,id,rate){
  if(!canSpeak||!text) return;
  stopSpeak();
  try{
    const parts=text.match(/[^.!?»]+[.!?»]*/g)||[text];
    const v=mainVoice();
    speakingId=id||null;
    parts.forEach((p,i)=>{ const u=new SpeechSynthesisUtterance(translit(p.trim())); u.lang=LTAG[vLang()]; if(v) u.voice=v; u.rate=rate||S.rate||0.9; if(i===parts.length-1) u.onend=()=>{ if(speakingId===id) stopSpeak(); }; speechSynthesis.speak(u); });
    if(id){ const b=document.getElementById(id); if(b){ b.dataset.label=b.dataset.label||b.textContent; b.textContent='■ Halti'; b.setAttribute('aria-pressed','true'); } }
  }catch(e){ stopSpeak(); }
}
function bindSpeak(id,getText){ const b=document.getElementById(id); if(!b) return; b.onclick=()=>{ if(speakingId===id) stopSpeak(); else speak(getText(),id); }; }

function speakSeq(parts,id,opts){

/* blocco «leggi ad alta voce»: frasi cliccabili, shadowing, cronometro */
function readAloudBlock(raw,key,{withTitle}={}){
  const paras=String(raw).split(/\n\s*\n/);
  let si=0;
  const html=paras.map(p=>{ const lines=p.split('\n'); return `<p>${lines.map(line=>{ const ss=(line.match(/[^.!?…]+[.!?…»"]*\s*/g)||[line]).filter(x=>x.trim()); return ss.map(s=>`<span class="snt" data-s="${si++}" tabindex="0" role="button">${gloss(esc(s.trim()).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g,'[[$1|$2]]'))}</span>`).join(' '); }).join('<br>')}</p>`; }).join('');
  return `<div class="ra" data-key="${esc(key)}">
    <div class="btnrow ractl">${canSpeak?`<button class="btn" type="button" data-act="all" id="ra-all-${esc(key)}">▶ Aŭskulti ĉion</button><button class="btn" type="button" data-act="shadow" id="ra-sh-${esc(key)}">⟲ Ombrado</button>`:''}<button class="btn" type="button" data-act="timer">⏱ Mezuri la legadon</button>${rateSel()}</div>
    <p class="note">${canSpeak?'Toque numa frase para ouvi-la. No <b>ombrado</b> (shadowing) a voz lê uma frase e faz uma pausa: repita em voz alta, copiando o ritmo e o acento na penúltima sílaba.':''} O cronômetro mede a sua leitura em palavras por minuto.</p>
    <div class="ratext reading">${html}</div>
    <div class="ratimer" hidden><b class="big" data-t>0:00</b><button class="btn primary" type="button" data-act="stop">Mi finis</button></div>
    <div class="rawpm"></div></div>`;
}
function bindReadAloud(root,raw,key){
  const box=root.querySelector(`.ra[data-key="${key}"]`); if(!box) return;
  bindRate(box);
  const spans=[...box.querySelectorAll('.snt')], texts=spans.map(s=>s.textContent.trim());
  const clear=()=>spans.forEach(s=>s.classList.remove('on'));
  spans.forEach((s,i)=>{ const go=()=>{ clear(); s.classList.add('on'); speakSeq([{text:texts[i]}],null,{onend:clear}); }; s.onclick=go; s.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } }; });
  const all=box.querySelector('[data-act="all"]'); if(all) all.onclick=()=>{ if(speakingId===all.id){ stopSpeak(); clear(); return; } speakSeq(texts.map((t,i)=>({text:t,onstart:()=>{ clear(); spans[i].classList.add('on'); }})),all.id,{onend:clear}); };
  const sh=box.querySelector('[data-act="shadow"]');
  if(sh){ let tmr=null, active=false;
    const end=()=>{ active=false; clearTimeout(tmr); clear(); sh.textContent='⟲ Ombrado'; sh.setAttribute('aria-pressed','false'); };
    const step=i=>{ if(!active) return; if(i>=texts.length){ end(); tick(5); toast('<span class="pen">Bonege!</span> Ombrado finita.'); return; }
      clear(); spans[i].classList.add('on'); spans[i].scrollIntoView({block:'nearest',behavior:'smooth'});
      speakSeq([{text:texts[i]}],null,{onend:()=>{ if(!active) return; spans[i].classList.add('you'); const wait=Math.max(1600,wordsOf(texts[i])*620/(S.rate||0.9)); tmr=setTimeout(()=>{ spans[i].classList.remove('you'); step(i+1); },wait); }});
      sh.textContent='■ Haltigi la ombradon'; sh.setAttribute('aria-pressed','true'); active=true; };
    sh.onclick=()=>{ if(active){ stopSpeak(); end(); } else { active=true; step(0); } };
  }
  let t0=0, iv=null; const tb=box.querySelector('.ratimer'), tt=box.querySelector('[data-t]'), out=box.querySelector('.rawpm');
  const showWpm=()=>{ const h=(S.wpm[key]||[]); if(!h.length){ out.innerHTML=''; return; } const last=h[h.length-1], best=Math.max(...h.map(x=>x.w)); out.innerHTML=`<p class="wpm"><b>${last.w}</b> vortoj minute · rekordo <b>${best}</b> · ${h.length} ${h.length===1?'legado':'legadoj'} <span class="note">· uma leitura fluente em voz alta em esperanto fica em torno de 110–140 palavras por minuto (as palavras são longas!)</span></p>`; };
  showWpm();
  box.querySelector('[data-act="timer"]').onclick=()=>{ stopSpeak(); tb.hidden=false; t0=Date.now(); clearInterval(iv); iv=setInterval(()=>{ const s=Math.floor((Date.now()-t0)/1000); tt.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; if(!document.body.contains(tt)) clearInterval(iv); },500); tb.scrollIntoView({block:'nearest'}); };
  box.querySelector('[data-act="stop"]').onclick=()=>{ clearInterval(iv); tb.hidden=true; const min=(Date.now()-t0)/60000; if(min<0.08) return; const w=Math.round(wordsOf(raw)/min); S.wpm[key]=(S.wpm[key]||[]).concat([{w,d:Date.now()}]).slice(-15); tick(Math.max(3,Math.round(min*2))); save(); showWpm(); };
}

/* ---------- dettato ---------- */
function lcsMatch(a,b){ const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0)); for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]); const hit=new Array(n).fill(false); let i=0,j=0; while(i<n&&j<m){ if(a[i]===b[j]){ hit[i]=true; i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; } return hit; }
function dictCheck(target,input){
  const tw=target.split(/\s+/), key=w=>canon(w), loose=w=>canon(w).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
  const iw=input.split(/\s+/).map(canon).filter(Boolean);
  const exact=lcsMatch(tw.map(key),iw), soft=lcsMatch(tw.map(loose),iw.map(loose));
  const html=tw.map((w,i)=>exact[i]?`<span class="dw ok">${esc(w)}</span>`:soft[i]?`<span class="dw acc">${esc(w)}</span>`:`<span class="dw no">${esc(w)}</span>`).join(' ');
  const ok=exact.every(Boolean)&&iw.length===tw.length, acc=!ok&&soft.every(Boolean)&&iw.length===tw.length;
  return {ok,acc,html,miss:tw.length-soft.filter(Boolean).length};
}
function dictCard(box,sentence,src,onDone){
  let plays=0;
  box.innerHTML=`<div class="dict"><div class="btnrow">${canSpeak?`<button class="btn primary" type="button" data-d="play">▶ Aŭskulti</button><button class="btn" type="button" data-d="slow">▶ Pli malrapide</button>`:`<span class="note">Sem voz: leia a frase por três segundos e depois escreva de memória.</span><button class="btn" type="button" data-d="peek">Montri dum 3 sekundoj</button>`}<span class="note" data-d="cnt"></span></div>
    <div class="peek" hidden></div>
    <textarea class="labin" rows="2" spellcheck="false" autocapitalize="off" placeholder="Skribu tion, kion vi aŭdas… (cx → ĉ)" lang="eo"></textarea>
    <div class="btnrow" style="margin-top:8px"><button class="btn" type="button" data-d="check">Kontroli</button></div><div class="fb dres"></div></div>`;
  const ta=box.querySelector('textarea'), cnt=box.querySelector('[data-d="cnt"]');
  const play=r=>{ plays++; cnt.textContent=`aŭdita ${plays}-foje`; speakSeq([{text:sentence}],null,{rate:r}); ta.focus({preventScroll:true}); };
  const pb=box.querySelector('[data-d="play"]'); if(pb) pb.onclick=()=>play();
  const sb=box.querySelector('[data-d="slow"]'); if(sb) sb.onclick=()=>play(0.6);
  const pk=box.querySelector('[data-d="peek"]'); if(pk) pk.onclick=()=>{ const p=box.querySelector('.peek'); p.textContent=sentence; p.hidden=false; setTimeout(()=>{ p.hidden=true; },3000); };
  let done=false;
  const check=()=>{ if(done||!ta.value.trim()) return; done=true; const r=dictCheck(sentence,ta.value);
    box.querySelector('.dres').innerHTML=`<div class="dline">${r.html}</div>${r.ok?'<span class="mark ok">Perfekte! ✓</span>':r.acc?'<span class="mark acc">Preskaŭ: atenção aos acentos.</span>':`<span class="mark no">${r.miss?`${r.miss} ${r.miss===1?'vorto':'vortoj'} por kontroli`:'kontrolu la frazon'}</span>`}`;
    tick(); if(!r.ok&&!r.acc) addErr('dict-'+hashStr(sentence),'dict',{s:sentence},src); onDone&&onDone(r.ok||r.acc); };
  box.querySelector('[data-d="check"]').onclick=check;
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); check(); } });
  return {play};
}
function orderSentences(u){ const s=u.ex.find(x=>x.t==='order'); return s?s.items.map(i=>i[0]):[]; }

let numType='numeri';
function numDrill(ab){
  const types=[['numeri','Nombroj'],['prezzi','Prezoj'],['orari','Horoj'],['anni','Jaroj'],['telefono','Telefonnumeroj']];
  ab.innerHTML=`<div class="chipsel" style="margin-bottom:14px">${types.map(([k,l])=>`<button data-t="${k}" aria-pressed="${numType===k}">${l}</button>`).join('')}</div>${rateSel()}<section class="card drill" id="ncard"></section><p class="note">Escreva com algarismos: 27 · 12,40 · 3:15 · 1987 · 0207 946 0321. As horas usam o relógio de 12 horas. Atenção aos pares que confundem: <i>dek ses</i> (16) × <i>sesdek</i> (60).</p>`;
  bindRate(ab);
  ab.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ numType=b.dataset.t; numDrill(ab); });
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const ORD=['','unua','dua','tria','kvara','kvina','sesa','sepa','oka','naŭa','deka','dek-unua','dek-dua'];
  const next=()=>{
    let say,ans,show;
    if(numType==='numeri'){ const pick=R(0,3); const n=pick===0?[16,60,17,70,18,80,19,90,12,20,13,30][R(0,11)]:pick===1?R(0,100):pick===2?R(100,9999):R(10000,999999); say=eoNum(n); ans=String(n); show=n.toLocaleString('pt-BR'); }
    else if(numType==='prezzi'){ const e=R(1,199), c=[0,5,10,20,25,40,50,75,90,95,99][R(0,10)]; say=`${eoNum(e)} ${e===1?'eŭro':'eŭroj'}${c?` kaj ${eoNum(c)} ${c===1?'cendo':'cendoj'}`:''}`; ans=(e+c/100).toFixed(2); show=ans.replace('.',',')+' €'; }
    else if(numType==='orari'){ const h=R(1,12), m=[0,5,10,15,20,25,30,35,40,45,50,55][R(0,11)], nh=ORD[h%12+1];
      if(m===0) say=`Estas la ${ORD[h]}.`; else if(m===15) say=`Estas la ${ORD[h]} kaj kvarono.`; else if(m===30) say=`Estas la ${ORD[h]} kaj duono.`; else if(m===45) say=`Estas kvarono antaŭ la ${nh}.`;
      else if(m>30&&Math.random()<.5) say=`Estas ${eoNum(60-m)} antaŭ la ${nh}.`; else say=`Estas la ${ORD[h]} kaj ${eoNum(m)}.`;
      ans=`${h}:${String(m).padStart(2,'0')}`; show=ans; }
    else if(numType==='anni'){ const y=R(1850,2030); say=`en ${eoNum(y)}`; ans=String(y); show=String(y); }
    else { const d=()=>R(0,9); const p=[0,d(),d(),d(),' ',d(),d(),d(),' ',d(),d(),d(),d()]; show=p.join(''); ans=show.replace(/\s/g,''); say=show.split(' ').map(g=>g.split('').map(x=>eoNum(x)).join(' ')).join(', '); }
    const c=$('#ncard'); c.innerHTML=`${canSpeak?'<button class="btn primary" id="nplay" type="button">▶ Aŭskulti</button>':`<div class="verb" style="font-size:32px">${esc(say)}</div>`}<div style="margin-top:14px"><input id="nin" inputmode="decimal" autocomplete="off" aria-label="respondo" data-nox="1"></div><div class="fb" id="nfb"></div><div class="btnrow" style="justify-content:center"><button class="btn" id="nnext" type="button">Sekva →</button></div>`;
    const inp=$('#nin'); let done=false;
    const play=()=>speakSeq([{text:say}]); const pb=$('#nplay'); if(pb){ pb.onclick=play; setTimeout(play,250); }
    const normN=v=>{ v=String(v).replace(/[€\s]/g,''); if(numType==='orari'){ const m=v.match(/^(\d{1,2})[:.h]?(\d{2})?$/); return m?`${(+m[1]%12)||12}:${m[2]||'00'}`:v; } if(numType==='prezzi'){ const f=parseFloat(v.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); return isNaN(f)?v:f.toFixed(2); } return v.replace(/\D/g,''); };
    const check=()=>{ if(done) { next(); return; } if(!inp.value.trim()) return; done=true; const ok=normN(inp.value)===ans; tick(); $('#nfb').innerHTML=(ok?'<span class="mark ok">Ĝuste! ✓</span>':`<span class="mark no">${esc(show)}</span>`)+`<p class="note">«${esc(say)}»</p>`; inp.style.color=ok?'var(--verde)':'var(--rosso)'; };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } }); inp.focus({preventScroll:true});
    $('#nnext').onclick=next;
  };
  next();
}

function stopOral(){ if(orTimer){ clearInterval(orTimer); orTimer=null; } }
const bandOf=l=>/^A1/.test(l)?0:/^A2/.test(l)?1:2;
function renderParlare(){
  $('#main').innerHTML=`<header class="uhead"><div class="eyebrow">Legi kaj skribi · konversacio</div><h1 class="title">Skriba konversacio</h1>
   <p class="subtitle">Converse por escrito com um parceiro de IA que nunca julga e corrige com gentileza, e tenha à mão as frases prontas que mantêm qualquer conversa viva.</p></header>
   <div class="seg" role="group">${[['ia','Konversacio'],['frasi','Utilaj frazoj']].map(([k,l])=>`<button data-m="${k}" aria-pressed="${parMode===k}">${l}</button>`).join('')}</div>
   <div id="pbody"></div>`;
  $('#main').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ parMode=b.dataset.m; stopOral(); renderParlare(); });
  const pb=$('#pbody');
  if(parMode!=='frasi') return chat?renderChat(pb):chatPick(pb);
  if(parMode==='frasi'){
    pb.innerHTML=`<p class="note">Leia, copie e depois tente escrever sem olhar. Comece pelas frases para «ganhar tempo»: são elas que mantêm a conversa viva quando as palavras não vêm. Use-as na conversa com a IA e nas redações.</p>${FRASARIO.map((s,si)=>`<section class="card"><div class="card-h"><div><span class="lab">${s.lvl}</span><h3>${esc(s.t)}</h3></div>${canSpeak?`<button class="btn" type="button" data-all="${si}" id="fa-${si}">▶ Ĉiuj</button>`:''}</div><ul class="phr nop">${s.f.map((f,fi)=>`<li><div><div class="phr-it">${esc(f[0])}</div><div class="note">${esc(f[1])}</div></div></li>`).join('')}</ul></section>`).join('')}`;
    bindRate(pb);
    pb.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ const [a,c]=b.dataset.f.split('-').map(Number); speakSeq([{text:FRASARIO[a].f[c][0]}]); });
    pb.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{ if(speakingId===b.id){ stopSpeak(); return; } speakSeq(FRASARIO[+b.dataset.all].f.map(f=>({text:f[0]})),b.id); });
    return;
  }
  orale(pb);
}
function chatPick(pb){
  pb.innerHTML=`<section class="card tipcard"><span class="pen">Como funciona</span><p>Escolha uma cena e responda por escrito, como num chat. A IA continua a conversa no seu nível, corrige só os erros de verdade e sugere respostas quando você trava; as correções vão para o Kajero de eraroj. Escreva <b>cx</b>, <b>sx</b>, <b>ux</b> para ĉ, ŝ, ŭ. Errar aqui é esperado: o único objetivo é continuar escrevendo.</p></section>
   <div class="lexgrid">${ROLEPLAY.map((r,i)=>`<button class="card lexcard rpc" type="button" data-r="${i}"><span class="lab">${r.lvl}</span><h3>${esc(r.t)}</h3><span class="note">${esc(r.goal)}</span></button>`).join('')}</div>`;
  pb.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ chat={sc:ROLEPLAY[+b.dataset.r],turns:[],msgs:[]}; renderChat(pb); chatSend(null); });
}
const LVLHINT={A1:'very short simple sentences, present/past/future in -as/-is/-os, very common words',A2:'simple sentences with the accusative, prepositions, correlatives and common affixes',B1:'natural sentences with the conditional, the volitive and participles',B2:'rich, idiomatic Esperanto with particles, affixes and participles, at normal speed'};
function chatRules(sc){ const lang=aiLang({band:bandOf(sc.lvl)})==='pt'?'Portuguese':'simple Esperanto';
  return `You are ${sc.role}. You are having a practice conversation IN ESPERANTO with a Brazilian student (native Portuguese, fluent Spanish) at level ${sc.lvl}. Be warm, patient and encouraging; never lecture. Goal of the conversation: ${sc.goal}.
Rules: always stay in character and always write in correct, natural Esperanto suited to level ${sc.lvl} (${LVLHINT[sc.lvl]||LVLHINT.A2}), with the letters ĉ ĝ ĥ ĵ ŝ ŭ and natural spoken touches ("nu", "do", "ja", "ĉu vere?"); answer in 1-3 short sentences and almost always ask a question to keep the conversation going; if she writes in Portuguese or Spanish, answer in Esperanto and give her the Esperanto words. Correct only real mistakes (accusative, agreement, verb endings, -ig/-iĝ, prepositions, false friends), not style; accept the x-system (cx = ĉ) without correcting it.
ALWAYS answer only with a JSON object: {"risposta":"your line in character, in Esperanto","correzione":"her message corrected with as few changes as possible, or an empty string if it was correct or she has not written yet","nota":"a very short explanation of the mistake in ${lang}, or an empty string","suggerimenti":["two possible short replies she could give, in Esperanto, at level ${sc.lvl}"]}`; }
function renderChat(pb){
  const sc=chat.sc;
  pb.innerHTML=`<div class="btnrow" style="justify-content:space-between;margin-bottom:12px"><div><span class="lab note">${sc.lvl} · celo</span><div><b>${esc(sc.t)}</b>: ${esc(sc.goal)}</div></div><div class="btnrow"><button class="btn" id="cend" type="button">Taksi la konversacion</button><button class="btn ghost" id="cnew" type="button">Ŝanĝi la scenon</button></div></div>
   <div class="chatbox" id="chatbox"></div>
   <div class="sugg" id="sugg"></div>
   <div class="chatin"><textarea id="cin" rows="2" class="labin" placeholder="Skribu vian respondon… (cx → ĉ)" spellcheck="false" lang="eo"></textarea><button class="btn primary" id="csend" type="button">Sendi</button></div>
   <p class="note">Enter para enviar · Shift+Enter para nova linha.</p>
   <div id="ceval"></div>`;
  $('#cnew').onclick=()=>{ stopSpeak(); chat=null; renderParlare(); };
  $('#csend').onclick=()=>{ const t=$('#cin').value.trim(); if(t) chatSend(t); };
  $('#cin').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); const t=e.target.value.trim(); if(t) chatSend(t); } });
  $('#cend').onclick=chatEval;
  drawChat();
}
function drawChat(){
  const box=$('#chatbox'); if(!box) return;
  box.innerHTML=chat.msgs.map((m,i)=>m.who==='ai'?`<div class="bub ai"><div>${esc(m.text)}</div>${canSpeak?`<button class="btn ghost play" type="button" data-say="${i}" aria-label="Aŭskulti">▶</button>`:''}</div>`:m.who==='me'?`<div class="bub me"><div>${esc(m.text)}</div>${m.corr?`<div class="corr"><span class="pen">✎</span> ${esc(m.corr)}${m.nota?`<div class="note">${esc(m.nota)}</div>`:''}</div>`:''}</div>`:`<div class="bub sys">${esc(m.text)}</div>`).join('');
  box.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speakSeq([{text:chat.msgs[+b.dataset.say].text}]));
  box.scrollTop=box.scrollHeight;
}
async function chatSend(text){
  const sample=await getSample();
  if(!sample){ chat.msgs.push({who:'sys',text:'A conversa com IA só funciona com esta página aberta dentro do Claude.'}); drawChat(); return; }
  if(text){ text=xsys(text); chat.msgs.push({who:'me',text}); chat.turns.push({role:'user',content:`Student's message: «${text}»\n(Answer only with the requested JSON.)`}); $('#cin').value=''; tick(2); }
  chat.msgs.push({who:'sys',text:'…'}); drawChat();
  const btn=$('#csend'); if(btn) btn.disabled=true;
  try{
    const turns=[{role:'user',content:chatRules(chat.sc)+'\n\nYou start the conversation, setting the scene naturally, in Esperanto.'}].concat(chat.turns);
    const r=await sample.json(turns,{cache:false});
    chat.msgs.pop();
    const reply=String((r&&r.risposta)||'…');
    chat.turns.push({role:'assistant',content:JSON.stringify(r)});
    if(text && r && r.correzione && canon(r.correzione)!==canon(text)){ const me=[...chat.msgs].reverse().find(m=>m.who==='me'); if(me){ me.corr=String(r.correzione); me.nota=String(r.nota||''); } addErr('chat-'+hashStr(text),'lab',{q:text,s:'Korektu la frazon (konversacio)',a:[String(r.correzione)],n:String(r.nota||'')},'Konversacio · '+chat.sc.t); }
    chat.msgs.push({who:'ai',text:reply}); drawChat();
    const sg=$('#sugg'); if(sg){ const ss=(r&&Array.isArray(r.suggerimenti))?r.suggerimenti.slice(0,3).map(String):[]; sg.innerHTML=ss.length?`<span class="note">Ideoj:</span> ${ss.map((s,i)=>`<button class="chip" type="button" data-sg="${i}">${esc(s)}</button>`).join('')}`:''; sg.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>{ $('#cin').value=ss[+b.dataset.sg]; $('#cin').focus(); }); }
    if(S.autoSpeak!==false) speakSeq([{text:reply}]);
  }catch(e){ chat.msgs.pop(); chat.msgs.push({who:'sys',text:errMsg(e)}); if(text) chat.turns.pop(); drawChat(); }
  if(btn) btn.disabled=false;
}
async function chatEval(){
  const out=$('#ceval'); const mine=chat.msgs.filter(m=>m.who==='me');
  if(mine.length<3){ out.innerHTML='<div class="ai-out"><p>Escreva pelo menos três mensagens antes de pedir a avaliação.</p></div>'; return; }
  const sample=await getSample(); if(!sample) return;
  const lang=aiLang({band:bandOf(chat.sc.lvl)})==='pt'?'PORTUGUESE':'simple ESPERANTO';
  const tr=chat.msgs.filter(m=>m.who!=='sys').map(m=>(m.who==='me'?'STUDENT: ':'PARTNER: ')+m.text).join('\n');
  out.innerHTML='<div class="ai-out"><div class="stamp">La instruisto legas…</div><div id="cevb"></div></div>';
  try{ const r=await sample(`You are an encouraging Esperanto teacher. Assess this practice conversation in Esperanto by a Brazilian student (she also speaks Spanish and is building her confidence), scenario «${chat.sc.t}», level ${chat.sc.lvl}. Answer in ${lang} with these markdown sections (write any Esperanto with ĉ ĝ ĥ ĵ ŝ ŭ):
## Nível e impressão geral
## O que você fez bem
## 3 erros para corrigir
(format: ~~wrong~~ → **right**: explanation; mark [PT] or [ES] for interference)
## 5 expressões úteis para a próxima vez

CONVERSATION:
${tr}`,{cache:false,onText:({text})=>{ const b=$('#cevb'); if(b) b.innerHTML=md(text); }});
    $('#cevb').innerHTML=md(r.text); out.querySelector('.stamp').textContent='Takso'; tick(5);
  }catch(e){ out.innerHTML=`<div class="ai-out"><p>${esc(errMsg(e))}</p></div>`; }
}
function orale(pb){
  const items=ORALE.map((o,i)=>[o,i]).filter(([o])=>o.lvl===orLvl);
  pb.innerHTML=`<p class="note">Prática no estilo da prova oral do KER: um tempo para se preparar e depois você fala sozinha pelo tempo indicado. Fale para a parede, para o gravador do celular ou para o gato: o que importa é não parar. Depois se avalie e, se quiser, dite o que disse para receber um retorno.</p>
   <div class="chipsel" style="margin-bottom:14px">${LVLS.map(l=>`<button data-l="${l}" aria-pressed="${orLvl===l}">${l}</button>`).join('')}</div>
   ${items.map(([o,i])=>`<section class="card oral" data-o="${i}"><div class="card-h"><div><span class="lab">${o.lvl} · ${esc(o.t)}</span><h3 class="oq">${esc(o.p)}</h3></div>${S.orale[i]?`<span class="score">${S.orale[i]}</span>`:''}</div>
    <div class="btnrow">${canSpeak?`<button class="btn ghost" type="button" data-act="say">▶ Aŭskulti la taskon</button>`:''}<button class="btn primary" type="button" data-act="go">Komenci: ${o.prep} s por prepari, ${Math.round(o.talk/60*10)/10} min por paroli</button></div><div class="otimer"></div><div class="oafter"></div></section>`).join('')}`;
  pb.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{ orLvl=b.dataset.l; stopOral(); orale(pb); });
  pb.querySelectorAll('.oral').forEach(sec=>{ const i=+sec.dataset.o, o=ORALE[i];
    const say=sec.querySelector('[data-act="say"]'); if(say) say.onclick=()=>speakSeq([{text:o.p}]);
    sec.querySelector('[data-act="go"]').onclick=()=>{ stopOral(); stopSpeak(); const tbox=sec.querySelector('.otimer'); let phase='prep', left=o.prep;
      const draw=()=>{ tbox.innerHTML=`<div class="drill"><span class="lab">${phase==='prep'?'Preparado: notu ideojn':'Parolu laŭte!'}</span><div class="verb ${phase==='talk'?'talk':''}">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</div><button class="btn" type="button" data-act="skip">${phase==='prep'?'Mi pretas: komenci paroli':'Mi finis'}</button></div>`; tbox.querySelector('[data-act="skip"]').onclick=()=>{ left=0; tickT(); }; };
      const tickT=()=>{ if(left>0){ left--; draw(); return; } if(phase==='prep'){ phase='talk'; left=o.talk; draw(); } else { stopOral(); tbox.innerHTML=''; afterOral(sec,i,o); } };
      draw(); orTimer=setInterval(tickT,1000); };
  });
}
function afterOral(sec,i,o){
  const crit=['Flueco','Gramatiko','Vortprovizo','Prononco','Kohereco'];
  const box=sec.querySelector('.oafter');
  box.innerHTML=`<div class="selfev"><span class="lab">Memtakso · de 1 ĝis 4</span>${crit.map((c,ci)=>`<div class="evrow"><span>${c}</span><span class="chipsel">${[1,2,3,4].map(n=>`<button type="button" data-c="${ci}" data-n="${n}">${n}</button>`).join('')}</span></div>`).join('')}</div>
   <p class="note" style="margin-top:12px">Quer um retorno? Dite ou digite o que você disse (mais ou menos já basta) e receba uma correção.</p>
   <textarea class="labin" rows="4" placeholder="Diktu aŭ skribu vian respondon ĉi tie…" lang="eo"></textarea><div class="btnrow" style="margin-top:8px"><button class="btn red" type="button" data-act="fb">Korekti mian respondon</button></div><div class="ofb"></div>`;
  const sc={}; box.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{ const c=b.dataset.c; sc[c]=+b.dataset.n; box.querySelectorAll(`[data-c="${c}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b)); if(Object.keys(sc).length===crit.length){ const tot=Object.values(sc).reduce((a,b)=>a+b,0); S.orale[i]=tot+'/20'; save(); tick(10); toast(`<span class="pen">Konservita:</span> ${tot}/20`); } });
  box.querySelector('[data-act="fb"]').onclick=async()=>{ const t=box.querySelector('textarea').value.trim(), out=box.querySelector('.ofb'); if(t.split(/\s+/).length<15){ out.innerHTML='<p class="note">Escreva pelo menos 15 palavras.</p>'; return; }
    const sample=await getSample(); if(!sample){ out.innerHTML='<p class="note">A correção só funciona com esta página aberta dentro do Claude.</p>'; return; }
    const lang=aiLang({band:bandOf(o.lvl)})==='pt'?'PORTUGUESE':'simple ESPERANTO';
    out.innerHTML='<div class="ai-out"><div class="stamp">La ekzamenanto aŭskultas…</div><div class="ofbb"></div></div>';
    try{ const r=await sample(`You are a friendly KER oral examiner (the CEFR-based Esperanto exam). This is a transcript of a spoken answer in Esperanto by a Brazilian student who also speaks Spanish and is building her confidence; it may be dictated or typed with the x-system (cx = ĉ). Level: ${o.lvl}. Task: «${o.p}». Ignore punctuation and small speech-to-text errors (but if a word looks like a mispronunciation, say so).
Answer in ${lang} with these markdown sections (write Esperanto with ĉ ĝ ĥ ĵ ŝ ŭ):
## Nível estimado e comentário geral
## Pontos fortes
## Erros principais
(format: ~~wrong~~ → **right**: explanation)
## Versão melhorada
(a short, natural version of what she wanted to say, at level ${o.lvl})
## Da próxima vez
3 concrete tips

TRANSCRIPT:
"""${t}"""`,{cache:false,onText:({text})=>{ const b=out.querySelector('.ofbb'); if(b) b.innerHTML=md(text); }});
      out.querySelector('.ofbb').innerHTML=md(r.text); out.querySelector('.stamp').textContent='Komentoj'; tick(5);
    }catch(e){ out.innerHTML=`<p class="note">${esc(errMsg(e))}</p>`; } };
}

/* ---------- paĝo: Legaĵoj, muziko kaj mi ---------- */
let fuoriMode='parole';
const SRC=['libro','revuo','artikolo','Vikipedio','rakonto','konversacio','kurso','alia'];
function renderFuori(){
  $('#main').innerHTML=`<header class="uhead"><div class="eyebrow">Legi kaj skribi · vera vivo</div><h1 class="title">Legaĵoj kaj mi</h1>
   <p class="subtitle">Livros, revistas, artigos e a Vikipedio: guarde aqui as palavras novas, registre o seu tempo de leitura e resuma o que leu.</p></header>
   <div class="seg" role="group">${[['parole','Miaj vortoj'],['registro','Studtaglibro'],['racconta','Rakontu al mi'],['risorse','Kie trovi Esperanton']].map(([k,l])=>`<button data-m="${k}" aria-pressed="${fuoriMode===k}">${l}</button>`).join('')}</div><div id="fbody2"></div>`;
  $('#main').querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ fuoriMode=b.dataset.m; renderFuori(); });

function myWords(fb){
  const ids=Object.keys(S.myvoc).sort((a,b)=>(S.myvoc[b].d||0)-(S.myvoc[a].d||0));
  fb.innerHTML=`<section class="card"><div class="card-h"><div><span class="lab">Aldoni</span><h3>Nova vorto aŭ esprimo</h3></div><span class="note">${ids.length} vortoj</span></div>
    <form id="mvf" class="mvform"><input id="mv-it" placeholder="Esperanto (ekz. ĝui)" required autocomplete="off" lang="eo"><input id="mv-pt" placeholder="português (aproveitar)" required autocomplete="off" data-nox="1"><input id="mv-ex" placeholder="a frase onde você achou (opcional)" autocomplete="off" lang="eo"><select id="mv-src">${SRC.map(s=>`<option value="${s}">${s}</option>`).join('')}</select><button class="btn primary" type="submit">Aldoni</button></form></section>
   ${ids.length?`<div class="btnrow" style="margin-bottom:12px"><button class="btn primary" id="mvrev" type="button">Ripeti miajn vortojn</button><input id="mvq" class="vsel" placeholder="Serĉi…" autocomplete="off"></div><section class="card" id="mvcard" hidden></section>
   <div class="tw"><table class="tbl lextbl" id="mvtbl">${ids.map(k=>{ const w=S.myvoc[k]; return `<tr data-k="${k}"><td>${canSpeak?`<button class="btn ghost play" type="button" data-say="${k}">▶</button>`:''}<b>${esc(w.it)}</b></td><td class="pt">${esc(w.pt)}</td><td><i>${esc(w.ex||'')}</i></td><td class="note">${esc(w.src||'')}</td><td><button class="btn ghost" type="button" data-del="${k}">Forigi</button></td></tr>`; }).join('')}</table></div>`:'<p class="note">Ainda não há palavras. Guarde as palavras e expressões que você encontra em livros, revistas e artigos (cinco por capítulo é um bom hábito): você as revisa aqui e, se errar, elas voltam no Kajero de eraroj.</p>'}`;
  $('#mvf').onsubmit=e=>{ e.preventDefault(); const it=xsys($('#mv-it').value.trim()), pt=$('#mv-pt').value.trim(); if(!it||!pt) return; const k='w'+Date.now().toString(36); S.myvoc[k]={it,pt,ex:xsys($('#mv-ex').value.trim()),src:$('#mv-src').value,d:Date.now()}; tick(); save(); myWords(fb); setTimeout(()=>$('#mv-it')&&$('#mv-it').focus(),0); };
  fb.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const k=b.dataset.del; delete S.myvoc[k]; removeErr('my-'+k); save(); myWords(fb); });
  fb.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speakSeq([{text:S.myvoc[b.dataset.say].it}]));
  const q=$('#mvq'); if(q) q.oninput=()=>{ const v=q.value.toLowerCase(); fb.querySelectorAll('#mvtbl tr').forEach(tr=>{ tr.hidden=v&&!tr.textContent.toLowerCase().includes(v); }); };
  const rv=$('#mvrev'); if(rv) rv.onclick=()=>{ const order=shuffle(ids).slice(0,20); let pos=0, ok=0; const card=$('#mvcard'); card.hidden=false;
    const show=()=>{ if(pos>=order.length){ card.innerHTML=`<div class="drill"><div class="pen" style="font-size:34px">Farite!</div><p>${ok} ĝustaj el ${order.length}.</p></div>`; return; }
      const w=S.myvoc[order[pos]]; card.innerHTML=`<div class="drill"><span class="lab">${pos+1}/${order.length} · kiel oni diras en Esperanto?</span><div class="verb" style="font-size:34px">${esc(w.pt)}</div><input id="mvin" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="fb" id="mvfb"></div></div>`;
      const inp=$('#mvin'); inp.focus({preventScroll:true}); let done=false;
      inp.onkeydown=e=>{ if(e.key!=='Enter') return; e.preventDefault(); if(done){ pos++; show(); return; } if(!inp.value.trim()) return; done=true; const r=judge(inp.value,[w.it,w.it.replace(/^la\s+/i,'')]); tick(); if(r!=='no') ok++; else addErr('my-'+order[pos],'myvoc',{k:order[pos]},'Miaj vortoj'); $('#mvfb').innerHTML=(r==='ok'?'<span class="mark ok">Ĝuste! ✓</span>':r==='acc'?`<span class="mark acc">Preskaŭ: ${esc(w.it)}</span>`:`<span class="mark no">${esc(w.it)}</span>`)+(w.ex?`<p class="expl">${esc(w.ex)}</p>`:'')+'<p class="note">Enter por daŭrigi</p>'; if(canSpeak) speakSeq([{text:w.it}]); };
    };
    show(); card.scrollIntoView({block:'nearest'}); };
}
function studyLog(fb){
  const days=Object.keys(S.log).sort().reverse();
  const week=[...Array(7)].map((_,i)=>addDays(-i));
  const tot={}; week.forEach(d=>(S.log[d]||[]).forEach(e=>{ tot[e.t]=(tot[e.t]||0)+e.m; }));
  const all=Object.values(S.log).flat().reduce((a,e)=>a+e.m,0);
  fb.innerHTML=`<section class="card"><div class="card-h"><div><span class="lab">Registri</span><h3>Kion vi legis aŭ ekzercis hodiaŭ?</h3></div></div>
    <form id="lgf" class="mvform"><select id="lg-t">${SRC.map(s=>`<option value="${s}">${s}</option>`).join('')}</select><input id="lg-m" type="number" min="1" max="600" placeholder="minutoj" required data-nox="1"><input id="lg-n" placeholder="noto (ekz. Gerda malaperis!, ĉap. 3; Kajto)" autocomplete="off"><button class="btn primary" type="submit">Registri</button></form>
    <p class="note">Todo dia registrado conta para a sua sequência de estudo.</p></section>

  const first=new Date(Y,M,1), lead=(first.getDay()+6)%7, dim=new Date(Y,M+1,0).getDate();
  let cells=''; for(let i=0;i<lead;i++) cells+='<div class="cday empty"></div>';

   </div>
   <div class="phasebar">${BANDS.map((name,bi)=>{ const idx=p.ss.filter(s=>s.band===bi).map(s=>s.idx); const dn=idx.filter(i=>p.st[i]==='done').length; return `<div class="ph"><span class="lab">${name}</span><span class="rw-bar"><i style="width:${idx.length?Math.round(100*dn/idx.length):0}%"></i></span><span class="note">${dn}/${idx.length}</span></div>`; }).join('')}</div>

  $('#ctoday').onclick=()=>{ planView=null; planSel=null; renderPlan(); };
  const rs=$('#presched'); if(rs) rs.onclick=()=>{ reschedule(dayKey()); planSel=null; renderPlan(); renderNav(route()); toast('<span class="pen">Farite:</span> o plano agora continua a partir de hoje.'); };

/* ---------- korekto per AI por mallongaj skribaĵoj ---------- */
async function quickCorr(out,text,task,lvl){
  if(text.trim().split(/\s+/).length<15){ out.innerHTML='<p class="note">Escreva pelo menos 15 palavras antes de pedir a correção.</p>'; return; }
  const sample=await getSample(); if(!sample){ out.innerHTML='<p class="note">A correção só funciona com esta página aberta dentro do Claude.</p>'; return; }
  const lang=aiLang({band:bandOf(lvl)})==='pt'?'PORTUGUESE':'simple ESPERANTO';
  out.innerHTML='<div class="ai-out"><div class="stamp">La instruisto legas…</div><div class="qcb"></div></div>';
  try{ const r=await sample(`You are an encouraging Esperanto teacher. Correct this short text in Esperanto by a Brazilian student (native Portuguese, fluent Spanish), level ${lvl}. It may be typed with the x-system (cx = ĉ). Task: «${task}». Answer in ${lang} with these markdown sections (write Esperanto with ĉ ĝ ĥ ĵ ŝ ŭ):
## Komento
(2 sentences: level and what works)
## Erros
(format: ~~wrong~~ → **right**: explanation; mark [PT] or [ES] for interference; if there are none, say so)
## Texto corrigido
## Uma frase mais natural
(one sentence of hers rewritten the way a fluent speaker would say it)

TEXT:
"""${xsys(text)}"""`,{cache:false,onText:({text})=>{ const b=out.querySelector('.qcb'); if(b) b.innerHTML=md(text); }});
    out.querySelector('.qcb').innerHTML=md(r.text); out.querySelector('.stamp').textContent='Korektita ✓'; tick(5);
  }catch(e){ out.innerHTML=`<p class="note">${esc(errMsg(e))}</p>`; }
}

function numDrillW(ab){

  const two=numType==='numeri'||numType==='anni';
  ab.innerHTML=`<div class="chipsel" style="margin-bottom:10px">${types.map(([k,l])=>`<button data-t="${k}" aria-pressed="${numType===k}">${l}</button>`).join('')}</div>
   ${two?`<div class="seg" role="group" style="margin-bottom:14px"><button data-dir="w2d" aria-pressed="${numDir==='w2d'}">vortoj → ciferoj</button><button data-dir="d2w" aria-pressed="${numDir==='d2w'}">ciferoj → vortoj</button></div>`:''}
   <section class="card drill" id="ncard"></section><p class="note">${two&&numDir==='d2w'?'Escreva o número por extenso: <i>dudek sep</i>, <i>mil naŭcent okdek sep</i>.':'Escreva com algarismos: 27 · 12,40 · 3:15 · 1987. As horas usam o relógio de 12 horas. Atenção aos pares que confundem: <i>dek ses</i> (16) × <i>sesdek</i> (60).'}</p>`;
  ab.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ numType=b.dataset.t; numDrillW(ab); });
  ab.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{ numDir=b.dataset.dir; numDrillW(ab); });
  const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const ORD=['','unua','dua','tria','kvara','kvina','sesa','sepa','oka','naŭa','deka','dek-unua','dek-dua'];
  const next=()=>{
    let say,ans,show;
    if(numType==='numeri'){ const pick=R(0,3); const n=pick===0?[16,60,17,70,18,80,19,90,12,20,13,30][R(0,11)]:pick===1?R(0,100):pick===2?R(100,9999):R(10000,999999); say=eoNum(n); ans=String(n); show=n.toLocaleString('pt-BR'); }
    else if(numType==='prezzi'){ const e=R(1,199), c=[0,5,10,20,25,40,50,75,90,95,99][R(0,10)]; say=`${eoNum(e)} ${e===1?'eŭro':'eŭroj'}${c?` kaj ${eoNum(c)} ${c===1?'cendo':'cendoj'}`:''}`; ans=(e+c/100).toFixed(2); show=ans.replace('.',',')+' €'; }
    else if(numType==='orari'){ const h=R(1,12), m=[0,5,10,15,20,25,30,35,40,45,50,55][R(0,11)], nh=ORD[h%12+1];
      if(m===0) say=`Estas la ${ORD[h]}.`; else if(m===15) say=`Estas la ${ORD[h]} kaj kvarono.`; else if(m===30) say=`Estas la ${ORD[h]} kaj duono.`; else if(m===45) say=`Estas kvarono antaŭ la ${nh}.`;
      else if(m>30&&Math.random()<.5) say=`Estas ${eoNum(60-m)} antaŭ la ${nh}.`; else say=`Estas la ${ORD[h]} kaj ${eoNum(m)}.`;
      ans=`${h}:${String(m).padStart(2,'0')}`; show=ans; }
    else { const y=R(1850,2030); say=eoNum(y); ans=String(y); show=String(y); }
    const d2w=two&&numDir==='d2w';
    const c=$('#ncard'); c.innerHTML=`<span class="lab">${d2w?'Skribu per vortoj':'Skribu per ciferoj'}</span><div class="verb" style="font-size:${d2w?'48px':'30px'}">${esc(d2w?show:say)}</div><div style="margin-top:14px"><input id="nin" ${d2w?'':'inputmode="decimal" data-nox="1"'} autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="respondo"></div><div class="fb" id="nfb"></div><div class="btnrow" style="justify-content:center"><button class="btn" id="nnext" type="button">Sekva →</button></div>`;
    const inp=$('#nin'); let done=false;
    const normN=v=>{ v=String(v).replace(/[€\s]/g,''); if(numType==='orari'){ const m=v.match(/^(\d{1,2})[:.h]?(\d{2})?$/); return m?`${(+m[1]%12)||12}:${m[2]||'00'}`:v; } if(numType==='prezzi'){ const f=parseFloat(v.replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); return isNaN(f)?v:f.toFixed(2); } return v.replace(/\D/g,''); };
    const normW=v=>canon(xsys(v)).replace(/-/g,' ').replace(/\s+/g,' ').trim();
    const check=()=>{ if(done){ next(); return; } if(!inp.value.trim()) return; done=true;
      const ok=d2w?normW(inp.value)===normW(say):normN(inp.value)===ans; tick();
      $('#nfb').innerHTML=(ok?'<span class="mark ok">Ĝuste! ✓</span>':`<span class="mark no">${esc(d2w?say:show)}</span>`)+`<p class="note">${esc(d2w?show:say)} = ${esc(d2w?say:show)}</p>`; inp.style.color=ok?'var(--verde)':'var(--rosso)'; };
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); check(); } }); inp.focus({preventScroll:true});
    $('#nnext').onclick=next;
  };
  next();
}

/* ---------- RADIKOJ: ripetado laŭ intervaloj ---------- */
const RADS=[]; RAD_GROUPS.forEach((g,gi)=>g.s.trim().split('\n').forEach(l=>{ const [w,pt,d]=l.split('|'); const word=w.trim();
  RADS.push({id:word.replace('/',''), w:word, root:word.split('/')[0], h:word.replace('/',''), pt:(pt||'').trim(), d:(d||'').split(';').map(x=>x.trim()).filter(Boolean).map(x=>x.split('=').map(y=>y.trim())), g:gi}); }));
const RADIX={}; RADS.forEach(r=>RADIX[r.id]=r);
const RIV=[0,1,2,4,8,16,35,80,180];
const radToday=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/86400000);
function radCfg(){ S.radCfg=Object.assign({n:10,dir:'eo',from:0},S.radCfg||{}); return S.radCfg; }
function radNewToday(){ const t=radToday(); if(!S.radDay||S.radDay.d!==t) S.radDay={d:t,n:0,extra:0}; return S.radDay; }
function radStats(){
  const t=radToday(); let due=0,learn=0,known=0;
  for(const id in S.rad){ const [b,d]=S.rad[id]; if(!RADIX[id]) continue; if(d<=t) due++; if(b>=4) known++; else learn++; }
  const nd=radNewToday(), newLeft=Math.max(0,radCfg().n+nd.extra-nd.n), unseen=RADS.length-learn-known;
  return {due,learn,known,unseen,newLeft:Math.min(newLeft,unseen),done:!!S.radLog[dayKey()]};
}
function radWord(r,cls){ const p=r.w.split('/'); return `<span class="${cls||'rw'}"><b>${esc(p[0])}</b>${p[1]?`<span class="end">${esc(p[1])}</span>`:''}</span>`; }
function radNewIds(k){
  const from=radCfg().from, order=RADS.filter(r=>r.g>=from).concat(RADS.filter(r=>r.g<from));
  const out=[]; for(const r of order){ if(out.length>=k) break; if(!S.rad[r.id]) out.push(r.id); } return out;
}
let radQ=null, radIdx=0, radShown=false, radMode='ripeto', radGrp=-1, radSearch='', radSess={ok:0,no:0};
function radBuildQueue(){
  const t=radToday();
  const due=Object.keys(S.rad).filter(id=>RADIX[id]&&S.rad[id][1]<=t).sort((a,b)=>S.rad[a][1]-S.rad[b][1]||S.rad[a][0]-S.rad[b][0]);
  const nw=radNewIds(radStats().newLeft);
  const q=[]; let i=0,j=0; while(i<due.length||j<nw.length){ for(let k=0;k<3&&i<due.length;k++) q.push(due[i++]); if(j<nw.length) q.push(nw[j++]); }
  radQ=q; radIdx=0; radShown=false; radSess={ok:0,no:0};
}
function radGrade(id,g){
  const t=radToday(), cur=S.rad[id], isNew=!cur;
  let b=cur?cur[0]:0;
  if(isNew){ const nd=radNewToday(); nd.n++; }
  if(g==='know'){ b=5; }
  else if(g==='no'){ b=0; }
  else if(g==='hard'){ b=Math.max(1,b); }
  else { b=Math.min(b+1,RIV.length-1); }
  S.rad[id]=[b,t+(b===0?0:RIV[b])];
  if(g==='no'){ radQ.splice(Math.min(radIdx+4,radQ.length),0,id); radSess.no++; } else radSess.ok++;
  save(); tick();
}
function radIvl(id,g){ const cur=S.rad[id]; let b=cur?cur[0]:0; if(g==='know') b=5; else if(g==='no') b=0; else if(g==='hard') b=Math.max(1,b); else b=Math.min(b+1,RIV.length-1); const d=b===0?0:RIV[b]; return d===0?'hoje de novo':d===1?'amanhã':d<30?`em ${d} dias`:d<60?'em 1 mês':`em ${Math.round(d/30)} meses`; }

async function genText(){
  const btn=$('#lt-go'), msg=$('#lt-msg'), lvl=$('#lt-lvl').value, len=$('#lt-len').value, topic=$('#lt-topic').value.trim();
  const sample=await getSample(); if(!sample){ msg.textContent='Gerar textos só funciona com esta página aberta dentro do Claude.'; return; }
  const W={A1:[90,140,190],A2:[140,220,300],B1:[200,320,420],B2:[260,400,550]}[lvl]||[150,250,350];
  const words=W[['mallonga','meza','longa'].indexOf(len)];
  const grammar={A1:'present, past and future (-as, -is, -os), the accusative, basic vocabulary, short simple sentences, no participles, no conditional',
    A2:'everything from A1 plus prepositions and direction, common affixes (mal-, -ej-, -ist-, -in-, -et-, -eg-, re-, ek-), correlatives, comparisons, -ig-/-iĝ-, si/sia; still no participle adverbs',
    B1:'everything from A2 plus the conditional (-us) and volitive (-u, ke…-u), active participles (-ante, -inte, -anta), more varied vocabulary',
    B2:'natural, rich Esperanto: passive participles, reported speech, particles (ja, eĉ, tamen, do, ajn), nuance and opinion, richer vocabulary'}[lvl];
  btn.disabled=true; msg.textContent='Mi verkas la tekston… (cerca de meio minuto)';
  const prompt=`You write graded reading material in Esperanto for a Brazilian adult learner (native Portuguese, fluent Spanish, works as a programmer, lives in Madrid). Level: ${lvl} (CEFR).
${topic?`Topic: ${topic}.`:'Choose an engaging, original topic (daily life, travel, science, technology, history, culture or the Esperanto community).'}
Write an ORIGINAL text of about ${words} words in correct, natural Esperanto that follows the Fundamento (use ĉ ĝ ĥ ĵ ŝ ŭ, never the x-system), in ${words<160?3:words<300?4:5} paragraphs. It can be a short story, a blog post, a news-style article or a letter. Grammar allowed at this level: ${grammar}.
Mark 8 to 12 words that are probably new at this level with double brackets and a Portuguese gloss: [[vorto|tradução]]. Never mark easy words or words that look the same in Portuguese.
Then write 5 multiple-choice comprehension questions in Esperanto (4 options, exactly one correct, plausible distractors, in text order; mix detail, inference and meaning in context), each with a short explanation in Portuguese.
Finally write one short writing task in Portuguese (one sentence) that makes the learner reuse words from the text and the grammar of the level.
Answer only with JSON: {"title":"short title in Esperanto","paragraphs":["…","…"],"q":[["question",["A","B","C","D"],index_of_correct_0_to_3,"explanation in Portuguese"]],"task":"writing task in Portuguese"}`;
  try{
    const d=await sample.json(prompt,{cache:false,modelTier:'complex'});
    const paras=(Array.isArray(d.paragraphs)?d.paragraphs:[]).map(p=>String(p||'').replace(/<[^>]*>/g,'').trim()).filter(Boolean);
    const q=(d.q||[]).filter(x=>Array.isArray(x)&&Array.isArray(x[1])&&x[1].length===4&&+x[2]>=0&&+x[2]<4).map(x=>[String(x[0]),x[1].map(String),+x[2],String(x[3]||'')]);
    if(paras.length<2||q.length<3) throw {code:'invalid_json'};
    const id='t'+Date.now().toString(36), plain=paras.join(' ').replace(/\[\[([^|\]]+)\|[^\]]+\]\]/g,'$1');
    S.lt=S.lt||{}; S.lt[id]={id,d:Date.now(),lvl,topic,title:String(d.title||'Nova teksto').slice(0,80),p:paras,q,task:String(d.task||'Resuma o texto com as suas palavras em cinco frases.').slice(0,300),words:plain.split(/\s+/).length};
    const ks=Object.keys(S.lt).sort((a,b)=>S.lt[a].d-S.lt[b].d); while(ks.length>20) delete S.lt[ks.shift()];
    save(); tick(3); location.hash='reading-room-g-'+id;
  }catch(e){ msg.textContent=e&&e.code==='invalid_json'?'O texto veio incompleto. Tente de novo.':errMsg(e); btn.disabled=false; }
}
function renderGenLeg(id){
  const T=(S.lt||{})[id]; if(!T){ location.hash='reading-room'; return; }
  const set=(k,v)=>{ T[k]=v; save(); };
  $('#main').innerHTML=`<header class="uhead"><div class="eyebrow"><a href="#reading-room">Legoĉambro</a> · nova teksto · ${T.lvl}${T.topic?' · '+esc(T.topic):''}</div><h1 class="title">${esc(T.title)}</h1><p class="subtitle">${T.words} vortoj · verkita de la AI la ${esc(fmtDay(dayKey(new Date(T.d))))}</p></header>
   <article class="reading">${T.p.map(p=>`<p>${gloss(esc(p))}</p>`).join('')}</article>
   <p class="note">Toque nas palavras sublinhadas para ver a tradução. Texto gerado por IA: se algo parecer estranho, confira no <a href="https://vortaro.net" target="_blank" rel="noopener">vortaro.net</a>.</p>
   <section class="card"><div class="card-h"><div><span class="lab">Kompreno</span><h3>Demandoj</h3></div><span class="score" id="ltsc"></span></div><ol class="items" id="ltq"></ol><div class="btnrow"><button class="btn" id="ltreset" type="button">Reprovi</button></div></section>
   <section class="card"><div class="card-h"><div><span class="lab">Skribu</span><h3>Tasko</h3></div><span class="note" id="ltwc"></span></div><p class="task">${esc(T.task)}</p>
    <textarea class="paper" id="ltw" style="min-height:170px" lang="eo" spellcheck="false" placeholder="Skribu ĉi tie… (cx → ĉ)">${esc(T.w||'')}</textarea>
    <div class="btnrow" style="margin-top:10px"><button class="btn red" id="ltcorr" type="button">Korekti per la ruĝa plumo</button><button class="btn ${T.done?'':'primary'}" id="ltdone" type="button">${T.done?'✓ Farita':'Marki kiel farita'}</button></div><div id="ltout"></div></section>
   <div class="done-row"><button class="btn ghost" id="ltdel" type="button">Forigi ĉi tiun tekston</button><a class="btn" href="#reading-room">← Legoĉambro</a></div>`;
  const draw=()=>mcList($('#ltq'),T.q,(s,t)=>{ set('score',s+'/'+t); showScore($('#ltsc'),s,t); },i=>[`lt${id}-${i}`,'mc',{q:T.q[i][0],o:T.q[i][1],c:T.q[i][2],e:T.q[i][3]||''},'Legoĉambro · '+T.title]);
  draw(); $('#ltreset').onclick=draw;
  if(T.score){ const [a,b]=T.score.split('/').map(Number); showScore($('#ltsc'),a,b); }
  const ta=$('#ltw'), wcf=()=>{ $('#ltwc').textContent=(ta.value.trim()?ta.value.trim().split(/\s+/).length:0)+' vortoj'; }; wcf();
  ta.oninput=()=>{ set('w',ta.value); wcf(); };
  $('#ltcorr').onclick=()=>quickCorr($('#ltout'),ta.value,T.task,T.lvl);
  $('#ltdone').onclick=()=>{ set('done',!T.done); if(T.done) tick(5); const b=$('#ltdone'); b.textContent=T.done?'✓ Farita':'Marki kiel farita'; b.classList.toggle('primary',!T.done); };
  let arm=0; $('#ltdel').onclick=()=>{ const n=Date.now(); if(n-arm>4000){ arm=n; toast('Toque de novo para apagar este texto.'); return; } delete S.lt[id]; save(); location.hash='reading-room'; };
}
/* ---------- sistemo x: cx → ĉ dum oni tajpas ---------- */
document.addEventListener('input',e=>{
  const el=e.target; if(!el||el.dataset.nox) return;
  const ok = el.tagName==='TEXTAREA' || (el.tagName==='INPUT' && /^(text|search|)$/.test(el.type||''));
  if(!ok) return;
  const v=el.value; if(!/[cghjsuCGHJSU][xX]/.test(v)) return;
  const pos=el.selectionStart, before=v.slice(0,pos), after=v.slice(pos);
  const nb=xsys(before), na=xsys(after);
  el.value=nb+na; try{ el.setSelectionRange(nb.length,nb.length); }catch(_){}
});

render();
initSync();
})();
</script>
