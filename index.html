<!DOCTYPE html><html lang="eo"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kajero de Esperanto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Caveat:wght@500;700&family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>
/* Layout: caderno de pontos (dot grid) — índice branco à esquerda com a «bandeira» (verde, quadrado branco, estrela) como marca; página à direita; correções em caneta framboesa; detalhes dourados da estrela. Fraunces nos títulos, Newsreader na leitura. */
:root{
  --paper:#F2F6F0; --grid:#C9D8C7; --card:#FFFFFF; --ink:#122018; --muted:#536257; --line:#D3DFD2;
  --blu:#0B6B3A; --blu-soft:#DDEFE3; --rosso:#B3245B; --rosso-soft:#FAE3EC; --verde:#1C7A4A; --verde-soft:#DDF0E3;
  --side:#0B5A31; --side-hi:#13723F; --side-ink:#F1F7F2; --side-muted:#AFCBB9; --brass:#D9A520;
  --ambra:#8F6400; --ambra-soft:#FAF0D6; --shadow:0 1px 2px rgba(18,32,24,.06),0 6px 24px -12px rgba(18,32,24,.2);
  --f-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --f-read:'Newsreader','Iowan Old Style',Georgia,serif;
  --f-ui:'Libre Franklin',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-pen:'Caveat','Bradley Hand','Segoe Print',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1310; --grid:#1E2A22; --card:#142019; --ink:#E5EDE7; --muted:#97A99D; --line:#26372C;
  --blu:#6FD49A; --blu-soft:#163525; --rosso:#FF86AE; --rosso-soft:#3A1826; --verde:#5ACB92; --verde-soft:#14301F;
  --side:#0A1F14; --side-hi:#1A3F2A; --side-ink:#E5EDE7; --side-muted:#8FAA99; --brass:#E9BE4E;
  --ambra:#E7B95A; --ambra-soft:#33290F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1310; --grid:#1E2A22; --card:#142019; --ink:#E5EDE7; --muted:#97A99D; --line:#26372C;
  --blu:#6FD49A; --blu-soft:#163525; --rosso:#FF86AE; --rosso-soft:#3A1826; --verde:#5ACB92; --verde-soft:#14301F;
  --side:#0A1F14; --side-hi:#1A3F2A; --side-ink:#E5EDE7; --side-muted:#8FAA99; --brass:#E9BE4E;
  --ambra:#E7B95A; --ambra-soft:#33290F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -14px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15.5px;line-height:1.55;
  background-image:radial-gradient(var(--grid) 1.1px,transparent 1.3px);
  background-size:22px 22px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px;border-radius:4px}
a{color:var(--blu)}
i,em{font-style:italic}

.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--card);border-right:1px solid var(--line);
  padding-block:22px 28px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;display:flex;flex-direction:column;gap:18px}
.brand{display:block;text-decoration:none;color:var(--ink)}
.brand b{display:block;font-family:var(--f-display);font-style:italic;font-weight:600;font-size:30px;line-height:1;letter-spacing:-.01em}
.brand span{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.navgroup h4{margin:0 0 6px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.navgroup ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.navlink{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--ink)}
.navlink:hover{background:var(--blu-soft)}
.navlink[aria-current="page"]{background:var(--blu-soft);color:var(--blu)}
.navlink .n{font-family:var(--f-display);font-size:19px;font-weight:600;text-align:center;font-variant-numeric:lining-nums}
.navlink .t{font-size:13.5px;line-height:1.3;min-width:0}
.navlink .bar{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:5px;overflow:hidden}
.navlink .bar i{display:block;height:100%;background:var(--verde);width:0}
.navlink.tool .n{font-family:var(--f-pen);font-size:22px;color:var(--rosso)}

.topbar{display:none}
.scrim{display:none}
main{min-width:0;padding-block:34px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:860px;margin:0 auto;position:relative}

/* tipografia */
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--rosso)}
h1.title{font-family:var(--f-display);font-weight:600;font-style:italic;font-size:clamp(34px,5.4vw,54px);line-height:1.02;letter-spacing:-.015em;margin:8px 0 10px;text-wrap:balance}
.subtitle{font-size:17px;color:var(--muted);margin:0;max-width:60ch}
h2.sec{font-family:var(--f-display);font-weight:600;font-size:28px;margin:0 0 12px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:22px;margin:28px 0 8px;text-wrap:balance}
p{margin:0 0 12px}
.lead{font-family:var(--f-read);font-size:19px;line-height:1.55;max-width:62ch}
.pen{font-family:var(--f-pen);font-weight:700;color:var(--rosso);font-size:1.35em;line-height:1}

/* cabeçalho de unidade */
.uhead{padding-bottom:18px;margin-bottom:6px}
.uprog{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.uprog .track{flex:0 1 220px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.uprog .track i{display:block;height:100%;background:var(--verde)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 26px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5}
.tabs button{border:0;background:none;padding:12px 14px 11px;font-size:14.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--blu);border-bottom-color:var(--blu)}
.tabs .tick{font-family:var(--f-pen);color:var(--verde);font-size:20px;line-height:0}

/* lição */
.lesson{font-size:16px}
.lesson p,.lesson li{max-width:68ch}
.tw{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.tbl{border-collapse:collapse;width:100%;font-size:14.5px}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl tr:last-child th,.tbl tr:last-child td{border-bottom:0}
.tbl th{font-weight:600;color:var(--muted);font-size:12.5px;letter-spacing:.02em;white-space:nowrap}
.tbl td{font-family:var(--f-read)}
.tbl.c td{text-align:center}
ul.dots{padding-left:20px;margin:0 0 12px}
ul.dots li{margin:4px 0}
.chips{font-family:var(--f-read);font-style:italic;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 14px;line-height:1.8}
.trap,.plus{border-radius:10px;padding:14px 16px 12px;margin:16px 0;max-width:72ch}
.trap{background:var(--rosso-soft)}
.plus{background:var(--verde-soft)}
.plus .pen{color:var(--verde)}
.trap .pen,.plus .pen{display:block;margin-bottom:4px;transform:rotate(-1.5deg);transform-origin:left}
.done-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px dashed var(--line)}

/* botões */
.btn{border:1px solid var(--line);background:var(--card);padding:9px 15px;border-radius:999px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--blu);color:var(--blu)}
.btn.primary{background:var(--blu);border-color:var(--blu);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1513}}
.btn.red{color:var(--rosso);border-color:var(--rosso)}
.btn.red:hover{background:var(--rosso-soft);color:var(--rosso)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{border-color:transparent;background:none;padding-inline:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

/* cartão de exercício */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin:0 0 22px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{margin:0;font-size:21px}
.card-h .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.score{font-family:var(--f-pen);font-size:28px;color:var(--rosso);line-height:1;font-variant-numeric:tabular-nums}
.score.good{color:var(--verde)}
.items{list-style:none;margin:0 0 16px;padding:0;counter-reset:it}
.items>li{counter-increment:it;display:grid;grid-template-columns:28px minmax(0,1fr);gap:6px;padding:11px 0;border-bottom:1px dashed var(--line)}
.items>li:last-child{border-bottom:0}
.items>li::before{content:counter(it);font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:16px;padding-top:1px}
.sent{font-family:var(--f-read);font-size:17px;line-height:1.9}
.sent .hint{font-family:var(--f-ui);font-size:13px;color:var(--muted);margin-left:4px}
.blank{font:inherit;font-family:var(--f-read);font-size:17px;color:var(--blu);background:transparent;border:0;border-bottom:2px dashed var(--blu);padding:0 4px;margin:0 3px;min-width:4ch;max-width:100%;border-radius:0}
.blank:focus{outline:none;background:var(--blu-soft)}
.blank.ok{border-bottom:2px solid var(--verde);color:var(--verde)}
.blank.acc{border-bottom:2px solid var(--ambra);color:var(--ambra)}
.blank.no{border-bottom:2px solid var(--rosso);color:var(--rosso);text-decoration:line-through;text-decoration-thickness:1.5px}
.mark{font-family:var(--f-pen);font-size:22px;font-weight:700;margin-left:4px;white-space:nowrap}
.mark.ok{color:var(--verde)}
.mark.no{color:var(--rosso)}
.mark.acc{color:var(--ambra)}
.expl{font-size:13.5px;color:var(--muted);margin-top:2px}
.err{text-decoration:underline wavy var(--rosso);text-decoration-thickness:1.5px;text-underline-offset:4px}
.fixline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:14px;color:var(--muted)}
.fixline .blank{min-width:12ch}
.corrected{font-family:var(--f-read);font-size:15px;margin-top:4px;color:var(--verde)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-family:var(--f-read);font-size:16px;text-align:left}
.opt:hover:not([disabled]){border-color:var(--blu)}
.opt.ok{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.opt.no{border-color:var(--rosso);background:var(--rosso-soft);color:var(--rosso);text-decoration:line-through}
.opt[disabled]{cursor:default}
.q{font-family:var(--f-read);font-size:17px}

/* leitura */
.reading{font-family:var(--f-read);font-size:18.5px;line-height:1.7;max-width:64ch}
.reading p{margin:0 0 14px}
.reading h2{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:32px;margin:0 0 14px;line-height:1.1}
.g{border-bottom:1.5px dotted var(--blu);cursor:help;position:relative}
.g:hover::after,.g:focus::after{content:attr(data-t);position:absolute;left:0;top:100%;margin-top:6px;z-index:20;background:var(--ink);color:var(--paper);font-family:var(--f-ui);font-size:13px;line-height:1.3;padding:6px 9px;border-radius:6px;white-space:nowrap;box-shadow:var(--shadow)}
.note{font-size:13.5px;color:var(--muted)}

/* escrita */
.task{font-family:var(--f-read);font-size:18px;max-width:64ch}
.write-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
textarea.paper{width:100%;min-height:320px;resize:vertical;font-family:var(--f-read);font-size:17px;line-height:30px;color:var(--ink);
  background-color:var(--card);background-image:linear-gradient(transparent 29px,var(--grid) 29px);background-size:100% 30px;background-attachment:local;
  border:1px solid var(--line);border-radius:12px;padding:8px 16px;box-shadow:var(--shadow)}
textarea.paper:focus{outline:2px solid var(--blu);outline-offset:1px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:13.5px}
.checklist li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:6px;align-items:start}
.checklist .bx{font-family:var(--f-pen);font-size:22px;line-height:.9;color:var(--muted);text-align:center}
.checklist li.on .bx{color:var(--verde)}
.checklist label{cursor:pointer}
.wc{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);margin:8px 0 0}
.wc b{color:var(--ink)}
.side{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.side h4{margin:0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.ai-out{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-top:18px;box-shadow:var(--shadow)}
.ai-out h4{font-family:var(--f-display);font-size:20px;margin:16px 0 6px}
.ai-out h4:first-child{margin-top:0}
.ai-out ul,.ai-out ol{padding-left:20px;margin:0 0 10px}
.ai-out li{margin:4px 0}
.ai-out del{color:var(--rosso);text-decoration-thickness:1.5px}
.ai-out .stamp{font-family:var(--f-pen);color:var(--rosso);font-size:22px}
.model{font-family:var(--f-read);font-size:17px;line-height:1.7;white-space:pre-wrap;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.fallback textarea{width:100%;min-height:140px;font-family:var(--f-ui);font-size:13px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:10px;margin-top:8px}

/* home */
.hero{padding:6px 0 26px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-family:var(--f-display);font-weight:600;font-size:clamp(38px,6.4vw,66px);line-height:.98;letter-spacing:-.02em;margin:10px 0 16px;text-wrap:balance}
.hero h1 em{color:var(--rosso);font-weight:500}
.stats{display:flex;flex-wrap:wrap;gap:28px;margin:22px 0 4px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.stat span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:0 0 30px}
.cols3 .card{margin:0}
.cols3 h3{margin-top:0;font-size:20px}
.plan{counter-reset:none}
.plan td:first-child{font-family:var(--f-display);font-weight:600;white-space:nowrap}
.levelmap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 30px}
.lv{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px}
.lv b{font-family:var(--f-display);font-size:22px}
.lv small{display:block;color:var(--muted);font-size:12.5px}
.lv .units{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lv .units a{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:14px}
.lv .units a.full{border-color:var(--verde);background:var(--verde-soft);color:var(--verde)}
.lv .units a.part{border-color:var(--ambra)}

/* falsi amici */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.flip{perspective:900px;height:150px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:14px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.flip .f b{font-family:var(--f-display);font-style:italic;font-size:28px;font-weight:600}
.flip .f small{color:var(--muted);font-size:12px}
.flip .b{transform:rotateY(180deg);background:var(--blu-soft)}
.flip .b .m{font-weight:700;font-size:16px}
.flip .b .tr{font-size:12.5px;color:var(--rosso)}
.flip .b .ex{font-family:var(--f-read);font-style:italic;font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);margin-bottom:18px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blu);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0E1513}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0E1513}}

/* coniugatore */
.drill{text-align:center;padding:30px 22px}
.drill .verb{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(40px,7vw,60px);line-height:1}
.drill .meta{margin:10px 0 18px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.drill .meta b{color:var(--rosso)}
.drill .pers{font-family:var(--f-read);font-size:22px;margin-bottom:6px}
.drill input{font-family:var(--f-read);font-size:24px;text-align:center;width:min(100%,340px);border:0;border-bottom:2px dashed var(--blu);background:transparent;color:var(--blu);padding:6px}
.drill input:focus{outline:none;background:var(--blu-soft)}
.drill .fb{min-height:34px;margin-top:10px}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}
.chipsel button[aria-pressed="true"]{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.conj{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 16px;max-width:520px;margin:16px auto 0;text-align:left;font-family:var(--f-read);font-size:15px}
.conj span{color:var(--muted);font-family:var(--f-ui);font-size:12px;margin-right:6px}

/* monta a frase */
.ordbox{display:grid;gap:10px;width:100%}
.build{min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--paper)}
.build.ok{border:1.5px solid var(--verde);background:var(--verde-soft)}
.build.no{border:1.5px solid var(--rosso);background:var(--rosso-soft)}
.build .ph{font-size:13px;color:var(--muted);padding-left:4px}
.pool{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font-family:var(--f-read);font-size:17px;line-height:1.2;box-shadow:0 1px 0 var(--line)}

/* laboratório */
.labq{font-family:var(--f-display);font-size:clamp(24px,3.6vw,32px);font-weight:500;line-height:1.25;margin:4px 0 16px;text-wrap:balance}
.labin{width:100%;font-family:var(--f-read);font-size:19px;line-height:1.5;color:var(--blu);background:var(--paper);border:0;border-bottom:2px dashed var(--blu);border-radius:8px 8px 0 0;padding:10px 12px;resize:vertical}

.labcard .fb{margin-top:10px}
.sols{margin-top:8px;font-family:var(--f-read);font-size:16px}
.sols ul{margin:4px 0 8px;padding-left:20px}

/* tabela de verbos */
.vsel{font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);max-width:100%;flex:1 1 220px}
.vhead{margin:18px 0 16px}
.verbname{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:44px;line-height:1}
.vfacts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-family:var(--f-read);font-size:16px}
.vfacts b{font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.vt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);font-family:var(--f-read);font-size:15px;line-height:1.6}
.vt h4{margin:0 0 4px;font-family:var(--f-ui);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--rosso)}
.vt span{display:inline-block;width:52px;color:var(--muted);font-family:var(--f-ui);font-size:12px}


/* ritmo, errori, verifiche, lessico */
.rhythm{display:grid;gap:6px;text-decoration:none;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.rhythm.met{border-color:var(--verde);background:var(--verde-soft)}
.rw-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}
.rw-streak{font-family:var(--f-pen);font-size:18px;line-height:1;color:var(--rosso)}
.rw-bar{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.rw-bar i{display:block;height:100%;background:var(--verde);transition:width .3s}
.topright{display:flex;gap:8px;align-items:center}
.rw-mini{font-size:13px;font-weight:600;text-decoration:none;color:var(--verde);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--rosso);color:#fff;font-size:11.5px;font-weight:700;vertical-align:1px;margin-left:4px}
.syncline{font-size:12px;color:var(--muted);margin:auto 0 0;padding-top:8px;border-top:1px dashed var(--line)}
.syncline.ok{color:var(--verde)}
.callout{background:var(--ambra-soft);border-radius:12px;padding:14px 16px;margin-top:26px}
.callout .pen{color:var(--ambra);margin-right:6px}
.rhythm-sec{margin:0 0 30px;display:grid;gap:14px}
.rhythm-sec .card{margin:0}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.rgrid .card{display:grid;gap:8px;align-content:start;margin:0}
.big{font-family:var(--f-display);font-size:44px;font-weight:600;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.big small{font-size:.45em;color:var(--muted);font-weight:500}
.card.today.met{background:var(--verde-soft);border-color:var(--verde)}
.card.due{border-color:var(--rosso)}
.hmwrap{overflow-x:auto}
.hmgrid,.hmmonths{display:grid;gap:3px;grid-auto-columns:14px}
.hmgrid{grid-template-rows:repeat(7,14px);grid-auto-flow:column}
.hmmonths{font-size:11px;color:var(--muted);margin-bottom:4px;height:14px}
.hmmonths span{white-space:nowrap}
.hm{display:block;width:14px;height:14px;border-radius:3px;background:var(--line)}
.hm.l1{background:color-mix(in srgb,var(--verde) 25%,var(--card))}
.hm.l2{background:color-mix(in srgb,var(--verde) 50%,var(--card))}
.hm.l3{background:color-mix(in srgb,var(--verde) 75%,var(--card))}
.hm.l4{background:var(--verde)}
.hmleg{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);margin-top:10px}
.hmleg span{margin:0 4px}
.testrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.testchip{display:grid;gap:2px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.testchip:hover{border-color:var(--blu)}
.testchip b{font-family:var(--f-display);font-size:19px}
.testchip span{font-size:12.5px;color:var(--muted)}
.testchip em{font-style:normal;font-size:13px;font-weight:600;color:var(--blu)}
.testchip.passed{border-color:var(--verde);background:var(--verde-soft)}
.testchip.passed em{color:var(--verde)}
.testchip.lex em{color:var(--rosso)}
.boxes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 22px}
.box{border:1px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;background:var(--card)}
.box b{font-family:var(--f-display);font-size:26px}
.errlist{list-style:none;margin:0;padding:0}
.errlist li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.errlist li>div{min-width:0}
.el-t{font-family:var(--f-read);font-size:16px}
.due-t{color:var(--rosso)}
.rvsent{font-size:19px;margin-bottom:6px}
.opt.sel{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.timer{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:18px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.timer b{font-size:20px}
.timer.low b{color:var(--rosso)}
.cloze{line-height:2.3}
.tblank{white-space:nowrap}
.tblank sup{font-family:var(--f-ui);font-size:11px;color:var(--rosso);font-weight:700;margin-right:1px}
.result.pass{border-color:var(--verde)}
.cert{margin:8px 0 22px;padding:10px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}
.cert-in{border:3px double var(--blu);padding:30px 22px;text-align:center;display:grid;gap:8px;justify-items:center;font-family:var(--f-read);font-size:17px}
.cert-t{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:clamp(40px,7vw,58px);line-height:1;color:var(--blu)}
.cert-name{font-family:var(--f-display);font-style:italic;font-size:30px;text-align:center;border:0;border-bottom:1.5px solid var(--ink);background:transparent;color:var(--ink);width:min(100%,420px);padding:4px}
.cert-name:focus{outline:none;border-bottom-color:var(--blu)}
.cert-foot{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:460px;margin-top:10px;font-size:14px;color:var(--muted)}
.seal{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;border:2px solid var(--rosso);color:var(--rosso);font-family:var(--f-display);font-weight:700;font-size:18px;transform:rotate(-12deg)}
.lexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lexcard{text-decoration:none;color:var(--ink);display:grid;gap:8px;margin:0}
.lexcard h3{margin:0}
.lexcard:hover{border-color:var(--blu)}
.lextbl td{vertical-align:middle}
.lextbl td.pt{font-family:var(--f-ui);font-size:14px;color:var(--muted)}
.btn.kn{color:var(--verde)}
.lexflip{display:block;width:min(100%,460px);height:220px;margin:0 auto}
.lexflip .f b{font-size:34px}
.lexflip .b .m{font-size:20px}
.lexflip .b .ex{font-size:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:opacity .3s,transform .3s;z-index:60;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);font-size:15px;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .pen{color:var(--ambra);margin-right:4px}
@media (max-width: 700px){ .rgrid{grid-template-columns:minmax(0,1fr)} .boxes{grid-template-columns:repeat(2,minmax(0,1fr))} }


/* A1 e cultura */
.navlink .n.sm{font-size:14px;font-family:var(--f-ui);font-weight:700;letter-spacing:.02em}
.levelmap{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.lv .units a{width:auto;min-width:30px;padding:0 6px;border-radius:999px}
.btn.speak{font-size:13px;padding:6px 12px;margin:0 0 12px}
.btn.speak[aria-pressed="true"]{border-color:var(--rosso);color:var(--rosso)}
.reading.cult{display:grid;gap:4px}
.cpar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:6px 0;border-bottom:1px dashed var(--line)}
.cpar>p{margin:0}
.cpar .ptbtn{font-size:12px;padding:4px 8px;color:var(--muted)}
.cpar .pt{grid-column:1 / -1;font-family:var(--f-ui);font-size:14.5px;line-height:1.55;color:var(--muted);background:var(--paper);border-left:3px solid var(--verde);padding:8px 12px;margin:6px 0 4px;border-radius:0 8px 8px 0}
.sapevi{background:var(--ambra-soft);border-color:transparent;box-shadow:none}
.sapevi .pen{color:var(--ambra);font-size:1.5em}

.cultchip{display:grid;gap:3px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}

.cultchip b{font-family:var(--f-display);font-size:17px;line-height:1.2}
.cultchip em{font-style:normal;font-size:12.5px;color:var(--verde);font-weight:600}
.cultchip.done{border-color:var(--verde)}


/* ascolto e parlato */
.rate{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.rate button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rate button[aria-pressed="true"]{border-color:var(--blu);background:var(--blu-soft);color:var(--blu)}
.ractl{margin-bottom:6px}
.ratext{margin-top:10px}
.snt{cursor:pointer;border-radius:4px;transition:background .15s}
.snt:hover{background:var(--blu-soft)}
.snt.on{background:var(--ambra-soft);box-shadow:0 0 0 2px var(--ambra-soft)}
.snt.you{background:var(--verde-soft);box-shadow:0 0 0 2px var(--verde-soft)}
.ratimer{display:flex;align-items:center;gap:16px;margin:12px 0;padding:12px 14px;border:1px dashed var(--blu);border-radius:12px;background:var(--blu-soft)}
.wpm{font-size:15px;margin:10px 0 0;font-variant-numeric:tabular-nums}
.wpm b{font-family:var(--f-display);font-size:24px;color:var(--verde)}
.phr{list-style:none;margin:0;padding:0}
.phr li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.phr li:last-child{border-bottom:0}
.phr-it{font-family:var(--f-read);font-size:17px}
.btn.play{width:34px;height:34px;padding:0;justify-content:center;border:1px solid var(--line);border-radius:50%;font-size:12px}
.btn.said{font-size:12.5px}
.callout.small{font-size:14px;padding:10px 14px;margin:0 0 14px}
.voicenote{margin:-4px 0 14px;font-size:12.5px}
.dict .peek{font-family:var(--f-read);font-size:18px;padding:8px 12px;background:var(--ambra-soft);border-radius:8px;margin:8px 0}
.dict textarea{margin-top:10px}
.dline{font-family:var(--f-read);font-size:18px;line-height:1.8;margin:8px 0 4px}
.dw.ok{color:var(--verde)}
.dw.acc{color:var(--ambra);text-decoration:underline wavy var(--ambra)}
.dw.no{color:var(--rosso);text-decoration:underline wavy var(--rosso);font-weight:600}
.transcript{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-top:14px;font-size:17px}
.tl{margin:0 0 6px}
.tl-A{color:var(--ink)}
.tl-B{color:var(--blu)}
.tl-N{font-style:italic}
.tl-C{color:var(--rosso)}
.vpair{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 24px;margin:18px 0 6px}
.vpair label{display:grid;gap:4px;justify-items:center}
.vpair input{width:min(100%,220px)!important;font-size:22px!important}
.cols4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:0 0 30px}
.cols4 .card{margin:0}
.tipcard{background:var(--blu-soft);border-color:transparent;box-shadow:none}
.tipcard .pen{color:var(--blu);display:block;margin-bottom:4px}
button.lexcard{text-align:left;font:inherit;cursor:pointer;width:100%}
.chatbox{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:240px;max-height:56vh;overflow-y:auto}
.bub{max-width:86%;padding:10px 14px;border-radius:14px;font-family:var(--f-read);font-size:17px;line-height:1.5;display:flex;gap:8px;align-items:flex-start}
.bub>div{min-width:0}

.bub.me{align-self:flex-end;background:var(--blu-soft);color:var(--ink);border-bottom-right-radius:4px;flex-direction:column}
.bub.sys{align-self:center;font-family:var(--f-ui);font-size:13px;color:var(--muted);background:none;padding:4px}
.bub .corr{font-size:15px;color:var(--rosso);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}

.sugg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 0;min-height:4px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-family:var(--f-read);font-size:15px;text-align:left}
.chip:hover{border-color:var(--blu);color:var(--blu)}
.chatin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:10px}
label.chk{display:inline-flex;gap:6px;align-items:center}
.oq{font-family:var(--f-read);font-weight:400;font-size:19px;line-height:1.45}
.verb.talk{color:var(--rosso)}
.selfev{display:grid;gap:6px;margin-top:10px;max-width:420px}
.evrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mvform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

.vlinks{display:grid;gap:6px;font-size:14px}
@media (max-width: 520px){ .phr li{grid-template-columns:auto minmax(0,1fr)} .phr li .said{grid-column:2} .bub{max-width:94%} }

  .nav.open{transform:none}

    padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.examcta p{margin:0}

.genform label{display:grid;gap:4px;min-width:0}

.gxown{margin-top:6px}

.gxown textarea{margin-top:6px}

.exgrid.two{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}

.extext{min-width:0}
.exread{font-size:17px;max-width:68ch}

.optlist li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px;font-family:var(--f-read);font-size:16px;line-height:1.55;padding:10px 0;border-bottom:1px dashed var(--line)}

.psess .card-h{align-items:flex-start}
.psess h3{margin:2px 0 0}
.pstate{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--muted)}
.pstate.done{border-color:var(--verde);color:var(--verde);background:var(--verde-soft)}
.pstate.late{border-color:var(--rosso);color:var(--rosso);background:var(--rosso-soft)}
.pstate.today{border-color:var(--brass);color:var(--ink);background:color-mix(in srgb,var(--brass) 22%,transparent)}

<script>
const UNITS = [], ORDER = {}, USPEAK = {};
const U = u => { UNITS.push(u); };
/* ───────── UNUO 1 ───────── */
U({
id:1, lvl:'A1', band:0,
title:'Saluton! Sonoj, la artikolo kaj -o, -a, -j',
sub:'Pronúncia, substantivos, adjetivos e o verbo estas · O esqueleto de tudo',
focus:'pronunciation (c, ĉ, ĝ, ĥ, ĵ, ŝ, ŭ, j), stress on the penultimate syllable, nouns in -o, adjectives in -a, plural -j and agreement, the article la (no indefinite article), estas, personal pronouns, ĉu questions and ne',
lesson:`
<p class="lead">O esperanto foi feito para ser aprendido depressa: <b>uma letra = um som</b>, sem exceções, e o acento cai <b>sempre na penúltima sílaba</b>. Para quem fala português e espanhol, metade do vocabulário já parece de casa.</p>
<h3>As letras que mudam</h3>
<div class="tw"><table class="tbl">
<tr><th>letra</th><th>som</th><th>como em</th><th>exemplo</th></tr>
<tr><td><b>c</b></td><td>ts</td><td>«tsunami», italiano «pizza»</td><td><i>paco</i> (paz), <i>celo</i> (objetivo)</td></tr>
<tr><td><b>ĉ</b></td><td>tch</td><td>«tchau»</td><td><i>ĉokolado</i>, <i>ĉu</i></td></tr>
<tr><td><b>ĝ</b></td><td>dj</td><td>«Djavan», o «di» carioca de «dia»</td><td><i>ĝardeno</i> (jardim)</td></tr>
<tr><td><b>ĥ</b></td><td>j espanhol, gutural</td><td>ES «jamón»</td><td><i>ĥoro</i> (coro)</td></tr>
<tr><td><b>j</b></td><td>i semivogal</td><td>«pai», ES «hoy»</td><td><i>jes</i> (sim), <i>kaj</i> (e)</td></tr>
<tr><td><b>ĵ</b></td><td>j português</td><td>«janela»</td><td><i>ĵurnalo</i> (jornal)</td></tr>
<tr><td><b>ŝ</b></td><td>x / ch</td><td>«chave»</td><td><i>ŝi</i> (ela)</td></tr>
<tr><td><b>ŭ</b></td><td>u semivogal</td><td>«mau», «Paulo»</td><td><i>aŭto</i>, <i>ankaŭ</i> (também)</td></tr>
<tr><td><b>g</b></td><td>sempre duro</td><td>«gato», mesmo antes de e/i</td><td><i>geografio</i> = «gue-o-gra-FI-o»</td></tr>
<tr><td><b>h</b></td><td>aspirado</td><td>inglês «house»</td><td><i>hejmo</i> (lar)</td></tr>
<tr><td><b>r</b></td><td>r simples, vibrado</td><td>«caro» (nunca o «rr» de «rato»)</td><td><i>rapida</i></td></tr>
<tr><td><b>s</b></td><td>sempre s, nunca z</td><td>«sapo»</td><td><i>kaso</i> (caixa) × <i>kazo</i> (caso)</td></tr>
</table></div>
<p>As vogais <b>a e i o u</b> nunca mudam e nunca ficam nasais: <i>en</i> se diz «én», não «ẽ»; <i>bona</i> se diz «BÔ-na», sem o «õ» de «bom».</p>
<p class="note">Digitar: escreva <b>cx gx hx jx sx ux</b> e o caderno transforma em <b>ĉ ĝ ĥ ĵ ŝ ŭ</b> enquanto você digita. É o «sistema x», usado por todos os esperantistas.</p>
<h3>O acento: penúltima, sempre</h3>
<p><i>es-pe-RAN-to</i>, <i>Bra-ZI-lo</i>, <i>KA-fo</i>. Como <b>i</b> e <b>u</b> são vogais plenas, <i>familio</i> tem quatro sílabas: <i>fa-mi-LI-o</i> (não «fa-MÍ-lia»). Do mesmo jeito: <i>bi-blio-TE-ko</i>? Não: <i>bi-bli-o-TE-ko</i>.</p>
<h3>Cada classe de palavra tem a sua terminação</h3>
<div class="tw"><table class="tbl">
<tr><th>-o</th><td>substantivo</td><td><i>libro, domo, amiko, urbo</i></td></tr>
<tr><th>-a</th><td>adjetivo</td><td><i>bela, granda, nova, facila</i></td></tr>
<tr><th>-j</th><td>plural (substantivo e adjetivo)</td><td><i>bela<b>j</b> libro<b>j</b></i>, <i>grandaj urboj</i></td></tr>
</table></div>
<p>O adjetivo concorda em número: <i>la nova libro</i>, <i>la nova<b>j</b> libro<b>j</b></i>. E não existe gênero gramatical: <i>la tablo, la seĝo, la urbo</i> são todos iguais.</p>
<h3>Um artigo só: la</h3>
<p><b>la</b> = o, a, os, as. Não muda nunca. E não há «um/uma»: <i>libro</i> = um livro, <i>la libro</i> = o livro. <i>Unu</i> é o número «um», não artigo.</p>
<h3>Pronomes e estas</h3>
<div class="tw"><table class="tbl">
<tr><td><b>mi</b> eu</td><td><b>vi</b> você / vocês</td><td><b>li</b> ele</td><td><b>ŝi</b> ela</td></tr>
<tr><td><b>ĝi</b> ele/ela (coisa, animal)</td><td><b>ni</b> nós</td><td><b>ili</b> eles, elas</td><td><b>oni</b> a gente, «se»</td></tr>
</table></div>
<p><b>estas</b> = é, está, são, estão, para todas as pessoas, e serve para <b>ser</b> e <b>estar</b>: <i>Mi estas Marina. Ni estas en Madrido. La kafo estas varma.</i> Também significa «há»: <i>En la parko estas multaj homoj.</i></p>
<h3>Perguntas e negação</h3>
<p><b>ĉu</b> no começo transforma a frase em pergunta de sim ou não: <i>Ĉu vi estas brazilanino?</i> — <i>Jes. / Ne.</i> E <b>ne</b> vem antes do que se nega: <i>Mi ne estas laca</i> (não estou cansada).</p>
<div class="trap"><span class="pen">Atenção, hispanófona!</span> <b>mi</b> = eu (em espanhol «mi» é «meu»: em esperanto, <i>mia</i>). <b>ni</b> = nós (não «nem»). E <b>vi</b> = você, não «eu vi».</div>
<div class="trap"><span class="pen">Atenção!</span> Pergunta só com entonação («Vi estas laca?») soa estrangeira. Use sempre <b>ĉu</b>.</div>
<div class="plus"><span class="pen">Vantagem</span> Você já viu como o português e o espanhol aparecem em toda parte: <i>bela, nova, granda, amiko, libro, familio</i>. Cerca de três quartos das raízes vêm de línguas românicas.</div>
`,
reading:{
title:'Saluton el Madrido!',
text:`<p>Saluton! Mi estas Marina, kaj mi estas brazilanino. Mi estas el Kuritibo, sed nun mi [[loĝas|moro]] en Madrido. Madrido estas granda kaj bela urbo. La stratoj estas plenaj de homoj, kaj la [[kafejoj|cafés (lugares)]] estas ĉiam [[malfermitaj|abertos]].</p>
<p>Mia domo ne estas granda. Ĝi estas malgranda, sed hela kaj [[komforta|confortável]]. En la [[kuirejo|cozinha]] estas tablo, kvar seĝoj kaj multaj libroj. Jes, libroj en la kuirejo! Mi ŝatas legi, [[dum|enquanto]] mi manĝas.</p>
<p>Mia amiko Paŭlo estas italo. Li estas instruisto, kaj li estas tre [[gaja|alegre]]. Ni ofte estas kune en la parko. Ĉu Paŭlo parolas Esperanton? Jes, kaj tre bone! Ni parolas Esperanton, [[ĉar|porque]] ĝi estas facila kaj [[neŭtrala|neutra]]: ĝi ne estas lia lingvo, kaj ĝi ne estas mia lingvo. Ĝi estas nia lingvo.</p>`,
q:[
["De kie estas Marina?",["El Madrido","El Kuritibo","El Italio","El Romo"],1,"«Mi estas el Kuritibo, sed nun mi loĝas en Madrido»."],
["Kia estas ŝia domo?",["Granda kaj malhela","Malgranda kaj hela","Granda kaj bela","Malnova kaj malgaja"],1,"mal- inverte o sentido: malgranda = pequeno."],
["Kio estas en la kuirejo?",["Lito kaj komputilo","Tablo, seĝoj kaj libroj","Nur tablo","Televidilo"],1],
["Kiu estas Paŭlo?",["Ŝia frato","Itala instruisto","Hispana kuiristo","Brazila studento"],1,"«Li estas instruisto» e «italo» = italiano."],
["Kial ili parolas Esperanton?",["Ĉar ĝi estas ilia gepatra lingvo","Ĉar ĝi estas facila kaj neŭtrala","Ĉar Paŭlo ne parolas la italan","Ĉar ili estas en Brazilo"],1,"«…ĉar ĝi estas facila kaj neŭtrala»."]
]},

]},

U({

title:'Verboj: -as, -is, -os',

focus:'verb endings -as (present), -is (past), -os (future), -i (infinitive), -u (imperative), the same form for all persons, modal verbs voli, povi, devi and ŝati + infinitive, time words hodiaŭ, hieraŭ, morgaŭ, nun, ofte, ĉiam, neniam',
lesson:`
<p class="lead">Aqui o esperanto mostra por que é famoso: <b>não há nenhum verbo irregular</b>, nem «esti» (ser/estar). E a forma é a mesma para todas as pessoas: <i>mi lernas, vi lernas, ili lernas</i>.</p>
<h3>Seis terminações para tudo</h3>
<div class="tw"><table class="tbl">
<tr><th>-as</th><td>presente</td><td><i>mi lernas</i></td><td>aprendo, estou aprendendo</td></tr>
<tr><th>-is</th><td>passado</td><td><i>mi lernis</i></td><td>aprendi, aprendia, estava aprendendo</td></tr>
<tr><th>-os</th><td>futuro</td><td><i>mi lernos</i></td><td>aprenderei, vou aprender</td></tr>
<tr><th>-i</th><td>infinitivo</td><td><i>lerni</i></td><td>aprender</td></tr>
<tr><th>-u</th><td>imperativo</td><td><i>lernu!</i></td><td>aprenda!</td></tr>
<tr><th>-us</th><td>condicional</td><td><i>mi lernus</i></td><td>eu aprenderia (unidade 9)</td></tr>
</table></div>
<p><i>esti</i>: <i>estas, estis, estos</i>. <i>havi</i> (ter): <i>havas, havis, havos</i>. Sempre assim.</p>
<h3>Um passado só</h3>
<p>Não há diferença entre perfeito e imperfeito: <i>mi legis</i> = «li», «lia», «estava lendo». O contexto e palavras como <i>jam</i> (já), <i>ofte</i> (frequentemente) ou <i>ĉiam</i> (sempre) fazem o trabalho.</p>
<h3>Verbo + infinitivo</h3>
<p><i>Mi <b>volas</b> lerni</i> (quero aprender) · <i>Mi <b>povas</b> veni</i> (posso vir) · <i>Mi <b>devas</b> labori</i> (tenho que trabalhar) · <i>Mi <b>ŝatas</b> danci</i> (gosto de dançar).</p>
<div class="trap"><span class="pen">Atenção!</span> <b>ŝati</b> não leva preposição: «gosto <b>de</b> dançar» = <i>Mi ŝatas danci</i>, nunca <s>Mi ŝatas de danci</s>.</div>
<div class="trap"><span class="pen">Atenção!</span> «Estou lendo» é simplesmente <i>mi legas</i>. E «vou viajar» é <i>mi vojaĝos</i>: <s>mi iras vojaĝi</s> significaria «estou indo (a algum lugar) para viajar».</div>
<h3>O imperativo e o «por favor»</h3>
<p><i>Venu!</i> (venha!) · <i>Atendu!</i> (espere!) · <i>Ne timu!</i> (não tenha medo!). O jeito educado: <b>bonvolu</b> + infinitivo: <i>Bonvolu sidiĝi</i> (sente-se, por favor), ou <i>…mi petas</i> no fim.</p>
<h3>Palavras de tempo</h3>
<div class="chips">hieraŭ (ontem) · hodiaŭ (hoje) · morgaŭ (amanhã) · nun (agora) · poste (depois) · jam (já) · ankoraŭ (ainda) · ofte (frequentemente) · ĉiam (sempre) · neniam (nunca) · matene (de manhã) · vespere (à noite)</div>
<p class="note">Você vai ver um <b>-n</b> no fim de algumas palavras nas leituras (<i>mi trinkas kafon</i>). É o acusativo: é o assunto da próxima unidade.</p>
<div class="plus"><span class="pen">Vantagem</span> Em italiano você precisa decorar centenas de formas. Aqui são seis terminações, e você já sabe todas.</div>
`,

U({
id:3, lvl:'A1', band:0,
title:'La akuzativo: -n',
sub:'Quem faz e quem recebe a ação · A letra que liberta a ordem das palavras',
focus:'accusative -n for the direct object (nouns, adjectives, pronouns, plural -jn), free word order, kiun/kion questions, verbs with and without a direct object (helpi iun, telefoni al iu), no -n after esti',
lesson:`
<p class="lead">O <b>-n</b> marca o objeto direto: quem ou o que recebe a ação. Graças a ele, a ordem das palavras é livre: <i>La hundo vidas la kato<b>n</b></i> e <i>La kato<b>n</b> vidas la hundo</i> dizem a mesma coisa: o cachorro vê o gato.</p>
<h3>Onde vai o -n</h3>
<div class="tw"><table class="tbl">
<tr><th>sujeito</th><th>objeto</th><th>exemplo</th></tr>
<tr><td>libro</td><td>libro<b>n</b></td><td><i>Mi legas libron.</i></td></tr>
<tr><td>nova libro</td><td>nova<b>n</b> libro<b>n</b></td><td><i>Mi aĉetis novan libron.</i></td></tr>
<tr><td>belaj floroj</td><td>bela<b>jn</b> floro<b>jn</b></td><td><i>Li donis al mi belajn florojn.</i></td></tr>
<tr><td>mi, vi, li, ŝi, ĝi, ni, ili</td><td>mi<b>n</b>, vi<b>n</b>, li<b>n</b>, ŝi<b>n</b>, ĝi<b>n</b>, ni<b>n</b>, ili<b>n</b></td><td><i>Mi amas vin.</i></td></tr>
</table></div>
<p>O português só faz isso com pronomes (eu → me, ele → o). O esperanto faz com tudo: substantivo, adjetivo e pronome concordam.</p>
<h3>Perguntas: kion e kiun</h3>
<p><i><b>Kion</b> vi volas?</i> (o que você quer?) · <i><b>Kiun</b> vi vidis?</i> (quem você viu?). Sem -n, <i>kio</i> e <i>kiu</i> perguntam pelo sujeito: <i>Kiu venis?</i> (quem veio?).</p>
<h3>Sem -n depois de esti</h3>
<p>Depois de <i>esti</i> e <i>fariĝi</i> (tornar-se) não há objeto, então não há -n: <i>Ŝi estas bona instruistino</i> (nunca <s>bonan instruistinon</s>).</p>
<div class="trap"><span class="pen">Atenção!</span> Muitos verbos que pedem preposição em português são diretos em esperanto: <i>Mi ŝatas kafo<b>n</b></i> (gosto <b>de</b> café), <i>Mi helpas mian frato<b>n</b></i> (ajudo meu irmão), <i>Mi atendas la buso<b>n</b></i> (espero o ônibus).</div>
<div class="trap"><span class="pen">Atenção, hispanófona!</span> Nada de «a pessoal»: «Vi a María» = <i>Mi vidis Maria<b>n</b></i>, nunca <s>Mi vidis al Maria</s>. Mas <i>telefoni <b>al</b> iu</i> (telefonar a alguém) usa preposição, e então não há -n.</div>
<p>Depois de preposição, regra geral, nada de -n: <i>kun mia amiko</i>, <i>en la domo</i>. (A exceção, o -n de direção, fica para a unidade 5.)</p>
<p>Nomes estrangeiros que não terminam em -o recebem o -n com hífen ou sem nada: <i>Mi vidis João-n</i> ou <i>Mi vidis s-ron João</i>.</p>
<div class="plus"><span class="pen">Para que serve</span> A ordem livre permite enfatizar: <i>Kafon mi ne trinkas, sed teon jes!</i> (café eu não tomo, mas chá sim!). Repare que números nunca levam -n: <i>Mi havas tri katojn.</i></div>
`,

U({

lesson:`
<h3>Possessivos = pronome + a</h3>
<p><i>mi → mia</i> (meu), <i>vi → via</i> (teu, seu), <i>li → lia</i> (dele), <i>ŝi → ŝia</i> (dela), <i>ni → nia</i>, <i>ili → ilia</i> (deles). Como são adjetivos, recebem <b>-j</b> e <b>-n</b>:</p>
<div class="chips">mia libro · miaj libroj · Mi legas mian libron · Mi legas miajn librojn</div>
<div class="trap"><span class="pen">Atenção!</span> Sem artigo: «o meu carro» = <i>mia aŭto</i>, nunca <s>la mia aŭto</s>. E <i>lia</i> / <i>ŝia</i> resolvem a ambiguidade do «seu» português: <i>lia domo</i> (a casa dele), <i>ŝia domo</i> (a casa dela).</div>
<h3>Os números</h3>
<div class="tw"><table class="tbl c">
<tr><td>1 unu</td><td>2 du</td><td>3 tri</td><td>4 kvar</td><td>5 kvin</td></tr>
<tr><td>6 ses</td><td>7 sep</td><td>8 ok</td><td>9 naŭ</td><td>10 dek</td></tr>
<tr><td>11 dek unu</td><td>20 dudek</td><td>23 dudek tri</td><td>100 cent</td><td>300 tricent</td></tr>
<tr><td>1000 mil</td><td>2026 du mil dudek ses</td><td colspan="3">1887 mil okcent okdek sep</td></tr>
</table></div>
<p>É só somar e multiplicar: <i>du-dek</i> = 2 × 10. Os números não mudam nunca: <i>tri katoj, tri katojn</i>.</p>
<p><b>Ordinais</b> com <b>-a</b>: <i>unua</i> (primeiro), <i>dua</i>, <i>tria</i>, <i>deka</i>, <i>dudeka</i>. E a idade: <i>Mi havas tridek jarojn</i> ou <i>Mi estas tridekjara</i>.</p>
<h3>Que horas são?</h3>
<div class="tw"><table class="tbl">
<tr><td><i>Kioma horo estas?</i></td><td>Que horas são?</td></tr>
<tr><td><i>Estas la tria.</i></td><td>São três horas (literalmente «a terceira»).</td></tr>
<tr><td><i>la tria kaj kvarono</i> · <i>la tria kaj duono</i></td><td>3:15 · 3:30</td></tr>
<tr><td><i>la tria kaj dek</i> · <i>kvarono antaŭ la kvara</i></td><td>3:10 · 3:45</td></tr>
<tr><td><i><b>je</b> la oka</i></td><td>às oito</td></tr>
</table></div>
<div class="trap"><span class="pen">Atenção!</span> «Às oito» é <i><b>je</b> la oka</i>, nunca <s>al la oka</s>. <i>Je</i> é a preposição curinga: horas, e quando nenhuma outra serve.</div>
<h3>Dias, meses e datas</h3>
<p><i>lundo, mardo, merkredo, ĵaŭdo, vendredo, sabato, dimanĉo</i> · <i>januaro, februaro, marto, aprilo, majo, junio, julio, aŭgusto, septembro, oktobro, novembro, decembro</i>. Tudo com <b>minúscula</b>.</p>
<p>Com <b>-e</b> viram advérbios: <i>lunde</i> = na segunda / às segundas; <i>vendrede vespere</i> = sexta à noite.</p>
<p>Datas: <i>Hodiaŭ estas la dek-kvina de decembro</i> (dia 15). Para dizer <b>quando</b>, o -n: <i>Mi naskiĝis la trian de majo</i> (nasci no dia 3 de maio); por escrito, <i>la 3-an de majo</i>.</p>
<div class="plus"><span class="pen">Para lembrar</span> O dia 15 de dezembro (<i>la 15-a de decembro</i>) é o Dia de Zamenhof, o criador do esperanto, a festa do «Esperantujo» (o mundo do esperanto). Muitos clubes fazem um encontro nesse dia.</div>
`,

U({

title:'Prepozicioj kaj direkto',
sub:'en, sur, al, de, el, ĉe, per, por, pro… · e o -n que indica movimento',
focus:'prepositions en, sur, sub, apud, antaŭ, malantaŭ, inter, ĉe, al, de, el, kun, sen, per, por, pro, pri, ĝis, dum, post, laŭ, the accusative of direction (en la domon, sur la tablon), direction adverbs in -en (hejmen, tien, dekstren), da after quantities, je',
lesson:`
<p class="lead">Cada preposição do esperanto tem <b>um sentido só</b>. É mais fácil que o português, onde «por» e «de» fazem dez trabalhos diferentes, mas exige trocar alguns reflexos.</p>
<div class="tw"><table class="tbl">
<tr><th>lugar</th><td><b>en</b> em, dentro · <b>sur</b> sobre, em cima · <b>sub</b> embaixo · <b>apud</b> ao lado · <b>antaŭ</b> diante, antes · <b>malantaŭ</b> atrás · <b>inter</b> entre · <b>ĉe</b> junto a, na casa de · <b>ĉirkaŭ</b> ao redor</td></tr>
<tr><th>movimento</th><td><b>al</b> para, a · <b>de</b> de, desde · <b>el</b> de dentro de · <b>ĝis</b> até · <b>tra</b> através · <b>laŭ</b> ao longo de, segundo</td></tr>
<tr><th>outras</th><td><b>kun</b> com (companhia) · <b>per</b> com, por meio de (instrumento) · <b>sen</b> sem · <b>por</b> para (finalidade) · <b>pro</b> por causa de · <b>pri</b> sobre, a respeito de · <b>dum</b> durante · <b>post</b> depois</td></tr>
</table></div>
<div class="trap"><span class="pen">A armadilha nº 1</span> «Obrigada <b>pela</b> ajuda» = <i>Dankon <b>pro</b> la helpo</i>. <b>por</b> é só finalidade ou destinatário: <i>Tiu donaco estas <b>por</b> vi</i> (este presente é para você). <b>pro</b> é a causa: <i>Mi restis hejme <b>pro</b> la pluvo</i>.</div>
<div class="trap"><span class="pen">Atenção!</span> «Com» tem duas traduções: <i>Mi iris <b>kun</b> Paŭlo</i> (companhia) × <i>Mi skribas <b>per</b> plumo</i> (instrumento). «De ônibus, de trem» também é <b>per</b>: <i>per buso, per trajno</i>.</div>
<h3>O -n de direção</h3>
<p>Com preposições de lugar, o <b>-n</b> indica movimento <i>para</i> esse lugar:</p>
<div class="tw"><table class="tbl">
<tr><td><i>La kato estas <b>en la domo</b>.</i></td><td>O gato está dentro de casa.</td></tr>
<tr><td><i>La kato kuras <b>en la domon</b>.</i></td><td>O gato corre para dentro de casa.</td></tr>
<tr><td><i>La libro kuŝas <b>sur la tablo</b>.</i></td><td>O livro está em cima da mesa.</td></tr>
<tr><td><i>Mi metis la libron <b>sur la tablon</b>.</i></td><td>Pus o livro em cima da mesa.</td></tr>
</table></div>
<p>Com <b>al</b>, que já indica direção, não se usa -n: <i>Mi iras al la parko</i>. O mesmo vale para advérbios: <i>hejme</i> (em casa) → <i>hejmen</i> (para casa); <i>tie</i> (lá) → <i>tien</i> (para lá); <i>dekstren, maldekstren</i> (para a direita, para a esquerda).</p>
<h3>da: quantidades</h3>
<p>Depois de uma palavra de quantidade, <b>da</b>: <i>glaso <b>da</b> akvo</i> (um copo de água), <i>kilogramo da pomoj</i>, <i>multe da homoj</i> (muita gente), <i>iom da tempo</i>. Mas posse continua com <b>de</b>: <i>la glaso de mia patro</i>.</p>
<h3>de ou el?</h3>
<p><b>el</b> = de dentro de, feito de: <i>Ŝi eliris el la domo</i>; <i>tablo el ligno</i> (mesa de madeira). <b>de</b> = origem, posse, ponto de partida: <i>la libro de Ana</i>, <i>de lundo ĝis vendredo</i>. Para nacionalidade, ambos: <i>Mi venas el / de Brazilo</i>.</p>
<div class="plus"><span class="pen">Curinga</span> Quando nenhuma preposição serve, use <b>je</b>: <i>je la oka</i> (às oito), <i>Je via sano!</i> (saúde!, no brinde).</div>
`,

U({
id:6, lvl:'A2', band:1,
title:'Vortfarado: unu radiko, cent vortoj',
sub:'mal-, re-, ek-, ge-, -in-, -ej-, -ist-, -il-, -et-, -eg-… · e o advérbio em -e',
focus:'word building with prefixes and suffixes mal-, re-, ek-, ge-, -in-, -ej-, -ist-, -il-, -et-, -eg-, -ul-, -an-, -ar-, -aĵ-, changing the word class with the endings -o, -a, -e, -i, adverbs in -e (bone, rapide), estas facile + infinitive',
lesson:`
<p class="lead">O segredo do esperanto não são as 16 regras, é isto: você aprende <b>uma raiz</b> e fabrica dezenas de palavras com prefixos, sufixos e terminações. Com umas 500 raízes já se conversa.</p>
<h3>Trocar a terminação já muda a palavra</h3>
<p><i>bona</i> (bom) → <i>bone</i> (bem) → <i>bono</i> (o bem) · <i>parolo</i> (fala) → <i>paroli</i> (falar) · <i>rapida</i> → <i>rapide</i> (depressa). O advérbio em <b>-e</b> modifica o verbo: <i>Ŝi parolas <b>bone</b></i>. E com «estas» + infinitivo: <i>Estas <b>facile</b> lerni Esperanton</i> (é fácil aprender esperanto).</p>
<h3>Os afixos mais úteis</h3>
<div class="tw"><table class="tbl">
<tr><th>mal-</th><td>o contrário</td><td><i>bona → malbona</i> (ruim), <i>varma → malvarma</i> (frio), <i>fermi → malfermi</i> (abrir)</td></tr>
<tr><th>-in-</th><td>feminino</td><td><i>patro → patrino</i>, <i>knabo → knabino</i>, <i>instruisto → instruistino</i></td></tr>
<tr><th>ge-</th><td>os dois sexos juntos</td><td><i>gepatroj</i> (pais), <i>gefratoj</i> (irmãos), <i>geamikoj</i></td></tr>
<tr><th>-ej-</th><td>lugar</td><td><i>lerni → lernejo</i> (escola), <i>kuiri → kuirejo</i>, <i>libro → librejo</i> (livraria)</td></tr>
<tr><th>-ist-</th><td>profissão</td><td><i>dento → dentisto</i>, <i>programi → programisto</i>, <i>muziko → muzikisto</i></td></tr>
<tr><th>-il-</th><td>instrumento</td><td><i>tranĉi → tranĉilo</i> (faca), <i>komputi → komputilo</i>, <i>flugi → flugilo</i> (asa)</td></tr>
<tr><th>-et-</th><td>diminutivo</td><td><i>domo → dometo</i>, <i>ridi → rideti</i> (sorrir), <i>pluvi → pluveti</i> (garoar)</td></tr>
<tr><th>-eg-</th><td>aumentativo</td><td><i>domo → domego</i>, <i>varma → varmega</i> (muito quente), <i>ridi → ridegi</i> (gargalhar)</td></tr>
<tr><th>re-</th><td>de novo, de volta</td><td><i>veni → reveni</i> (voltar), <i>vidi → revidi</i>: <i>Ĝis revido!</i></td></tr>
<tr><th>ek-</th><td>início, ação súbita</td><td><i>dormi → ekdormi</i> (adormecer), <i>vidi → ekvidi</i> (avistar)</td></tr>
<tr><th>-ul-</th><td>pessoa com tal qualidade</td><td><i>juna → junulo</i> (jovem), <i>riĉa → riĉulo</i>, <i>malsana → malsanulo</i> (doente)</td></tr>
<tr><th>-an-</th><td>membro, habitante</td><td><i>Brazilo → brazilano</i>, <i>klubo → klubano</i>, <i>urbo → urbano</i></td></tr>
<tr><th>-ar-</th><td>conjunto</td><td><i>arbo → arbaro</i> (floresta), <i>vorto → vortaro</i> (dicionário)</td></tr>
<tr><th>-aĵ-</th><td>coisa concreta</td><td><i>manĝi → manĝaĵo</i> (comida), <i>nova → novaĵo</i> (notícia)</td></tr>
</table></div>
<p>E tudo se combina: <i>mal + san + ul + ej + o</i> = <b>malsanulejo</b>, o lugar das pessoas doentes: hospital.</p>
<div class="trap"><span class="pen">Atenção!</span> <b>mal-</b> não quer dizer «mau»: é o oposto exato. <i>malvarma</i> = frio, <i>malmultekosta</i> = barato, <i>malfermi</i> = abrir.</div>
<div class="trap"><span class="pen">Atenção!</span> O feminino precisa de <b>-in-</b> também nas profissões: <i>Mia patrino estas instruist<b>in</b>o.</i> Sem ele, a palavra é neutra ou masculina.</div>
<div class="plus"><span class="pen">Para programadora</span> Pense nos afixos como funções: <i>-ej-(lern)</i> devolve o lugar; <i>mal-(x)</i> devolve o inverso. Treine na ferramenta <a href="#vortfarado">Vortfarado</a>.</div>
`,

text:`<p>Mia [[nevino|sobrinha]] Bia estas dekjara, kaj ŝi lernas Esperanton en la lernejo. Hieraŭ ŝi venis al mi kun [[kajero|caderno]] kaj diris: «Onklino, mi [[malkovris|descobri]] sekreton! Mi ne bezonas lerni mil vortojn. Mi lernas unu radikon, kaj mi ricevas dek vortojn [[senpage|de graça]]!»</p>

U({
id:7, lvl:'A2', band:1,
title:'La tabelvortoj',
sub:'kiu, kio, kie, kiam, ĉiu, neniu… · 45 palavras numa tabela só',
focus:'the table of correlatives (ki-, ti-, i-, ĉi-, neni- + -u, -o, -a, -e, -am, -el, -om, -es, -al), questions and answers, relative clauses with kiu, kio, kie, kiam, tio kio, tiu kiu, single negation (neniu, nenio, neniam without ne), -j and -n on correlatives, ke vs kiu',
lesson:`
<p class="lead">Em português, «quem, alguém, ninguém, todos, onde, nunca, sempre» não têm nada em comum. Em esperanto, são todos peças de uma tabela: <b>5 começos × 9 finais</b>. Aprendeu a lógica, aprendeu 45 palavras.</p>
<div class="tw"><table class="tbl">
<tr><th></th><th>ki- (pergunta)</th><th>ti- (indicação)</th><th>i- (indefinido)</th><th>ĉi- (todos)</th><th>neni- (nenhum)</th></tr>
<tr><th>-u pessoa, um</th><td>kiu quem, qual</td><td>tiu aquele, esse</td><td>iu alguém</td><td>ĉiu cada, todo</td><td>neniu ninguém</td></tr>
<tr><th>-o coisa</th><td>kio o quê</td><td>tio isso</td><td>io algo</td><td>ĉio tudo</td><td>nenio nada</td></tr>
<tr><th>-a qualidade</th><td>kia que tipo de</td><td>tia tal</td><td>ia algum tipo de</td><td>ĉia todo tipo de</td><td>nenia nenhum tipo de</td></tr>
<tr><th>-e lugar</th><td>kie onde</td><td>tie lá</td><td>ie em algum lugar</td><td>ĉie em toda parte</td><td>nenie em lugar nenhum</td></tr>
<tr><th>-am tempo</th><td>kiam quando</td><td>tiam então</td><td>iam alguma vez</td><td>ĉiam sempre</td><td>neniam nunca</td></tr>
<tr><th>-el modo</th><td>kiel como</td><td>tiel assim</td><td>iel de algum jeito</td><td>ĉiel de todo jeito</td><td>neniel de jeito nenhum</td></tr>
<tr><th>-om quantidade</th><td>kiom quanto</td><td>tiom tanto</td><td>iom um pouco</td><td>ĉiom tudo (a quantidade)</td><td>neniom nada (quantidade)</td></tr>
<tr><th>-es posse</th><td>kies de quem</td><td>ties daquele</td><td>ies de alguém</td><td>ĉies de todos</td><td>nenies de ninguém</td></tr>
<tr><th>-al causa</th><td>kial por quê</td><td>tial por isso</td><td>ial por algum motivo</td><td>ĉial por todos os motivos</td><td>nenial por motivo nenhum</td></tr>
</table></div>
<p>As de <b>-u</b> e <b>-a</b> funcionam como adjetivos e recebem <b>-j</b> e <b>-n</b>: <i>ĉiuj homoj</i> (todas as pessoas), <i>Kiun vi vidis?</i>, <i>tiajn librojn</i>. As de <b>-o</b> recebem <b>-n</b>: <i>Kion vi diris? Mi vidis nenion.</i> As de <b>-e</b> recebem -n de direção: <i>Kien vi iras?</i> (para onde?).</p>
<h3>Uma negação basta</h3>
<div class="trap"><span class="pen">A armadilha</span> «Não vi ninguém» = <i>Mi vidis <b>neniun</b></i> (ou <i>Mi ne vidis iun</i>). <s>Mi ne vidis neniun</s> tem duas negações e soa errado, como «I didn't see nobody» em inglês.</div>
<h3>Relativas: o «que» português tem três traduções</h3>
<div class="tw"><table class="tbl">
<tr><td>o livro <b>que</b> eu leio</td><td><i>la libro, <b>kiun</b> mi legas</i></td><td>pronome relativo → kiu (com -n se for objeto)</td></tr>
<tr><td>o <b>que</b> você diz</td><td><i>tio, <b>kion</b> vi diras</i></td><td>«aquilo que» → tio, kio</td></tr>
<tr><td>acho <b>que</b> é verdade</td><td><i>mi pensas, <b>ke</b> tio estas vera</i></td><td>conjunção → ke</td></tr>
</table></div>
<p>Repare na vírgula antes de <i>kiu</i> e de <i>ke</i>: em esperanto ela é a regra.</p>
<p><b>ĉi</b> aproxima: <i>tiu ĉi</i> ou <i>ĉi tiu</i> = este; <i>ĉi tie</i> = aqui; <i>tiu</i> sozinho = esse, aquele.</p>
<div class="plus"><span class="pen">Truque</span> Você já conhece cinco: <i>kiu, kio, kie, kiam, kiel</i> lembram o latim «qui, quid…». O resto é encaixe. Treine na ferramenta <a href="#tabelvortoj">Tabelvortoj</a>.</div>
`,

U({
id:8, lvl:'A2', band:1,
title:'Komparoj, -ig- kaj -iĝ-, si kaj sia',
sub:'Mais que, o mais · começar ou começar-se? · o «seu» sem ambiguidade',
focus:'comparisons pli…ol, malpli…ol, tiel…kiel, la plej…el/en, the suffixes -ig- (to make, cause) and -iĝ- (to become, happen by itself) with transitive and intransitive verbs (komenci/komenciĝi, fini/finiĝi, veki/vekiĝi, edziĝi, naskiĝi, sidiĝi, purigi), reflexive si, sin, sia in the third person',
lesson:`
<h3>Comparar</h3>
<div class="tw"><table class="tbl">
<tr><td><i>pli granda <b>ol</b></i></td><td>maior que</td></tr>
<tr><td><i>malpli granda ol</i></td><td>menor que (literalmente «menos grande que»)</td></tr>
<tr><td><i>tiel granda <b>kiel</b></i></td><td>tão grande quanto</td></tr>
<tr><td><i>la plej granda el / en</i></td><td>o maior de / em</td></tr>
<tr><td><i>pli bone, plej bone</i></td><td>melhor, da melhor maneira (advérbios)</td></tr>
</table></div>
<div class="trap"><span class="pen">Atenção!</span> O «que» da comparação é <b>ol</b>, só ele: <i>Mi estas pli alta <b>ol</b> mia frato</i>, nunca <s>pli alta ke</s>.</div>
<h3>-ig- e -iĝ-: quem faz a ação?</h3>
<p>O português usa «começar» para tudo: «eu começo a aula» e «a aula começa». O esperanto distingue:</p>
<div class="tw"><table class="tbl">
<tr><th>alguém faz algo (com objeto)</th><th>acontece sozinho (sem objeto)</th></tr>
<tr><td><i>La instruisto <b>komencas</b> la lecionon.</i></td><td><i>La leciono <b>komenciĝas</b>.</i></td></tr>
<tr><td><i>Mi <b>finis</b> la laboron.</i></td><td><i>La filmo <b>finiĝis</b>.</i></td></tr>
<tr><td><i>La horloĝo <b>vekas</b> min.</i></td><td><i>Mi <b>vekiĝas</b> je la sepa.</i></td></tr>
<tr><td><i>Ŝi <b>ŝanĝis</b> sian planon.</i></td><td><i>La vetero <b>ŝanĝiĝis</b>.</i></td></tr>
</table></div>
<p><b>-iĝ-</b> = tornar-se, acontecer, «-se»: <i>naskiĝi</i> (nascer), <i>sidiĝi</i> (sentar-se), <i>edziĝi</i> (casar-se, o homem), <i>edziniĝi</i> (casar-se, a mulher), <i>fariĝi</i> (tornar-se), <i>enamiĝi</i> (apaixonar-se). <b>-ig-</b> = fazer, tornar: <i>pura → purigi</i> (limpar), <i>granda → grandigi</i> (aumentar), <i>morti → mortigi</i> (matar), <i>sidi → sidigi</i> (fazer sentar).</p>
<h3>si e sia: o «seu» sem confusão</h3>
<p>Na <b>terceira pessoa</b>, quando o possessivo se refere ao <b>próprio sujeito</b>, use <b>sia</b>; quando é de outra pessoa, <b>lia / ŝia / ilia</b>:</p>
<div class="chips">Paŭlo vizitis <b>sian</b> patrinon. (a mãe dele mesmo) · Paŭlo vizitis <b>lian</b> patrinon. (a mãe de outro homem) · Ŝi lavas <b>sin</b>. (ela se lava)</div>
<p>Com <i>mi, vi, ni</i> não há ambiguidade, então se usa o normal: <i>Mi lavas min. Ni vizitis nian patrinon.</i></p>
<div class="trap"><span class="pen">Atenção!</span> <b>sia</b> nunca faz parte do sujeito: <i>Li kaj <b>lia</b> frato venis</i> (não <s>sia frato</s>).</div>
<div class="plus"><span class="pen">Vantagem</span> O português precisa de «dele», «dela», «dele mesmo»… O esperanto resolve com uma letra.</div>
`,

U({

title:'Se mi havus… La kondicionalo kaj la volitivo',
sub:'-us para o hipotético, -u para o que se quer · «quero que você venha»',
focus:'the conditional -us in both halves of an unreal condition (se mi havus, mi vojaĝus), real conditions with -os (se pluvos), the unreal past (se mi estus sciinta), polite requests (Ĉu vi povus…? Mi ŝatus…), the volitive -u in commands, wishes and after ke (mi volas, ke vi venu; por ke; necesas, ke), ni iru!, -u vs indicative after ke',
lesson:`
<h3>-us: o mundo do «se»</h3>
<p>O condicional é uma terminação só, <b>-us</b>, e vai nos <b>dois lados</b> da frase:</p>
<div class="chips">Se mi hav<b>us</b> tempon, mi lern<b>us</b> la japanan. (Se eu tivesse tempo, aprenderia japonês.)</div>
<p>Onde o português usa «tivesse… aprenderia» e o espanhol «tuviera… aprendería», o esperanto usa <i>-us… -us</i>. Mais fácil, impossível.</p>
<div class="trap"><span class="pen">Atenção!</span> Condição <b>real</b> no futuro usa <b>-os</b>: «se chover amanhã, fico em casa» = <i>Se pluv<b>os</b> morgaŭ, mi rest<b>os</b> hejme</i>. O português usa o futuro do subjuntivo («chover»), mas em esperanto nada de -us aqui.</div>
<p>No passado irreal, o esperanto usa <i>estus</i> + particípio: <i>Se mi estus sciinta, mi estus veninta</i> (se eu tivesse sabido, teria vindo). Na conversa, muita gente simplifica: <i>Se mi scius tion, mi venus</i>, e o contexto mostra que é passado.</p>
<h3>Cortesia</h3>
<p><i>Ĉu vi <b>povus</b> helpi min?</i> (você poderia me ajudar?) · <i>Mi <b>ŝatus</b> tason da kafo</i> (eu gostaria de…) · <i>Mi <b>volus</b> demandi ion</i>.</p>
<h3>-u: ordens, desejos e o subjuntivo português</h3>
<p>O <b>-u</b> que você conhece do imperativo («Venu!») também serve para <b>desejos e finalidades</b>. Ele traduz boa parte do subjuntivo português:</p>
<div class="tw"><table class="tbl">
<tr><td><i>Ni ir<b>u</b>!</i></td><td>Vamos!</td></tr>
<tr><td><i>Li ven<b>u</b>!</i></td><td>Que ele venha!</td></tr>
<tr><td><i>Mi volas, ke vi ven<b>u</b>.</i></td><td>Quero que você venha.</td></tr>
<tr><td><i>Estas grave, ke vi dorm<b>u</b> sufiĉe.</i></td><td>É importante que você durma bastante.</td></tr>
<tr><td><i>Mi parolas malrapide, <b>por ke</b> vi kompren<b>u</b>.</i></td><td>Falo devagar para que você entenda.</td></tr>
</table></div>
<p>Regra prática: depois de <b>ke</b>, use <b>-u</b> quando a frase principal expressa vontade, pedido, ordem, necessidade ou finalidade (<i>voli, peti, deziri, necesas, por ke</i>). Depois de verbos de dizer, saber, pensar e esperar, use o indicativo normal: <i>Mi scias, ke vi venos. Mi esperas, ke vi fartas bone.</i></p>
<div class="trap"><span class="pen">Atenção!</span> <s>Mi volas, ke vi venos</s> é o erro mais comum de quem vem do português. E o -u não tem tempo: «queria que você viesse» = <i>Mi volis, ke vi venu</i>.</div>
<div class="plus"><span class="pen">Na conversa</span> <i>Ni iru!</i>, <i>Ni vidu…</i> (vamos ver…) e <i>Estu trankvila!</i> (fique tranquila!) aparecem em toda conversa e em todo romance.</div>
`,

U({
id:10, lvl:'B1', band:2,
title:'Aktivaj participoj: -ant-, -int-, -ont-',
sub:'leganta, leginte, komencanto · O canivete suíço do esperanto',
focus:'active participles -ant- (present), -int- (past), -ont- (future) as adjectives (la leganta knabino), nouns (la parolanto, komencanto, partoprenintoj) and adverbs (legante, leginte, legonte), compound tenses with esti (mi estis manĝinta), and when the simple tenses are more natural',
lesson:`
<p class="lead">Os particípios são o que dá ao esperanto a precisão de uma língua de programação: <b>raiz + tempo + função</b>. Três vogais (a, i, o) marcam o tempo; as terminações que você já conhece (-a, -o, -e) marcam a função.</p>
<div class="tw"><table class="tbl">
<tr><th></th><th>-ant- (agora)</th><th>-int- (antes)</th><th>-ont- (depois)</th></tr>
<tr><th>-a adjetivo</th><td><i>leganta</i> que lê</td><td><i>leginta</i> que leu</td><td><i>legonta</i> que vai ler</td></tr>
<tr><th>-o pessoa</th><td><i>leganto</i> leitor</td><td><i>leginto</i> quem leu</td><td><i>legonto</i> quem vai ler</td></tr>
<tr><th>-e advérbio</th><td><i>legante</i> lendo</td><td><i>leginte</i> tendo lido</td><td><i>legonte</i> prestes a ler</td></tr>
</table></div>
<h3>O advérbio: o gerúndio português</h3>
<p><i><b>Legante</b> la ĵurnalon, li trinkis kafon</i> = lendo o jornal, ele tomou café. <i><b>Fininte</b> la laboron, ŝi iris hejmen</i> = tendo terminado (depois de terminar) o trabalho, ela foi para casa. O sujeito do particípio é sempre o sujeito da frase.</p>
<h3>O adjetivo concorda</h3>
<p><i>la dormant<b>aj</b> infanoj</i> (as crianças que dormem), <i>Mi vidis la ridant<b>an</b> knabinon</i>. E o substantivo dá nomes muito usados: <i>komencanto</i> (iniciante), <i>lernanto</i> (aluno), <i>vojaĝanto</i> (viajante), <i>partoprenantoj</i> (participantes), <i>la venonta semajno</i> (a semana que vem).</p>
<h3>Tempos compostos</h3>
<p><i>esti</i> + particípio dá nuances: <i>Kiam vi alvenis, mi jam <b>estis manĝinta</b></i> (eu já tinha comido); <i>Mi <b>estas forironta</b></i> (estou de saída). Mas na maioria das vezes os tempos simples bastam: <i>Kiam vi alvenis, mi jam manĝis.</i></p>
<div class="trap"><span class="pen">Atenção!</span> «Estou trabalhando» é <i>mi laboras</i>. <i>Mi estas laboranta</i> existe, mas soa pesado e só se usa para insistir na ação em curso.</div>
<div class="trap"><span class="pen">Atenção!</span> O advérbio termina em <b>-e</b>: <i><b>Legante</b> la leteron, ŝi ploris</i>, nunca <s>Leganta la leteron</s>. O -a só serve quando descreve um substantivo.</div>

`,

U({
id:11, lvl:'B1 → B2', band:2,
title:'Pasivaj participoj: -at-, -it-, -ot-',
sub:'La libro estis verkita de Zamenhof · voz passiva, «oni» e o «-se» português',
focus:'passive participles -at- (being done), -it- (done), -ot- (to be done), the passive voice with esti + participle and de for the agent, -ita vs -inta, oni as the natural alternative to the passive (oni parolas = fala-se), common participial adjectives (fermita, konata, ŝatata), -ind- and -end- (leginda, farenda)',
lesson:`
<p class="lead">Os particípios passivos seguem a mesma lógica dos ativos: <b>-at-</b> (agora), <b>-it-</b> (antes), <b>-ot-</b> (depois). Só que agora o substantivo <b>recebe</b> a ação.</p>
<div class="tw"><table class="tbl">
<tr><td><i>La letero estas skrib<b>at</b>a.</i></td><td>A carta está sendo escrita.</td></tr>
<tr><td><i>La letero estas skrib<b>it</b>a.</i></td><td>A carta está escrita (já foi).</td></tr>
<tr><td><i>La letero estas skrib<b>ot</b>a.</i></td><td>A carta vai ser escrita.</td></tr>
<tr><td><i>La letero est<b>is</b> skribita de Ana.</i></td><td>A carta foi escrita por Ana.</td></tr>
<tr><td><i>La letero est<b>os</b> skribita morgaŭ.</i></td><td>A carta será escrita amanhã.</td></tr>
</table></div>
<p>O agente vem com <b>de</b> (não <i>per</i>, que é instrumento): <i>La domo estis konstruita <b>de</b> mia avo</i>.</p>
<h3>-inta ou -ita?</h3>
<p>A diferença entre ativo e passivo é uma letra e muda tudo: <i>la leg<b>int</b>a studento</i> (o estudante que leu) × <i>la leg<b>it</b>a libro</i> (o livro lido). <i>La vizitinta amiko</i> visitou; <i>la vizitita amiko</i> foi visitado.</p>
<h3>Estado ou processo?</h3>
<p><i>La pordo estas ferm<b>it</b>a</i> = a porta está fechada (estado). <i>La pordo estas ferm<b>at</b>a</i> = está sendo fechada, ou costuma ser fechada. Adjetivos do dia a dia: <i>fermita, malfermita, konata</i> (conhecido), <i>amata, ŝatata</i> (preferido), <i>preta</i> (pronto, sem particípio).</p>
<h3>oni: o «-se» português</h3>
<div class="trap"><span class="pen">Atenção!</span> «Fala-se português» / «se habla español» = <i><b>Oni</b> parolas la portugalan</i>. Nunca <s>si parolas</s>: <i>si</i> é reflexivo. E o esperanto prefere <i>oni</i> ou a voz ativa à passiva: <i>Oni vendas la domon</i> soa mais natural que <i>La domo estas vendata</i>.</div>
<h3>-ind- e -end-</h3>
<p>Primos dos particípios: <i>leg<b>ind</b>a libro</i> = livro que vale a pena ler; <i>far<b>end</b>aj taskoj</i> = tarefas que precisam ser feitas; <i>vid<b>ind</b>aĵoj</i> = atrações turísticas.</p>
<div class="plus"><span class="pen">Nos textos</span> A voz passiva aparece muito em textos informativos e jornalísticos, e nas provas de leitura. Saber reconhecê-la rapidamente é o objetivo desta unidade.</div>
`,

text:`<p>La unua lernolibro de Esperanto estis eldonita en Varsovio en 1887. Ĝi estis verkita de juna [[okulisto|oftalmologista]], Ludoviko Lazaro Zamenhof, kaj subskribita per [[pseŭdonimo|pseudônimo]]: «Doktoro Esperanto», tio estas «doktoro, kiu esperas». La libreto, nun nomata «Unua Libro», enhavis gramatikon de dek ses reguloj, vortaron de ĉirkaŭ naŭcent radikoj kaj kelkajn tekstojn.</p>
<p>La libro estis rapide tradukita al pluraj lingvoj, kaj en la sekvaj jaroj aperis la unuaj kluboj kaj revuoj. Sed kun la sukceso venis ankaŭ danĝero: ĉiu nova parolanto volis ŝanĝi ion. Novaj proponoj estis faritaj preskaŭ ĉiusemajne, kaj la lingvo riskis [[disfali|desintegrar-se]] en dialektojn.</p>
<p>Por eviti tion, en 1905 Zamenhof publikigis la «Fundamenton de Esperanto», kiu estis oficiale akceptita dum la unua Universala Kongreso, en Bulonjo-ĉe-Maro, Francio. La Fundamento estas konsiderata [[netuŝebla|intocável]]: oni povas aldoni novajn vortojn, sed la bazaj reguloj ne estas ŝanĝotaj. Ĝuste tial teksto skribita antaŭ cent jaroj estas ankoraŭ facile legebla hodiaŭ.</p>`,

U({
id:12, lvl:'B2', band:2,
title:'Nuancoj: nerekta parolo, ja, eĉ, tamen',
sub:'«Ele disse que viria» sem mudar o tempo · partículas e os afixos que faltavam',
focus:'reported speech without tense shift (li diris, ke li venos), indirect questions with ĉu (ŝi demandis, ĉu…), the position of ankaŭ, nur and eĉ before the word they modify, particles ja, do, tamen, ajn (kiu ajn, iam ajn), and advanced affixes -ebl-, -ind-, -end-, -em-, -ec-, -ad-, -estr-, -uj-, -id-, dis-, eks-, fi-, mis-, pra-, bo-',
lesson:`
<h3>Discurso indireto: o tempo não muda</h3>
<p>O português (e o espanhol, e o italiano) recuam o tempo verbal: «Vou» → «disse que <b>iria</b>». O esperanto mantém o tempo da frase original:</p>
<div class="tw"><table class="tbl">
<tr><td>Li diris: «Mi ven<b>os</b>.»</td><td>→ <i>Li diris, ke li ven<b>os</b>.</i></td><td>Ele disse que viria.</td></tr>
<tr><td>Ŝi diris: «Mi est<b>as</b> laca.»</td><td>→ <i>Ŝi diris, ke ŝi est<b>as</b> laca.</i></td><td>Ela disse que estava cansada.</td></tr>
<tr><td>Ili diris: «Ni vid<b>is</b> lin.»</td><td>→ <i>Ili diris, ke ili vid<b>is</b> lin.</i></td><td>Disseram que o tinham visto.</td></tr>
</table></div>
<div class="trap"><span class="pen">A armadilha</span> <s>Li diris, ke li venus</s> significa «disse que viria <i>se pudesse</i>», uma hipótese. Para relatar, mantenha o <i>-os</i>.</div>
<h3>Perguntas indiretas: ĉu = «se»</h3>
<p>«Perguntou <b>se</b> eu estava cansada» = <i>Ŝi demandis, <b>ĉu</b> mi estas laca</i>. «Não sei <b>se</b> ele vem» = <i>Mi ne scias, <b>ĉu</b> li venos</i>. O <i>se</i> do esperanto é só condição (unidade 9); para perguntas, <b>ĉu</b>.</p>
<h3>ankaŭ, nur, eĉ: antes da palavra que modificam</h3>
<div class="chips"><b>Ankaŭ</b> mi venos. (eu também, além de vocês) · Mi <b>ankaŭ</b> venos. (também virei, além de outras coisas) · <b>Nur</b> mi parolis. (só eu) · Mi <b>nur</b> parolis. (só falei) · <b>Eĉ</b> la infanoj komprenis. (até as crianças)</div>
<h3>Partículas que dão cor</h3>
<div class="tw"><table class="tbl">
<tr><th>ja</th><td>de fato, bem que (ênfase)</td><td><i>Mi <b>ja</b> diris al vi!</i> Eu bem que te disse!</td></tr>
<tr><th>tamen</th><td>porém, mesmo assim</td><td><i>Pluvis, <b>tamen</b> ni promenis.</i></td></tr>
<tr><th>do</th><td>então, portanto</td><td><i>Vi estas laca, <b>do</b> ripozu.</i></td></tr>
<tr><th>ajn</th><td>qualquer</td><td><i>kiu <b>ajn</b></i> (qualquer um), <i>iam ajn</i>, <i>kie ajn</i></td></tr>
</table></div>
<div class="trap"><span class="pen">Falsos amigos</span> <b>ja</b> ≠ «já» (já = <i>jam</i>). <b>tamen</b> ≠ «também» (também = <i>ankaŭ</i>).</div>
<h3>Mais afixos</h3>
<div class="tw"><table class="tbl">
<tr><th>-ebl-</th><td>possível</td><td><i>legebla</i> (legível), <i>manĝebla</i> (comestível)</td></tr>
<tr><th>-em-</th><td>tendência</td><td><i>laborema</i> (trabalhador), <i>dormema</i> (sonolento)</td></tr>
<tr><th>-ec-</th><td>qualidade abstrata</td><td><i>beleco</i> (beleza), <i>amikeco</i> (amizade)</td></tr>
<tr><th>-ad-</th><td>ação contínua</td><td><i>paroladi</i> (falar longamente), <i>parolado</i> (discurso), <i>dancado</i></td></tr>
<tr><th>-estr-</th><td>chefe</td><td><i>lernejestro</i> (diretor de escola), <i>urbestro</i> (prefeito)</td></tr>
<tr><th>-uj-</th><td>recipiente, país</td><td><i>monujo</i> (carteira), <i>Esperantujo</i></td></tr>

text:`<p>Lastan monaton nia revuo intervjuis Sofian Kovač, programistinon kaj esperantistinon el Zagrebo, kiu laboras pri lingvaj teknologioj. Ni demandis ŝin, ĉu Esperanto ankoraŭ havas sencon nun, kiam ĉiu poŝtelefono tradukas tuj.</p>
<p>Sofia ridetis kaj diris, ke ŝi aŭdas tiun demandon almenaŭ unufoje semajne. «Maŝina tradukado estas mirinda ilo», ŝi klarigis, «kaj mi uzas ĝin ĉiutage. Sed traduki ne estas la sama afero kiel komuniki. Kiam du homoj parolas per maŝino, ĉiu restas en sia propra lingvo, kaj iom da la homa kontakto perdiĝas.»</p>
<p>Laŭ ŝi, la vera valoro de Esperanto ne estas nur praktika. «Ĝi estas lingvo, kiu apartenas al neniu nacio. Kiam mi parolas ĝin kun japano aŭ brazilano, ni ambaŭ faras la saman [[penon|esforço]], kaj neniu havas avantaĝon.» Ŝi aldonis, ke ekzistas eĉ [[denaskaj|nativos, de nascença]] parolantoj: infanoj de internaciaj paroj, kiuj ja kreskas kun Esperanto hejme. Kaj multaj lernantoj trovas en ĝi [[ŝtupon|degrau]] al aliaj lingvoj: «Kiu ajn komprenis la akuzativon en Esperanto, poste lernas la germanan pli facile.»</p>
<p>Tamen ŝi ne kaŝis la problemojn. Ŝi konfesis, ke la movado estas malgranda kaj ofte maljuna, kaj ke ĝi devas esti pli videbla en la reto. «Ni ne bezonas konvinki la tutan mondon», ŝi konkludis. «Sufiĉas, ke ĉiu nova parolanto trovu tie amikojn. Tio jam okazas, do mi estas optimisma.»</p>`,

p:[
["Ludoviko Lazaro Zamenhof naskiĝis en 1859 en Bjalistoko, urbo tiam en la Rusa Imperio kaj hodiaŭ en Pollando. En lia urbo oni parolis la polan, la rusan, la jidan kaj la germanan, kaj la diversaj grupoj ofte malamis unu la alian. La juna Zamenhof kredis, ke parto de la problemo estas la [[malkompreno|falta de entendimento]].","Ludwik Lejzer Zamenhof nasceu em 1859 em Białystok, cidade então no Império Russo e hoje na Polônia. Na sua cidade se falavam polonês, russo, iídiche e alemão, e os diferentes grupos muitas vezes se odiavam. O jovem Zamenhof acreditava que parte do problema era a falta de entendimento."],
["Dum la tuta junaĝo li laboris pri neŭtrala lingvo, kiu apartenus al neniu popolo. Fine, en julio 1887, li publikigis en Varsovio la «Unuan Libron», per la pseŭdonimo «Doktoro Esperanto». La nomo de la aŭtoro rapide fariĝis la nomo de la lingvo.","Durante toda a juventude ele trabalhou numa língua neutra, que não pertencesse a nenhum povo. Finalmente, em julho de 1887, publicou em Varsóvia o «Primeiro Livro», sob o pseudônimo «Doktoro Esperanto». O nome do autor logo virou o nome da língua."],
["Zamenhof estis okulisto, kaj li neniam riĉiĝis per sia lingvo: li [[rezignis|renunciou]] pri ĉiuj aŭtoraj rajtoj. Li mortis en 1917. Lia naskiĝtago, la 15-a de decembro, estas hodiaŭ la Zamenhofa Tago, festata de esperantistoj en la tuta mondo.","Zamenhof era oftalmologista e nunca enriqueceu com a sua língua: renunciou a todos os direitos autorais. Morreu em 1917. O dia do seu aniversário, 15 de dezembro, é hoje o Dia de Zamenhof, festejado por esperantistas no mundo todo."]
