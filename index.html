{t:'La 16 reguloj kaj la Fundamento', pt:'Por que o esperanto não virou dialetos', tag:'Historio',
p:[
["La gramatiko de la «Unua Libro» havis nur dek ses regulojn. Ili diras, ekzemple, ke ĉiuj substantivoj finiĝas per -o, ke la akcento estas ĉiam sur la antaŭlasta silabo kaj ke ĉiu vorto estas legata tiel, kiel ĝi estas skribita.","A gramática do «Primeiro Livro» tinha só dezesseis regras. Elas dizem, por exemplo, que todos os substantivos terminam em -o, que o acento cai sempre na penúltima sílaba e que toda palavra é lida como é escrita."],
["Kiam la lingvo disvastiĝis, multaj volis «plibonigi» ĝin. En 1905, en la unua Universala Kongreso en Bulonjo-ĉe-Maro, la esperantistoj akceptis la «Fundamenton de Esperanto»: aron de bazaj tekstoj, kiujn neniu rajtas ŝanĝi. Oni povas aldoni vortojn, sed ne forigi la malnovajn.","Quando a língua se espalhou, muitos quiseram «melhorá-la». Em 1905, no primeiro Congresso Universal, em Boulogne-sur-Mer, os esperantistas aprovaram o «Fundamento do Esperanto»: um conjunto de textos básicos que ninguém tem o direito de mudar. Pode-se acrescentar palavras, mas não eliminar as antigas."],
["Tial la lingvo evoluas kiel vivanta lingvo, sed restas stabila. Hodiaŭ la Akademio de Esperanto gardas la Fundamenton kaj konsilas pri la uzo. Kaj ĝuste tial vi povas legi tekston de 1910 sen vortaro.","Por isso a língua evolui como uma língua viva, mas continua estável. Hoje a Academia de Esperanto guarda o Fundamento e dá orientações sobre o uso. E é justamente por isso que você pode ler um texto de 1910 sem dicionário."]
],
curio:['Em 1907 surgiu o Ido, uma «reforma» do esperanto; alguns esperantistas mudaram, mas o esperanto continuou bem maior.','A ideia de não poder apagar nada lembra a compatibilidade retroativa de uma linguagem de programação.','A Academia de Esperanto nasceu do «Lingva Komitato», o comitê linguístico criado em 1905.'],

{t:'La verda stelo kaj La Espero', pt:'Os símbolos do movimento', tag:'Simboloj',
p:[
["La plej konata simbolo de Esperanto estas la verda stelo kun kvin pintoj. La verdo signifas esperon, kaj la kvin pintoj reprezentas la kvin kontinentojn. Ofte oni vidas ĝin sur [[insignoj|broches, distintivos]], T-ĉemizoj kaj aŭtoj, por ke aliaj esperantistoj rekonu la portanton.","O símbolo mais conhecido do esperanto é a estrela verde de cinco pontas. O verde significa esperança, e as cinco pontas representam os cinco continentes. Muitas vezes ela aparece em broches, camisetas e carros, para que outros esperantistas reconheçam quem a usa."],
["La esperanta flago estas verda, kun blanka kvadrato en la supra maldekstra angulo, kaj en la kvadrato estas la verda stelo. La blanko reprezentas pacon kaj neŭtralecon.","A bandeira do esperanto é verde, com um quadrado branco no canto superior esquerdo, e no quadrado está a estrela verde. O branco representa a paz e a neutralidade."],
["La himno de la movado nomiĝas «La Espero». La vortojn verkis Zamenhof mem, kaj la plej konata melodio estas de la franca komponisto Félicien Menu de Ménil. Ĝi estas kantata en la malfermo de la kongresoj, ofte kun larmoj en la okuloj.","O hino do movimento se chama «La Espero» (A Esperança). A letra foi escrita pelo próprio Zamenhof, e a melodia mais conhecida é do compositor francês Félicien Menu de Ménil. Ele é cantado na abertura dos congressos, muitas vezes com lágrimas nos olhos."]
],

["Brazilo gastigis du Universalajn Kongresojn: en Braziljo en 1981 kaj en Fortalezo en 2002. Krom la UK ekzistas multaj aliaj renkontiĝoj, ekzemple la Internacia Junulara Kongreso por gejunuloj kaj la Tut-Amerika Kongreso.","O Brasil sediou dois Congressos Universais: em Brasília, em 1981, e em Fortaleza, em 2002. Além do UK existem muitos outros encontros, por exemplo o Congresso Internacional da Juventude e o Congresso Pan-Americano."],

{t:'Pasporta Servo kaj vojaĝi', pt:'Dormir de graça na casa de esperantistas', tag:'Movado',
p:[
["Pasporta Servo estas reto de gastigantoj: esperantistoj en pli ol cent landoj, kiuj senpage akceptas aliajn esperantistojn en sia hejmo dum kelkaj tagoj. Ĝi ekzistas de la 1970-aj jaroj kaj estas prizorgata de TEJO, la Tutmonda Esperantista Junulara Organizo.","O Pasporta Servo é uma rede de anfitriões: esperantistas em mais de cem países que recebem gratuitamente outros esperantistas em casa por alguns dias. Existe desde os anos 1970 e é mantido pela TEJO, a Organização Mundial da Juventude Esperantista."],
["La regulo estas simpla: la gasto ne pagas, sed li aŭ ŝi devas paroli Esperanton kun la gastigantoj. Multaj vojaĝantoj diras, ke tio estas la plej bona maniero koni landon: ne kiel turisto, sed kiel amiko de la familio.","A regra é simples: o hóspede não paga, mas precisa falar esperanto com os anfitriões. Muitos viajantes dizem que é a melhor maneira de conhecer um país: não como turista, mas como amigo da família."],
["Antaŭ la interreto, la gastigantoj estis listigitaj en papera libreto. Hodiaŭ ĉio estas en retejo kaj aplikaĵo, kaj aplikaĵoj kiel Amikumu helpas trovi esperantistojn proksime al vi.","Antes da internet, os anfitriões ficavam listados num livrinho de papel. Hoje tudo está num site e num aplicativo, e aplicativos como o Amikumu ajudam a encontrar esperantistas perto de você."]
],
curio:['O Pasporta Servo já funcionava décadas antes de redes como o Couchsurfing existirem.','É educado levar um pequeno presente do seu país: brigadeiro faz sucesso garantido.','O hóspede e o anfitrião combinam tudo antes: datas, número de noites, regras da casa.'],
w:[["reto","rede"],["gastiganto","anfitrião"],["gasto","hóspede"],["senpage","de graça"],["maniero","maneira"],["proksime","perto"]],
q:[["Kion la gasto devas fari en Pasporta Servo?",["Pagi la gastigantojn","Paroli Esperanton kun ili","Kuiri ĉiutage","Resti unu monaton"],1],["Kiu prizorgas Pasportan Servon?",["UEA","TEJO","La Akademio","La registaro"],1],["Kio estis antaŭ la interreto?",["Papera libreto","Radio","Telefono","Nenio"],0]]},
{t:'Esperanto en Brazilo', pt:'Um dos movimentos mais antigos e fortes do mundo', tag:'Brazilo',
p:[
["Esperanto alvenis en Brazilon jam komence de la 20-a jarcento. La unuaj kluboj aperis en 1906, en Campinas kaj en Rio-de-Ĵanejro, kaj en julio 1907 oni fondis en Rio la ligon, kiu hodiaŭ nomiĝas Brazila Esperanto-Ligo (BEL).","O esperanto chegou ao Brasil já no começo do século 20. Os primeiros clubes surgiram em 1906, em Campinas e no Rio de Janeiro, e em julho de 1907 foi fundada no Rio a liga que hoje se chama Liga Brasileira de Esperanto (BEL)."],
["Brazilo havas unu el la plej grandaj esperantistaj komunumoj de la mondo. Parto de tio venas de la spiritisma movado, kiu de jardekoj subtenas Esperanton per kursoj, libroj kaj eldonejoj. Sed ekzistas ankaŭ multaj laikaj kluboj, universitataj grupoj kaj junulaj renkontiĝoj.","O Brasil tem uma das maiores comunidades esperantistas do mundo. Parte disso vem do movimento espírita, que há décadas apoia o esperanto com cursos, livros e editoras. Mas existem também muitos clubes laicos, grupos universitários e encontros de jovens."],
["Por brazilanoj, Esperanto estas aparte facila: la sonoj similas al la portugalaj, kaj grandega parto de la vortoj havas latinan devenon. Hodiaŭ oni povas lerni ĝin senpage per la portugala, ekzemple en Duolingo kaj en lernu.net, kaj trovi lokajn klubojn en preskaŭ ĉiuj ŝtatoj.","Para brasileiros, o esperanto é especialmente fácil: os sons parecem os do português, e uma parte enorme das palavras tem origem latina. Hoje é possível aprendê-lo de graça a partir do português, por exemplo no Duolingo e no lernu.net, e encontrar clubes locais em quase todos os estados."]
],
curio:['A Federação Espírita Brasileira publica livros em esperanto há décadas, inclusive traduções e obras originais.','A revista «Brazila Esperantisto» é publicada desde 1907.','O exame internacional de esperanto (KER) também é aplicado no Brasil.'],
w:[["jarcento","século"],["ligo","liga"],["komunumo","comunidade"],["subteni","apoiar"],["eldonejo","editora"],["deveno","origem"]],
q:[["Kiam estis fondita la brazila ligo?",["En 1887","En 1907","En 1981","En 2002"],1],["Kiu movado multe subtenas Esperanton en Brazilo?",["La sporta","La spiritisma","La muzika","La politika"],1],["Kial Esperanto estas facila por brazilanoj?",["Ĉar ĝi estas brazila lingvo","Ĉar la sonoj kaj multaj vortoj similas al la portugalaj","Ĉar ĝi ne havas gramatikon","Ĉar ĉiuj lernas ĝin en la lernejo"],1]]},
{t:'Libroj kaj muziko', pt:'Uma cultura de mais de um século', tag:'Kulturo',
p:[
["En Esperanto ekzistas dekmiloj da libroj: tradukoj de la mondliteraturo kaj ankaŭ originalaj verkoj. La skota poeto William Auld estis pluroble proponita por la Nobel-premio pri literaturo, kaj liaj poemoj estas klasikaĵoj. Por komencantoj, la plej fama romano estas «Gerda malaperis!» de Claude Piron, krimromano verkita per malmultaj vortoj.","Em esperanto existem dezenas de milhares de livros: traduções da literatura mundial e também obras originais. O poeta escocês William Auld foi indicado várias vezes ao Nobel de literatura, e seus poemas são clássicos. Para iniciantes, o romance mais famoso é «Gerda malaperis!» (Gerda desapareceu!), de Claude Piron, um romance policial escrito com poucas palavras."],
["La muziko estas ankoraŭ pli viva. Ekzistas rokgrupoj, repistoj, popkantistoj kaj kantistoj de popolmuziko, el Francio, Brazilo, Svedio kaj Japanio. La eldonejo Vinilkosmo publikigis centojn da albumoj, kaj vi povas aŭskulti multajn el ili senpage en la reto.","A música é ainda mais viva. Existem bandas de rock, rappers, cantores pop e de música folclórica, da França, do Brasil, da Suécia e do Japão. A gravadora Vinilkosmo publicou centenas de álbuns, e você pode ouvir muitos deles de graça na internet."],
["Ekzistas ankaŭ filmoj, podkastoj kaj kanaloj en Jutubo. Por lernanto tio estas trezoro: oni povas aŭskulti la lingvon en veraj situacioj, kun diversaj akĉentoj, kaj kompreni, ke Esperanto ne estas nur lernolibra lingvo.","Existem também filmes, podcasts e canais no YouTube. Para quem aprende isso é um tesouro: dá para ouvir a língua em situações reais, com vários sotaques, e entender que o esperanto não é só língua de livro didático."]
],
curio:['O filme «Incubus» (1966), com William Shatner, foi rodado inteiramente em esperanto.','Claude Piron, o autor de «Gerda malaperis!», era psicólogo e trabalhou como tradutor na ONU.','O site «Muzaiko» foi uma rádio online que tocava música em esperanto 24 horas por dia.'],
w:[["verko","obra"],["traduko","tradução"],["romano","romance (livro)"],["krimromano","romance policial"],["kantisto","cantor"],["trezoro","tesouro"]],
q:[["Kiu estas «Gerda malaperis!»?",["Poemo de William Auld","Romano por komencantoj de Claude Piron","Filmo","Kanto"],1],["Kio estas Vinilkosmo?",["Muzika eldonejo","Kongreso","Vortaro","Radio"],0],["Kial la muziko kaj filmoj estas trezoro por lernantoj?",["Ĉar ili estas senpagaj","Ĉar oni aŭdas la lingvon en veraj situacioj","Ĉar ili estas mallongaj","Ĉar ili estas en la portugala"],1]]},
{t:'Esperanto hodiaŭ', pt:'Wikipedia, apps e falantes nativos', tag:'Hodiaŭ',
p:[
["Neniu scias precize, kiom da homoj parolas Esperanton: la taksoj varias de centmiloj ĝis du milionoj. Certe estas, ke ĝi estas la plej parolata planita lingvo de la mondo, kaj ke ĝi havas eĉ denaskajn parolantojn, kiuj kreskis kun ĝi hejme.","Ninguém sabe exatamente quantas pessoas falam esperanto: as estimativas variam de centenas de milhares a dois milhões. O certo é que é a língua planejada mais falada do mundo, e que tem até falantes nativos, que cresceram com ela em casa."],
["La Vikipedio en Esperanto havas pli ol tricent okdek mil artikolojn: ĝi estas la plej granda Vikipedio en planita lingvo. Kursoj en Duolingo, lernu.net kaj aliaj retejoj havas centmilojn da lernantoj, kaj multaj el ili poste partoprenas en retaj babilejoj kaj renkontiĝoj.","A Wikipedia em esperanto tem mais de trezentos e oitenta mil artigos: é a maior Wikipedia numa língua planejada. Cursos no Duolingo, no lernu.net e em outros sites têm centenas de milhares de alunos, e muitos deles depois participam de chats e encontros."],
["UNESKO rekonis la valoron de Esperanto per rezolucioj en 1954 kaj 1985. Sed la plej grava forto de la lingvo ne estas oficiala: ĝi estas la komunumo de homoj, kiuj elektis lerni ĝin libervole, kaj kiuj ĝojas renkonti iun novan, kiu diras «Saluton!».","A UNESCO reconheceu o valor do esperanto em resoluções de 1954 e 1985. Mas a maior força da língua não é oficial: é a comunidade de pessoas que escolheram aprendê-la por vontade própria, e que ficam felizes ao encontrar alguém novo que diz «Saluton!»."]
],
curio:['A Wikipedia em esperanto começou em 2001, uma das primeiras edições da enciclopédia.','O Google Tradutor inclui o esperanto desde 2012.','Muitos falantes nativos são filhos de casais que se conheceram em encontros esperantistas.'],

{t:'Vojaĝo al Lisbono', lvl:'A2', text:`Kiam mi alvenis en Lisbonon, la suno jam subiris. Mia gastiganto, Jozefo, atendis min ĉe la stacio kun verda stelo sur la ĉemizo.

{t:'La krokodilo', lvl:'A2', text:`En esperantaj renkontiĝoj oni ofte aŭdas strangan vorton: krokodili. Krokodili signifas paroli sian gepatran lingvon inter esperantistoj, anstataŭ Esperanto.

{t:'La lasta trajno', lvl:'B1', text:`Elirinte el la teatro, Klara rimarkis, ke ŝia telefono estas malŝargita. La lasta trajno foriros post duonhoro, do ŝi rapidis tra la malplenaj stratoj.

{t:'Kial mi lernas Esperanton', lvl:'B1', text:`Oni ofte demandas min, kial mi lernas Esperanton, se mi jam parolas la portugalan, la hispanan kaj iom la italan. La respondo estas simpla: ĉar ĝi estas la plej demokrata lingvo, kiun mi konas.

En Esperanto neniu estas indiĝeno kaj neniu estas fremdulo. Kiam mi parolas kun japanino aŭ kun polo, ni ambaŭ faris la saman vojon por renkontiĝi en la mezo.

{t:'La biblioteko, kiu neniam fermiĝas', lvl:'B2', text:`En malgranda germana urbo, volontuloj prizorgas unu el la plej grandaj esperantaj bibliotekoj de la mondo. Ĉiujare ili ricevas centojn da pakaĵoj: romanojn, poemarojn, revuojn kaj leterojn, ofte donacitajn de familioj de forpasintaj esperantistoj.

La plej granda defio ne estas la spaco, sed la tempo. Necesas katalogi ĉion, por ke esploristoj povu trovi la librojn, kaj skani la plej malnovajn, antaŭ ol la papero disfalos.

Se la projekto sukcesos, iu ajn, en iu ajn lando, povos legi tiujn tekstojn senpage. Tio estas la revo de la volontuloj: biblioteko, kiu neniam fermiĝas.`,
pron:['vo-lon-TU-loj','po-e-MA-rojn','for-pa-SIN-taj','ka-ta-LO-gi','dis-FA-los'],
ask:['Kiun libron vi savus el brulanta biblioteko?','Ĉu vi preferas paperajn aŭ elektronikajn librojn? Kial?','Kion vi farus kiel volontulo?']},
{t:'Maŝinoj kaj homoj', lvl:'B2', text:`Nun, kiam ĉiu poŝtelefono tradukas tuj, multaj demandas, ĉu ankoraŭ valoras lerni lingvojn. Laŭ mi, la demando mem montras miskomprenon: lingvo ne estas nur kodo por transdoni informojn.

Kiam mi parolas rekte kun iu, mi aŭdas ne nur liajn vortojn, sed ankaŭ lian humoron, liajn hezitojn, liajn ŝercojn. La maŝino tradukas la frazon, sed perdas la homon.

Tamen mi ne estas kontraŭ la teknologio. Mi uzas ĝin ĉiutage en mia laboro. Mi simple kredas, ke la plej bona tradukilo ankoraŭ estas homo, kiu volas kompreni alian homon.`,

{id:'mc-b1', type:'mc', lvl:'B1', minutes:15, title:'La kafejo de la lingvoj',
text:`<p>Antaŭ tri jaroj Mirela, rumana studentino en Liono, malfermis strangan kafejon. Ĉe ĉiu tablo estas flageto, kiu montras la lingvon de tiu tablo: la hispana, la germana, la japana… kaj ĉe la tablo apud la fenestro, Esperanto. La regulo estas simpla: kiu sidas ĉe tablo, devas paroli ties lingvon, eĉ se nur iomete.</p>
<p>«Komence mi pensis, ke venos nur studentoj», ŝi rakontas. «Sed baldaŭ aperis pensiuloj, turistoj, eĉ komercistoj, kiuj volis praktiki antaŭ vojaĝo.» Hodiaŭ la kafejo havas ĉirkaŭ tricent regulajn klientojn, kaj vendrede vespere oni devas atendi por trovi lokon.</p>
<p>La esperanta tablo havas apartan historion. Mirela mem ne parolis Esperanton, kiam ŝi malfermis la kafejon; ŝi aldonis la flageton nur post kiam maljuna kliento petis ĝin. «Li venis ĉiusemajne kaj sidis sola, ĝis alvenis du junaj ĉeĥoj, kiuj lernis la lingvon rete. Nun estas la plej brua tablo de la kafejo», ŝi diras ridante.</p>
<p>Ne ĉio estas facila. La enspezoj apenaŭ sufiĉas por pagi la lupagon, kaj Mirela laboras dek du horojn tage. Tamen ŝi ne pensas pri fermo. «Ĉi tie mi vidas homojn, kiuj timis paroli, fariĝi pli kuraĝaj. Tio valoras pli ol mono.»</p>`,

{id:'tf-b1', type:'tfng', lvl:'B1', minutes:12, title:'La unuaj jaroj de Esperanto en Brazilo',
text:`<p>Esperanto alvenis en Brazilon komence de la dudeka jarcento, kiam kelkaj intelektuloj legis pri ĝi en eŭropaj revuoj. En 1906 aperis la unuaj kluboj: unu en Campinas, en la ŝtato San-Paŭlo, kaj alia en Rio-de-Ĵanejro, tiam la ĉefurbo de la lando.</p>
<p>La sekvan jaron, en julio 1907, grupo de entuziasmuloj fondis en Rio nacian ligon, por kunordigi la kursojn kaj la eldonadon de libroj. La organizo, kiu poste ricevis la nomon Brazila Esperanto-Ligo, ekeldonis ankaŭ revuon, «Brazila Esperantisto», kiu aperas ĝis hodiaŭ.</p>
<p>Dum la sekvaj jardekoj la movado kreskis precipe en la grandaj urboj. Multaj kursoj okazis en lernejoj kaj kluboj, kaj baldaŭ ankaŭ la spiritisma movado komencis subteni la lingvon. Tiu subteno daŭras ĝis nun kaj klarigas, parte, kial Brazilo hodiaŭ havas unu el la plej grandaj esperantistaj komunumoj de la mondo.</p>
<p>La brazilaj esperantistoj gastigis la Universalan Kongreson du fojojn: en Braziljo en 1981 kaj en Fortalezo en 2002. En ambaŭ okazoj venis pli ol mil kvarcent kongresanoj el multaj landoj.</p>`,

["A","Rafael, 29, flegisto",`<p>Mi lernas per serioj. Unue mi spektas kun subtekstoj en mia lingvo, poste kun subtekstoj en la lernata lingvo, kaj fine tute sen subtekstoj. Mi notas en kajero ĉiun esprimon, kiu plaĉas al mi, kaj mi uzas ĝin la saman tagon, eĉ se nur parolante al mia kato. Gramatikon mi preskaŭ neniam studas: mi lernas ĝin per la oreloj.</p>`],
["B","Sun, 41, inĝenierino",`<p>Mi bezonas strukturon. Ĉiumatene, antaŭ la laboro, mi faras duonhoron da gramatikaj ekzercoj, kaj mi uzas aplikaĵon kun kartoj por la vortoj. Mi konfesas, ke mi timas paroli: mi preferas skribi retmesaĝojn, ĉar tiel mi havas tempon por pensi. Mia celo estas trapasi oficialan ekzamenon la venontan jaron.</p>`],
["C","Teodoro, 63, emerita instruisto",`<p>Mi lernas per la piedoj! Tri aŭ kvar fojojn jare mi vojaĝas, ĉiam al lando, kies lingvon mi ne konas, kaj mi lernas la bazon surloke, babilante kun vendistoj kaj najbaroj. Mi faras multajn erarojn, sed la homoj ĉiam ĝojas, ke fremdulo provas paroli kun ili. Hejme mi preskaŭ neniam studas.</p>`],
["D","Lívia, 24, studentino",`<p>Mi lernas per legado. Mi komencis per bildstrioj, poste legis simpligitajn romanojn, kaj nun mi legas la originalojn. Kiam mi ne konas vorton, mi ne tuj serĉas ĝin: mi provas diveni ĝin el la kunteksto, kaj nur post la fino de la ĉapitro mi kontrolas en la vortaro. Mi ankaŭ tenas taglibron en la lingvo, kiun mi lernas.</p>`]
],
q:[
["Kiu ne tuj serĉas nekonatajn vortojn?",3,"Lívia: «mi ne tuj serĉas ĝin: mi provas diveni ĝin el la kunteksto»."],

{id:'mc-b2', type:'mc', lvl:'B2', minutes:18, title:'La lingvo, kiun neniu posedas',
text:`<p>Kiam oni demandas al esperantistoj, kial ili elektis lingvon, kiun parolas relative malmultaj homoj, la respondoj ofte surprizas. Malofte ili parolas pri praktikeco aŭ pri vojaĝoj. Pli ofte ili mencias sentojn: la plezuron de egaleco, la senton, ke en Esperanto neniu estas «hejme» pli ol la aliaj.</p>
<p>Lingvistoj, kiuj esploris la komunumon, rimarkis interesan fenomenon. Ĉar ĉiu parolanto lernis la lingvon konscie, la parolantoj emas esti pli toleremaj al eraroj ol la parolantoj de naciaj lingvoj. Denaska anglalingvano facile ridetas pri fremda akcento; esperantisto, kontraŭe, memoras la proprajn unuajn paŝojn kaj pacience atendas.</p>
<p>Tio tamen ne signifas, ke ĉio estas permesata. La komunumo havas fortan senton pri «bona lingvo», kaj publikaj diskutoj pri vortoj aŭ gramatikaj detaloj povas daŭri jarojn. Paradokse, la lingvo, kiun neniu posedas, havas multajn zorgemajn gardantojn.</p>
<p>Kritikantoj asertas, ke tia komunumo restas fermita en si mem: ĝi parolas pri internacia komunikado, sed ĉefe komunikas kun si. La esperantistoj respondas, ke ĉiu lingva komunumo estas iusence fermita, kaj ke la vera demando ne estas la grandeco de la komunumo, sed la kvalito de la rilatoj, kiujn ĝi ebligas.</p>`,
q:[
["Kion la esperantistoj plej ofte mencias, laŭ la teksto?",["Praktikajn avantaĝojn","Vojaĝojn","Sentojn de egaleco","Profesiajn ŝancojn"],2,"«Pli ofte ili mencias sentojn: la plezuron de egaleco…»."],
["Kial esperantistoj estas pli toleremaj al eraroj?",["Ĉar la lingvo ne havas regulojn","Ĉar ĉiuj lernis ĝin konscie kaj memoras siajn unuajn paŝojn","Ĉar ili ne komprenas la erarojn","Ĉar ili estas lingvistoj"],1,"«…memoras la proprajn unuajn paŝojn kaj pacience atendas»."],
["Kion signifas «ne ĉio estas permesata» en la tria alineo?",["Ke la komunumo ankaŭ zorgas pri la lingva kvalito","Ke oni malpermesas erarojn","Ke ekzistas leĝoj kontraŭ akcentoj","Ke la Akademio punas la parolantojn"],0,"Existe uma forte noção de «bona lingvo» e longas discussões."],
["Kio estas la «paradokso» menciita?",["La lingvo estas malnova sed moderna","Neniu posedas la lingvon, sed multaj gardas ĝin","La komunumo estas granda sed malgranda","La gramatiko estas facila sed malfacila"],1,"«…la lingvo, kiun neniu posedas, havas multajn zorgemajn gardantojn»."],
["Kion asertas la kritikantoj?",["Ke Esperanto estas tro facila","Ke la komunumo ĉefe komunikas kun si mem","Ke la lingvo ne havas literaturon","Ke la esperantistoj ne vojaĝas"],1,"«…ĝi parolas pri internacia komunikado, sed ĉefe komunikas kun si»."],
["Kiel la esperantistoj respondas al la kritiko?",["Ili konfesas, ke la kritiko pravas","Ili diras, ke gravas la kvalito de la rilatoj, ne la grandeco","Ili promesas kreskigi la komunumon","Ili ignoras ĝin"],1,"«…la vera demando ne estas la grandeco… sed la kvalito de la rilatoj»."]
]},
{id:'mt-b2', type:'match', lvl:'B2', minutes:15, title:'Kial mi lernis Esperanton',
sections:[
["A","Hiroko, 45, kuracistino",`<p>Mi komencis pro scivolemo, post kiam mi legis artikolon pri Zamenhof. Mi ne atendis, ke la lingvo ŝanĝos mian vivon. Sed en mia unua kongreso mi renkontis kolegojn el dek landoj, kaj hodiaŭ ni kune verkas fakajn artikolojn pri medicino. Mi ankoraŭ uzas la anglan en la laboro, sed la plej sinceraj diskutoj okazas en Esperanto.</p>`],
["B","Lucas, 23, studento",`<p>Por mi Esperanto estis ludo. Mi ŝatis konstrui vortojn kiel Lego-briketojn, kaj mi lernis la bazon en du semajnoj per aplikaĵo. Poste mi malkovris la muzikon: rokon, repon, eĉ metalon! Nun mi kantas en grupo, kiu kantas nur en Esperanto, kaj lastan someron ni ludis antaŭ kvincent homoj en Pollando.</p>`],
["C","Ana, 67, pensiulino",`<p>Mi lernis ĝin post la morto de mia edzo, kiam mi sentis min tre sola. Amikino kondukis min al la loka klubo. Mi ne estas bona pri lingvoj, kaj mi bezonis du jarojn por paroli flue. Sed la homoj estis tiel paciencaj! Hodiaŭ mi gastigas vojaĝantojn per Pasporta Servo, kaj mia domo neniam estas malplena.</p>`],
["D","Tomasz, 38, programisto",`<p>Mi venis al Esperanto per la teknologio: mi volis kontribui al malfermkoda projekto, kies dokumentado estis en Esperanto. La logiko de la gramatiko tuj plaĉis al mi; ĝi similas al programlingvo sen esceptoj. Mi neniam iris al kongreso, sed mi tradukis plurajn programojn kaj babilas ĉiutage en retaj grupoj.</p>`]
],
q:[

["Kiu prezentiĝis antaŭ granda publiko?",1,"Lucas: «…ni ludis antaŭ kvincent homoj»."],

{id:'tf-b2', type:'tfng', lvl:'B2', minutes:14, title:'Labori de hejme: kvin jarojn poste',
text:`<p>Antaŭ kelkaj jaroj, labori de hejme estis privilegio de malmultaj. Hodiaŭ, en multaj oficejaj profesioj, ĝi fariĝis normala parto de la semajno. Tamen la unuaj entuziasmaj prognozoj, laŭ kiuj la oficejoj tute malaperos, ne realiĝis: la plimulto de la firmaoj elektis miksitan modelon, kun du aŭ tri tagoj hejme kaj la ceteraj en la oficejo.</p>
<p>Esploroj montras, ke la dungitoj aprezas precipe la ŝparitan tempon: kiu antaŭe pasigis unu horon tage en la trafiko, nun povas uzi ĝin por dormi, sporti aŭ prizorgi la familion. Ankaŭ la koncentriĝo ofte pliboniĝas, ĉar hejme estas malpli da interrompoj ol en granda malferma oficejo.</p>
<p>La malavantaĝoj tamen ne estas malgravaj. Multaj homoj plendas, ke la limo inter laboro kaj privata vivo malklariĝis: la komputilo restas sur la kuireja tablo, kaj la retmesaĝoj alvenas ankaŭ vespere. Junaj dungitoj, siaflanke, rakontas, ke ili lernas malpli rapide, ĉar ili ne plu povas observi siajn pli spertajn kolegojn.</p>
<p>Por la urboj la ŝanĝo havas neatenditajn sekvojn. En kelkaj centroj, kafejoj kaj restoracioj, kiuj vivis de la tagmanĝoj de oficistoj, devis fermiĝi. Aliflanke, la loĝkvartaloj fariĝis pli viglaj dum la tago. Neniu ankoraŭ scias, ĉu tiu ekvilibro daŭros, aŭ ĉu post kelkaj jaroj la pendolo denove svingiĝos al la oficejo.</p>`,
q:[
["Laŭ la teksto, la oficejoj tute malaperis.","F","«…la oficejoj tute malaperos, ne realiĝis»: as previsões não se confirmaram."],
["La plej multaj firmaoj kombinas laboron hejme kaj en la oficejo.","T","«la plimulto de la firmaoj elektis miksitan modelon»."],
["Labori de hejme kutime kunportas pli altan salajron.","NG","O texto não fala de salário."],
["Hejme oni ofte estas malpli interrompata ol en granda malferma oficejo.","T","«hejme estas malpli da interrompoj ol en granda malferma oficejo»."],
["Ĉiuj dungitoj preferus labori hejme kvin tagojn semajne.","NG","O texto fala do que as empresas escolheram, não do que todos os funcionários prefeririam. Desconfie de «ĉiuj»."],
["Junaj dungitoj lernas pli rapide, kiam ili laboras hejme.","F","«ili lernas malpli rapide»."],
["Kelkaj kafejoj en urbocentroj devis fermiĝi.","T","«kafejoj kaj restoracioj… devis fermiĝi»."],
["La aŭtoro certas, ke la homoj baldaŭ revenos al la oficejoj.","F","«Neniu ankoraŭ scias…»: o autor não tem certeza."]
]},
{id:'mc-b2b', type:'mc', lvl:'B2', minutes:18, title:'Kiam la urbo forpelis la aŭtojn',
text:`<p>Antaŭ ses jaroj la urbestraro de mezgranda eŭropa urbo prenis decidon, kiun multaj loĝantoj tiam nomis frenezo: ĝi malpermesis la privatajn aŭtojn en la tuta historia centro. Komercistoj protestis, ĉar ili timis perdi siajn klientojn, kaj la loka gazeto publikigis ĉefartikolon kun la titolo «La morto de la centro».</p>
<p>La unuaj monatoj ŝajnis doni al ili pravon. La vendoj falis, kaj kelkaj vendejoj fermiĝis. Sed la urbestraro ne cedis. Ĝi plilarĝigis la trotuarojn, plantis arbojn, aldonis benkojn kaj regule organizis bazarojn kaj koncertojn en la liberigitaj placoj. Samtempe ĝi pliigis la nombron de busoj kaj kreis sekurajn vojojn por biciklantoj.</p>
<p>Post du jaroj la situacio renversiĝis. Laŭ la statistikoj de la urbo, la nombro de piedirantoj en la centro duobliĝis, kaj la vendoj ne nur revenis al la antaŭa nivelo, sed eĉ superis ĝin. Familioj, kiuj antaŭe evitis la bruajn stratojn, nun pasigas tie siajn semajnfinojn. Eĉ la gazeto, kiu antaŭdiris la morton de la centro, publikigis artikolon kun la titolo «Ni eraris».</p>
<p>Tamen ne ĉiuj estas kontentaj. Maljunuloj kaj homoj, kiuj malfacile marŝas, plendas, ke fariĝis pli komplike atingi la kuraciston aŭ la apotekon. La lupagoj en la centro rapide altiĝis, kaj kelkaj familioj devis translokiĝi al la periferio, de kie ili nun… veturas per aŭto. Ĉiu sukceso havas sian prezon, konkludas urbanisto, kiun ni intervjuis: «La demando ne estas, ĉu ŝanĝi, sed kiel protekti tiujn, kiuj pagas la kostojn de la ŝanĝo.»</p>`,
q:[
["Kiel multaj loĝantoj reagis al la decido komence?",["Ili tuj aprobis ĝin","Ili konsideris ĝin freneza","Ili ne interesiĝis pri ĝi","Ili postulis pli da parkejoj"],1,"«…decidon, kiun multaj loĝantoj tiam nomis frenezo»."],
["Kio okazis dum la unuaj monatoj?",["La vendoj kreskis","La vendoj malkreskis kaj kelkaj vendejoj fermiĝis","La urbestraro nuligis la decidon","La gazeto ŝanĝis sian opinion"],1,"«La vendoj falis, kaj kelkaj vendejoj fermiĝis»."],
["Kion faris la urbestraro por igi la centron alloga?",["Ĝi malaltigis la impostojn","Ĝi plibeligis la publikan spacon kaj plibonigis la publikan transporton","Ĝi konstruis grandan parkejon","Ĝi malpermesis la busojn"],1,"Calçadas, árvores, bancos, feiras, mais ônibus e ciclovias."],
["Kion signifas «la situacio renversiĝis»?",["La situacio fariĝis la malo de la komenca","La situacio restis la sama","La situacio iomete malboniĝis","La urbo forigis la regulon"],0,"renversiĝi = virar do avesso, inverter-se."],
["Kial la titolo «Ni eraris» estas ironia?",["Ĉar la gazeto neniam eraras","Ĉar ĝi venas de la sama gazeto, kiu antaŭdiris la morton de la centro","Ĉar la urbestro verkis ĝin","Ĉar la vendoj ja falis"],1,"O mesmo jornal que tinha anunciado «a morte do centro»."],
["Kio estas la ĉefa ideo de la lasta alineo?",["La ŝanĝo estis tute malsukcesa","Ĉiu sukcesa ŝanĝo havas kostojn, kaj necesas protekti tiujn, kiuj pagas ilin","La aŭtoj devas reveni al la centro","La lupagoj ne gravas"],1,"«…kiel protekti tiujn, kiuj pagas la kostojn de la ŝanĝo»."]
]}

];

const RAKONTO_T='La libro kun la verda stelo';
const RAKONTO = [
{u:1, t:'La klubo', text:`<p>Marina estas en Madrido. Estas vendredo, kaj ŝi estas en malgranda klubo de Esperanto. La klubo ne estas granda: estas nur unu ĉambro, dek seĝoj kaj multaj malnovaj libroj.</p>
<p>En la klubo estas Paŭlo, la itala amiko de Marina, kaj sinjorino Teresa. Sinjorino Teresa estas maljuna kaj tre [[afabla|gentil]]. Ŝi estas la prezidantino de la klubo.</p>
<p>Sur la tablo estas libro. Ĝi estas tre malnova kaj [[verda|verde]], kaj sur ĝi estas stelo. «Kio estas tio?» demandas Marina. «Ĝi estas mia [[trezoro|tesouro]]», respondas sinjorino Teresa. «Ĉu ĝi estas bela?» «Jes, tre bela!» diras Marina. Sed la libro ne estas nur bela. Ĝi estas ankaŭ… [[mistera|misteriosa]].</p>`,
q:[["Kie estas Marina?",["En Lisbono","En malgranda klubo en Madrido","En biblioteko","Hejme"],1],["Kiu estas sinjorino Teresa?",["La itala amiko","La prezidantino de la klubo","La fratino de Marina","Instruistino"],1],["Kia estas la libro?",["Nova kaj ruĝa","Malnova kaj verda, kun stelo","Granda kaj blanka","Malgranda kaj nigra"],1],["Kion diras Teresa pri la libro?",["Ke ĝi estas ŝia trezoro","Ke ĝi estas por Marina","Ke ĝi ne estas bela","Ke ĝi estas nova"],0]],
w:'Descreva o seu lugar preferido para ler: como é, o que há lá, quem está lá.'},
{u:2, t:'La plano', text:`<p>Sinjorino Teresa sidiĝis kaj malfermis la libron. «Ĉi tiu libro estis de mia avo», ŝi rakontis. «Li lernis Esperanton en 1910, kaj li vojaĝis per ĝi al multaj landoj. Kiam mi estis knabino, li legis al mi la poemojn el ĝi ĉiuvespere.»</p>
<p>Paŭlo rigardis la unuan paĝon. «Ĉi tie estas skribita nomo kaj dato: 1911!» Teresa ridetis. «Jes. Kaj nun mi havas planon. Post du semajnoj okazos la kongreso en Lisbono. Tie estos ekspozicio de malnovaj libroj. Mi portos mian libron, kaj ĉiuj vidos ĝin.»</p>
<p>«Ĉu vi venos kun ni, Marina?» demandis Paŭlo. Marina pensis pri sia laboro, pri sia mono, pri sia kato… «Jes», ŝi diris fine. «Mi venos!» Ŝi ne sciis, ke tiu vojaĝo ŝanĝos multon.</p>`,
q:[["De kiu estis la libro?",["De la patro de Teresa","De la avo de Teresa","De Paŭlo","De la klubo"],1],["Kion la avo faris per Esperanto?",["Li instruis en lernejo","Li vojaĝis al multaj landoj","Li verkis romanon","Li laboris en banko"],1],["Kio okazos post du semajnoj?",["Festo en la klubo","La kongreso en Lisbono","La naskiĝtago de Teresa","Ekzameno"],1],["Kion decidis Marina?",["Resti en Madrido","Iri al la kongreso","Aĉeti la libron","Vendi sian katon"],1]],
w:'O que você faria numa viagem a um congresso? Escreva três planos com -os.'},
{u:3, t:'La ekspozicio', text:`<p>En Lisbono la kongreso okupis grandan universitaton. Teresa, Paŭlo kaj Marina trovis la ĉambron de la ekspozicio en la dua etaĝo. Tie bibliotekistino el Pollando, Ewa, akceptis ilin. Ŝi portis verdajn okulvitrojn kaj longan nigran robon.</p>
<p>Ewa prenis la libron per du manoj, kiel bebon. «Ĝi estas belega! Mi metos ĝin en la vitran ŝrankon, apud la fenestro.» Marina faris kelkajn fotojn de la libro kaj sendis ilin al sia patrino.</p>
<p>Vespere ili vizitis la urbon, manĝis fiŝon kaj aŭskultis koncerton. Je la deka ili revenis al la hotelo, lacaj sed feliĉaj.</p>
<p>La sekvan matenon Marina vekiĝis pro la telefono. Estis Paŭlo, tre nervoza: «Marina, venu tuj al la universitato! Iu prenis la libron de Teresa. La ŝranko estas malplena!»</p>`,
q:[["Kiu akceptis ilin en la ekspozicio?",["Jozefo","Ewa, bibliotekistino el Pollando","La gardisto","Akiko"],1],["Kien Ewa metis la libron?",["En sian sakon","En vitran ŝrankon apud la fenestro","Sur la tablon","En la bibliotekon"],1],["Kion faris Marina kun la fotoj?",["Ŝi sendis ilin al sia patrino","Ŝi forigis ilin","Ŝi presis ilin","Ŝi montris ilin al Ewa"],0],["Kio okazis matene?",["La libro malaperis","Teresa malsaniĝis","La kongreso finiĝis","Marina perdis sian telefonon"],0]],
w:'Escreva uma mensagem curta para uma amiga contando o que aconteceu. Use pelo menos cinco palavras com -n.'},
{u:4, t:'Kiu havis la ŝlosilon?', text:`<p>En la ĉambro de la ekspozicio atendis la loka organizanto de la kongreso, Jozefo, kaj la noktogardisto, sinjoro Rui. Teresa sidis sur seĝo, tre pala. Ŝia libro ne estis en la ŝranko.</p>
<p>«Ni pensu trankvile», diris Marina, kaj ŝi prenis sian kajeron. «Je kioma horo oni fermis la ĉambron?» «Je la deka», respondis Jozefo. «Kaj kiu havas ŝlosilon?» «Nur tri personoj: mi, Ewa kaj sinjoro Rui.»</p>
<p>Sinjoro Rui klarigis: «Mi laboris de la deka ĝis la sesa matene. Je la dek-unua kaj duono mi aŭdis bruon en la dua etaĝo, sed mi trovis neniun. Je la sesa la pordo estis fermita, kiel ĉiam.»</p>
<p>Marina skribis ĉion: <i>22:00 fermo · 23:30 bruo · 6:00 pordo fermita</i>. «Kaj kie estas Ewa?» ŝi demandis. Neniu sciis. Ewa ne respondis al sia telefono.</p>`,
q:[["Kiom da personoj havas ŝlosilon?",["Du","Tri","Kvar","Neniu"],1],["Je kioma horo oni fermis la ĉambron?",["Je la sesa","Je la deka","Je la dek-unua kaj duono","Je la oka"],1],["Kion aŭdis sinjoro Rui je la 23:30?",["Muzikon","Bruon en la dua etaĝo","Telefonon","Nenion"],1],["Kio estas stranga pri Ewa?",["Ŝi ploris","Ŝi ne respondas al la telefono","Ŝi havas la libron en la mano","Ŝi forlasis la kongreson"],1]],
w:'Faça a «linha do tempo» de um dia seu, como Marina fez: horas por extenso e o que aconteceu.'},
{u:5, t:'La bileto', text:`<p>Marina komencis serĉi. Ŝi rigardis sub la tabloj, malantaŭ la kurtenoj kaj inter la ŝrankoj. Paŭlo serĉis en la koridoro, ĉe la lifto kaj sur la ŝtuparo. Nenio.</p>
<p>Tiam Marina iris al la fenestro. La fenestro estis iomete malfermita, kaj sur la planko, sub la radiatoro, kuŝis malgranda papero. Ŝi prenis ĝin per du fingroj. Estis malnova trajna bileto: <i>Lisbono → Sintra</i>. Sur la dorso iu skribis per verda inko kelkajn vortojn, sed la pluvo forviŝis duonon de ili.</p>
<p>«Ĉu la ŝtelisto eliris tra la fenestro?» demandis Paŭlo. Marina rigardis eksteren. «Ne. Ni estas en la dua etaĝo, kaj sub la fenestro estas nur ŝtonoj. Neniu saltus de ĉi tie. Sed ĉi tiu bileto ne falis el la ĉielo.» Ŝi metis la bileton en sian poŝon. Ĝi estis la unua [[spuro|pista]].</p>`,
q:[["Kie Marina trovis la paperon?",["Sur la tablo","Sub la radiatoro, ĉe la fenestro","En la lifto","En la ŝranko"],1],["Kio estis la papero?",["Letero","Trajna bileto al Sintra","Foto","Mapo"],1],["Per kio iu skribis sur la dorso?",["Per krajono","Per verda inko","Per ruĝa plumo","Per komputilo"],1],["Kial la ŝtelisto ne eliris tra la fenestro?",["Ĉar ĝi estis fermita","Ĉar ĝi estas en la dua etaĝo, super ŝtonoj","Ĉar Rui gardis ĝin","Ĉar ĝi estis tro malgranda"],1]],
w:'Descreva onde estão as coisas no seu quarto ou escritório. Use pelo menos oito preposições.'},
{u:6, t:'La kodita mesaĝo', text:`<p>En la hotelo Marina rigardis la bileton per lupeo. De la mesaĝo restis nur kelkaj vortoj: <i>«…malnovaĵo… al la librejo… rebindigi… revenos…»</i></p>
<p>«Ĝi estas kiel enigmo», ŝi diris al Paŭlo. «Ni dismetu la vortojn. <i>Mal-nov-aĵ-o</i>: io malnova, malnova objekto. <i>Libr-ej-o</i>: loko de libroj, librejo. <i>Re-bind-ig-i</i>: igi, ke io estu bindita denove. Do iu volis…» «…riparigi la libron!» kriis Paŭlo. «Ne ŝteli ĝin, sed rebindigi ĝin!»</p>
<p>«Eble», respondis Marina malrapide. «Sed kial sekrete? Kaj kial en Sintra?» Ŝi serĉis en la reto: en Sintra estas malgranda librejo de antikvaĵoj, kun bindisto, kiu laboras por bibliotekoj. La librejo malfermiĝas je la naŭa.</p>
<p>Paŭlo jam ridis. «Vi estas vera detektivino, Marina!» «Ne», ŝi diris. «Mi estas nur programistino. Mi ŝatas dismeti problemojn en malgrandajn partojn.»</p>`,
q:[["Kion signifas «malnovaĵo»?",["Nova libro","Malnova objekto","Malnova homo","Librejo"],1],["Kion Paŭlo komprenis el la mesaĝo?",["Ke iu volis vendi la libron","Ke iu volis riparigi la libron","Ke Teresa forĵetis la libron","Ke la libro estas en la hotelo"],1],["Kio estas en Sintra?",["Biblioteko de la kongreso","Librejo de antikvaĵoj kun bindisto","La hejmo de Ewa","Esperanta klubo"],1],["Kiel Marina solvas problemojn?",["Ŝi demandas la policon","Ŝi dismetas ilin en malgrandajn partojn","Ŝi atendas","Ŝi telefonas al sia patrino"],1]],
w:'Invente uma «mensagem codificada» de cinco palavras compostas e explique cada uma, como Marina fez.'},
{u:7, t:'Neniu vidis ion', text:`<p>Ĉe la matenmanĝo aliĝis al ili Akiko, la japana inĝenierino, kiun Marina konis el la reto. «Mi aŭdis ĉion», ŝi diris. «Ĉiuj en la kongreso parolas pri la libro. Kion vi scias ĝis nun?»</p>
<p>Marina rakontis. Akiko aŭskultis atente kaj poste faris demandojn, unu post la alia: «Kiu havis ŝlosilon? Kiam okazis la bruo? Kie estas Ewa nun? Kial ŝi ne respondas?» «Tion neniu scias», diris Paŭlo. «Ŝi estas nenie. Ĉiuj serĉis ŝin, sed neniu vidis ŝin de hieraŭ vespere.»</p>
<p>«Do ni havas tri demandojn», diris Akiko, kaj ŝi skribis sur buŝtuko: <i>Kiu? Kial? Kien?</i> «Mi pensas, ke la respondo al ĉiuj tri estas tiu, kiun ni ankoraŭ ne konas.» Marina montris la bileton. «Tiam ni iru tien, kien montras la bileto: al Sintra.» La trajno foriros post duonhoro.</p>`,
q:[["Kiu aliĝis al Marina kaj Paŭlo?",["Ewa","Akiko","Teresa","Jozefo"],1],["Kion Akiko skribis sur la buŝtuko?",["La horon de la trajno","Tri demandojn: Kiu? Kial? Kien?","La nomon de la ŝtelisto","La adreson de la librejo"],1],["«Ŝi estas nenie» signifas…",["Ela está aqui","Ela não está em lugar nenhum (que se saiba)","Ela está em todo lugar","Ela está em casa"],1],["Kien ili decidas iri?",["Al la polico","Al Sintra","Al Madrido","Al la hotelo"],1]],
w:'Escreva cinco perguntas que você faria a Ewa, cada uma com um correlativo diferente.'},
{u:8, t:'Sia aŭ ŝia?', text:`<p>En la trajno Akiko montris al Marina mesaĝon, kiun ŝi ricevis de sinjoro Rui: <i>«Mi ĵus memoris: hieraŭ vespere Ewa prenis ŝian libron kaj eliris.»</i> Paŭlo leviĝis. «Do ŝi estas la ŝtelisto!»</p>
<p>«Atendu», diris Marina. «Rui skribis <i>ŝian</i>, ne <i>sian</i>. Kun <i>sian</i>, Ewa prenas sian propran libron. Kun <i>ŝian</i>, ŝi prenas la libron de alia virino: de Teresa. Do nun ni scias, kiu prenis la libron. Sed ni ankoraŭ ne scias, kial.» «Kaj kiel ni scias, ĉu Rui konas la diferencon?» demandis Paŭlo. «Li parolas Esperanton pli bone ol ni ĉiuj», ridetis Akiko. «Li estas denaskulo.»</p>
<p>Marina pensis. «Ewa estas bibliotekistino. Bibliotekistinoj ne ŝtelas librojn: ili gardas ilin. Eble ŝi havas ekzempleron de la sama eldono, eĉ pli malnovan ol tiu de Teresa. Eble ŝi volis kompari la du librojn…» La trajno malrapidiĝis, kaj tra la fenestro aperis la kastelo de Sintra, sur verda monto. «La plej bela loko por mistero», diris Akiko.</p>`,
q:[["Kion skribis sinjoro Rui?",["Ke Ewa prenis sian propran libron","Ke Ewa prenis ŝian libron kaj eliris","Ke li vidis la ŝteliston","Ke la libro revenis"],1],["Kial la vorto «ŝian» gravas?",["Ĉar ĝi montras, ke Ewa prenis la libron de alia virino, de Teresa","Ĉar ĝi estas eraro","Ĉar ĝi montras, ke la libro estas de Ewa","Ĉar ĝi estas pasivo"],0],["Kial Rui certe konas la diferencon?",["Li estas instruisto","Li estas denaskulo","Li estas polo","Li legis la libron"],1],["Kion Marina supozas pri Ewa?",["Ke ŝi vendis la libron","Ke ŝi eble havas ekzempleron de la sama eldono","Ke ŝi forflugis","Ke ŝi estas la fratino de Teresa"],1]],
w:'Compare duas pessoas da história (Ewa e Teresa, Marina e Paŭlo…). Use pli … ol e sia pelo menos uma vez.'},
{u:9, t:'Se mi estus la ŝtelisto…', text:`<p>Antaŭ la librejo, kiu ankoraŭ estis fermita, Marina proponis ludon. «Ni imagu. Se mi estus la ŝtelisto, kion mi farus?» «Vi vendus la libron al kolektanto», diris Paŭlo. «Kaj vi neniam venus al tia malgranda librejo, kie ĉiuj vidus vin», respondis Akiko.</p>
<p>«Ĝuste», diris Marina. «Ŝtelisto kaŝus sin. Sed iu, kiu volas, ke la libro estu riparita, venus ĝuste ĉi tien. Kaj tiu persono volus, ke neniu sciu antaŭ la fino… eble por fari surprizon.»</p>
<p>Paŭlo ne estis konvinkita. «Se tio estus vera, ŝi lasus mesaĝon.» Marina montris la bileton kun la verda inko. «Eble ŝi ja lasis.» Akiko rigardis la horloĝon. «Estas la naŭa. Ni eniru, kaj ni petu, ke la bindisto montru al ni sian laborejon.» «Kaj se la libro ne estas tie?» «Tiam», diris Marina, «ni telefonu al la polico.»</p>`,
q:[["Kion farus vera ŝtelisto, laŭ Akiko?",["Li venus al la librejo","Li neniam venus al tia malgranda librejo","Li redonus la libron","Li skribus leteron"],1],["Kion volus persono, kiu volas riparigi la libron?",["Ke ĉiuj sciu tuj","Ke neniu sciu antaŭ la fino","Vendi ĝin","Kaŝi ĝin por ĉiam"],1],["Kion Akiko petas, ke la bindisto faru?",["Ke li vendu libron","Ke li montru sian laborejon","Ke li telefonu al la polico","Ke li fermu la librejon"],1],["Kion ili faros, se la libro ne estos tie?",["Reveni al Madrido","Telefoni al la polico","Aĉeti novan libron","Serĉi Ewa-n en la kastelo"],1]],
w:'Se você fosse a detetive, o que faria agora? Escreva cinco frases com -us e duas com ke + -u.'},
{u:10, t:'La bindisto', text:`<p>La bindisto, maljuna viro kun blankaj manikoj, akceptis ilin ridetante. «Bonan matenon! Ĉu vi venas por la verda libro?» Marina preskaŭ falis. «Ĉu ĝi estas ĉi tie?»</p>
<p>Li kondukis ilin al malgranda laborejo, plena de papero kaj odoro de gluo. Sur la tablo kuŝis du libroj, preskaŭ samaj: ambaŭ verdaj, ambaŭ kun stelo. «Ĉi tiun alportis hieraŭ nokte juna sinjorino portanta verdajn okulvitrojn», li klarigis, montrante la unuan. «Ŝi venis per la lasta trajno, tenante la libron kiel bebon. Kaj ĉi tiu estas ŝia propra ekzemplero, kiun ŝi lasis ĉi tie la pasintan monaton.»</p>
<p>«Kaj kie ŝi estas nun?» demandis Akiko. «Dorminte nur tri horojn en mia gastoĉambro, ŝi foriris al la kastelo por foti malnovajn manuskriptojn. Ŝi revenos tagmeze.» Marina sidiĝis, ridante kaj plorante samtempe. Paŭlo jam skribis al Teresa: <i>«Ni trovis ĝin! Ĝi fartas bone!»</i></p>`,
q:[["Kion la bindisto tuj demandis?",["Ĉu ili volas aĉeti libron","Ĉu ili venas por la verda libro","Kiuj ili estas","Kie estas Teresa"],1],["Kio estis sur la tablo?",["Unu libro","Du preskaŭ samaj libroj","Neniu libro","Multaj malnovaj leteroj"],1],["Kiel la juna sinjorino venis?",["Per aŭto","Per la lasta trajno","Piede","Per buso"],1],["Kion faris Ewa, dorminte nur tri horojn?",["Ŝi revenis al Lisbono","Ŝi iris al la kastelo por foti manuskriptojn","Ŝi telefonis al Teresa","Ŝi vendis la libron"],1]],
w:'Conte o momento em que Marina encontra o livro, do ponto de vista dela. Use pelo menos três particípios (-ante, -inte, -anta…).'},
{u:11, t:'Kio estis farita, kaj kial', text:`<p>Tagmeze Ewa revenis, kaj kiam ŝi vidis ilin, ŝi ruĝiĝis. «Ho ne… Ĉu mia mesaĝo ne estis trovita?» Marina montris la bileton. «Ĉu tiu ĉi?» «Jes! Mi lasis ĝin sur la ŝranko. Ĝi certe estis forblovita de la vento.»</p>
<p>Ewa klarigis ĉion. Dum la kongreso ŝi rimarkis, ke la libro de Teresa estis difektita: la dorso estis rompita, kaj kelkaj paĝoj estis preskaŭ detruitaj de akvo. «Se ĝi estus montrita dum tuta semajno en la suno, apud la fenestro, ĝi estus perdita por ĉiam. Mi volis, ke ĝi estu savita, sed sen timigi Teresan.»</p>
<p>Ŝi ankaŭ rakontis la surprizon: la libro estos skanita de volontuloj de esperanta biblioteko, kaj ĉiuj paĝoj estos publikigitaj en la reto. «La poemoj, kiujn ŝia avo legis al ŝi, estos legeblaj de iu ajn, en iu ajn lando.» Paŭlo rigardis la bindiston. «Kaj kiam la riparado estos finita?» «Morgaŭ vespere», li respondis. «La libro estos pli forta ol iam.»</p>`,
q:[["Kial la mesaĝo de Ewa ne estis trovita?",["Ŝi forgesis skribi ĝin","Ĝi estis forblovita de la vento","Rui forĵetis ĝin","Ŝi sendis ĝin al Teresa"],1],["En kia stato estis la libro?",["Perfekta","Difektita: rompita dorso kaj paĝoj difektitaj de akvo","Nova","Nelegebla"],1],["Kio okazos al la libro post la riparado?",["Ĝi estos vendita","Ĝi estos skanita kaj publikigita en la reto","Ĝi estos donacita al Ewa","Ĝi estos kaŝita"],1],["Kiam la riparado estos finita?",["Hodiaŭ tagmeze","Morgaŭ vespere","Post unu monato","Neniam"],1]],
w:'Escreva uma «notícia» para o jornal do congresso sobre o caso. Use pelo menos quatro particípios passivos.'},
{u:12, t:'Tio, kion ŝi diris', text:`<p>La lastan tagon de la kongreso, en plena salono, Teresa ricevis sian libron, nun kun nova verda dorso. Ewa diris al la publiko, ke ŝi petas pardonon pro la timo, kiun ŝi kaŭzis. Teresa respondis, ke ŝi ne koleras, sed ke la venontan fojon ŝi volas esti la unua, kiu scias.</p>
<p>Poste Teresa faris anoncon, kiu surprizis eĉ Ewa-n. Ŝi diris, ke ŝi donacos la libron al la biblioteko, kiu skanis ĝin. «Mia avo ne konservis la libron por si», ŝi klarigis. «Li portis ĝin ĉien, por ke aliaj legu ĝin. Mi nur daŭrigas lian vojaĝon.»</p>
<p>Vespere, en la gufujo, Akiko demandis Marinan, ĉu ŝi revenos al la venonta kongreso. Marina respondis, ke ŝi ja revenos, kaj ke ŝi eble verkos rakonton pri ĉio ĉi. «Kiel ĝi nomiĝos?» demandis Paŭlo. Marina pensis momenton. «Simple: <i>La libro kun la verda stelo</i>.» Kaj jen, kara leganto, la rakonto, kiun vi ĵus finis legi.</p>`,
q:[["Kion Ewa diris al la publiko?",["Ke ŝi ŝtelis la libron","Ke ŝi petas pardonon pro la timo, kiun ŝi kaŭzis","Ke ŝi forlasos la kongreson","Ke la libro estas ŝia"],1],["Kion Teresa volas la venontan fojon?",["Ricevi monon","Esti la unua, kiu scias","Ne plu veni al kongresoj","Vendi la libron"],1],["Kion Teresa decidis fari kun la libro?",["Konservi ĝin hejme","Donaci ĝin al la biblioteko","Vendi ĝin","Doni ĝin al Marina"],1],["Kion Marina respondis al Akiko?",["Ke ŝi ne revenos","Ke ŝi ja revenos kaj eble verkos rakonton","Ke ŝi ĉesos lerni Esperanton","Ke ŝi translokiĝos al Lisbono"],1]],
w:'Conte a alguém, em discurso indireto, o que Teresa, Ewa e Marina disseram no último dia. Lembre: o tempo verbal não muda.'}
];

/* ---------- correção ---------- */
const XMAP={c:'ĉ',g:'ĝ',h:'ĥ',j:'ĵ',s:'ŝ',u:'ŭ',C:'Ĉ',G:'Ĝ',H:'Ĥ',J:'Ĵ',S:'Ŝ',U:'Ŭ'};
const xsys = s=>String(s).replace(/([cghjsuCGHJSU])[xX]/g,(m,c)=>XMAP[c]);
const unc = s=>xsys(s);
const norm = s=>unc(String(s).toLowerCase().replace(/[’`´‘]/g,"'").replace(/\s*'\s*/g,"'").replace(/\s+/g,' ').trim().replace(/[.!?,;:»«"“”]+$/,'').replace(/^[«"“]+/,''));
const strip = s=>norm(s).normalize('NFD').replace(/[̀-ͯ]/g,'');
function expand(a){
  if(!a.includes('/')) return [a];
  const toks=a.split(' ').map(t=>t.split('/'));
  let out=[''];
  toks.forEach(opts=>{ const n=[]; out.forEach(p=>opts.forEach(o=>n.push((p?p+' ':'')+o))); out=n; });
  return out;
}
function judge(val, answers){
  const all=[].concat(...answers.map(expand));
  const v=norm(val);
  if(!v) return 'no';
  if(all.some(a=>norm(a)===v)) return 'ok';
  if(all.some(a=>strip(a)===strip(val))) return 'acc';
  return 'no';
}
function rx(src){
  const C='[a-zĉĝĥĵŝŭ]';
  return new RegExp(src.replace(/</g,'(?<!'+C+')').replace(/>/g,'(?!'+C+')').replace(/W/g,C),'gi');
}

function uParts(u){
  const parts=[!!S.lesson[u.id], !!S.read[u.id]];
  u.ex.forEach((_,i)=>parts.push(!!S.ex[u.id+'-'+i]));
  parts.push(!!(S.write[u.id]&&S.write[u.id].done));
  parts.push(!!(S.story[u.id]&&S.story[u.id].read));
  return parts;
}
function uPct(u){ const p=uParts(u); return Math.round(100*p.filter(Boolean).length/p.length); }

function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  let m;
  if((m=h.match(/^unit-(\d+)$/)) && UNITS.find(u=>u.id==m[1])) return {type:'unit',id:+m[1]};
  if(h==='false-friends') return {type:'falsi'};
  if(h==='verbs') return {type:'verbi'};
  if(h==='tabelvortoj') return {type:'tabel'};
  if(h==='vortfarado') return {type:'vort'};
  if(h==='sentences') return {type:'frasi'};
  if(h==='review') return {type:'ripasso'};
  if(h==='vocabulary') return {type:'lessico'};
  if(h==='culture') return {type:'cultura'};
  if(h==='reading-room'||h==='read-aloud'||h==='listening') return {type:'legejo'};
  if((m=h.match(/^reading-room-g-(\w+)$/))) return {type:'legejo',g:m[1]};
  if((m=h.match(/^reading-room-d-(\d+)$/)) && ASCOLTI[+m[1]]) return {type:'legejo',d:+m[1]};
  if((m=h.match(/^reading-room-t-(\d+)$/)) && TESTI[+m[1]]) return {type:'legejo',t:+m[1]};
  if(h==='story') return {type:'story'};
  if(h==='roots') return {type:'roots'};
  if((m=h.match(/^story-(\d+)$/)) && RAKONTO.find(c=>c.u==m[1])) return {type:'story',id:+m[1]};
  if(h==='speaking') return {type:'parlare'};
  if(h==='exams') return {type:'exams'};
  if(h==='plan') return {type:'plan'};
  if((m=h.match(/^exam-([a-z0-9-]+)$/))) return {type:'exams',id:m[1]};
  if(h==='beyond') return {type:'fuori'};
  if((m=h.match(/^culture-(\d+)$/)) && CULTURA[+m[1]]) return {type:'cultura',id:+m[1]};
  if((m=h.match(/^vocabulary-(\d+)$/)) && LESSICO[+m[1]]) return {type:'lessico',id:+m[1]};
  if((m=h.match(/^test-(\d+)$/)) && TESTS.find(t=>t.id==m[1])) return {type:'test',id:+m[1]};
  return {type:'home'};
}

function mcList(ol,items,onDone,errFn){
  let answered=0,score=0;
  ol.innerHTML=items.map((it,i)=>`<li><div><div class="q">${esc(it[0])}</div><div class="opts">${it[1].map((o,j)=>`<button class="opt" data-i="${i}" data-j="${j}">${esc(o)}</button>`).join('')}</div><div class="expl" hidden></div></div></li>`).join('');

    const li=ol.children[i];
    li.querySelectorAll('.opt').forEach((x,k)=>{ x.disabled=true; if(k===it[2]) x.classList.add('ok'); });
    if(j!==it[2]){ b.classList.add('no'); if(errFn){ const e=errFn(i); if(e) addErr(...e); } } else score++;

    ex.innerHTML=mark+(it[3]?' '+esc(it[3]):''); ex.hidden=false;

const TYPE_LAB={fill:'Kompletigu',mc:'Plurelekto',fix:'Korektu',order:'Ordigu'};
function tabEx(u,c){

function addGenSet(u,set,k){
  const sec=document.createElement('div'); sec.style.marginTop='18px';
  $('#gensets').prepend(sec);
  const inner=document.createElement('section'); inner.className='card'; inner.style.boxShadow='none'; sec.appendChild(inner);
  buildSet(inner,{t:'fill',title:'Generitaj · aro '+(k+1),items:set},'AI',null,null,uName(u)+' · generitaj ekzercoj');
}
function buildSet(sec,set,letter,key,onSave,src){
  const ekey=i=>(key||('g'+hashStr(set.items[i][0])))+'-'+i;
  const prev=key&&S.ex[key];
  sec.innerHTML=`<div class="card-h"><div><span class="lab">${letter} · ${TYPE_LAB[set.t]}</span><h3>${esc(set.title)}</h3></div><span class="score">${prev?prev.s+'/'+prev.t:''}</span></div><ol class="items"></ol>
   ${set.t!=='mc'?'<div class="btnrow"><button class="btn primary" data-a="check">Kontroli</button><button class="btn" data-a="show">Montri la respondojn</button><button class="btn" data-a="reset">Reprovi</button></div>':'<div class="btnrow"><button class="btn" data-a="reset">Reprovi</button></div>'}`;
  if(prev) showScore(sec.querySelector('.score'),prev.s,prev.t);
  const ol=sec.querySelector('.items');
  const record=(s,t)=>{ showScore(sec.querySelector('.score'),s,t); if(key){ S.ex[key]={s,t}; save(); onSave&&onSave(); } };
  sec.querySelector('[data-a="reset"]').onclick=()=>buildSet(sec,set,letter,key,onSave,src);
  if(set.t==='mc'){ mcList(ol,set.items,record,i=>{ const it=set.items[i]; return [ekey(i),'mc',{q:it[0],o:it[1],c:it[2],e:it[3]||''},src]; }); return; }
  if(set.t==='order'){ orderList(ol,set.items,sec,record,ekey,src); return; }

  ol.innerHTML=set.items.map((it,i)=>{
    if(set.t==='fill'){
      const multi=Array.isArray(it[1][0]);
      const answers=multi?it[1]:[it[1]];
      let txt=it[0], hint='';
      const m=txt.match(/\s*(\([^()]*\))\s*$/); if(m){ hint=m[1]; txt=txt.slice(0,m.index); }
      let bi=0;
      const html=esc(txt).replace(/___/g,()=>{ const a=answers[bi]||['']; const w=Math.max(4,...a.map(x=>x.length))+2; return `<input class="blank" data-b="${bi++}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="truo">`; });
      return `<li><div><div class="sent">${html}${hint?`<span class="hint">${esc(hint)}</span>`:''}<span class="fb"></span></div><div class="expl" hidden></div></div></li>`;
    } else {
      const html=esc(it[0]).replace(/\{([^}]*)\}/,'<span class="err">$1</span>');
      const w=Math.max(10,...it[1].map(x=>x.length))+2;
      return `<li><div><div class="sent">${html}</div><div class="fixline">Korekto: <input class="blank" data-b="0" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="korekto"><span class="fb"></span></div><div class="corrected" hidden></div></div></li>`;
    }
  }).join('');

  const inputs=[...ol.querySelectorAll('.blank')];
  inputs.forEach((inp,k)=>inp.addEventListener('keydown',e=>{
    if(e.key==='Enter'){ e.preventDefault(); const li=inp.closest('li'); const idx=[...ol.children].indexOf(li);
      const rowInputs=[...li.querySelectorAll('.blank')];
      if(inp===rowInputs[rowInputs.length-1]) checkRow(idx);
      const nx=inputs[k+1]; if(nx) nx.focus(); }
  }));
  const results=new Array(set.items.length).fill(null);
  function answersOf(i){ const it=set.items[i]; if(set.t==='fix') return [it[1]]; return Array.isArray(it[1][0])?it[1]:[it[1]]; }
  function checkRow(i,reveal){
    const li=ol.children[i], it=set.items[i], ans=answersOf(i);
    let rowOk=true; const notes=[];
    li.querySelectorAll('.blank').forEach(inp=>{
      const b=+inp.dataset.b; const r=judge(inp.value,ans[b]);
      inp.classList.remove('ok','no','acc');
      if(reveal && r!=='ok'){ inp.value=ans[b][0]; inp.classList.add('acc'); rowOk=false; return; }
      inp.classList.add(r);
      if(r!=='ok') rowOk=false;
      if(r==='no') notes.push(ans[b][0]);
      if(r==='acc') notes.push('literumo: '+ans[b][0]);
    });
    const fb=li.querySelector('.fb');
    fb.innerHTML = reveal ? '' : (rowOk?'<span class="mark ok">✓</span>':`<span class="mark ${notes.every(n=>n.startsWith('literumo'))?'acc':'no'}">${esc(notes.join(' · '))}</span>`);
    if(set.t==='fill' && it[2]){ const ex=li.querySelector('.expl'); ex.textContent=it[2]; ex.hidden=false; }
    if(set.t==='fix'){ const co=li.querySelector('.corrected'); co.textContent='✓ '+it[2]; co.hidden=false; }
    const tried=[...li.querySelectorAll('.blank')].some(x=>x.value.trim());
    if(!reveal && tried && results[i]===null) tick();
    if(!reveal && tried && !rowOk) addErr(ekey(i), set.t==='fix'?'fix':'fill', set.t==='fix'?{p:it[0],a:it[1],c:it[2]}:{p:it[0],a:it[1],e:it[2]||''}, src);
    results[i]= reveal?false:rowOk;
    if(results.every(r=>r!==null) && !reveal) record(results.filter(Boolean).length,results.length);
    return rowOk;
  }
  sec.querySelector('[data-a="check"]').onclick=()=>{ set.items.forEach((_,i)=>checkRow(i)); };
  sec.querySelector('[data-a="show"]').onclick=()=>{ set.items.forEach((_,i)=>{ if(results[i]!==true) checkRow(i,true); }); };
}

let samplePromise=null;
function getSample(){
  if(!samplePromise) samplePromise = (async()=>{ try{ return (window.claude&&window.claude.use) ? await window.claude.use('sample') : null; }catch(e){ return null; } })();
  return samplePromise;
}
const ERR={not_granted:'Claude ankoraŭ ne rajtas uzi ĉi tiun paĝon. Permesu ĝin en la agordoj de la paĝo kaj reprovu.',sampling_disabled:'Claude ne disponeblas por ĉi tiu konto.',rate_limited:'Tro da petoj sinsekve. Atendu kelkajn minutojn kaj reprovu.',session_expired:'Via seanco finiĝis: ensalutu denove en Claude.',refused:'La peto estis rifuzita. Provu reformuli la tekston.',invalid_json:'La respondo venis en neatendita formo. Reprovu.'};
const errMsg=e=>ERR[e&&e.code]||'Ne eblis plenumi la peton. Reprovu post momento.';

async function generate(u){
  const btn=$('#genbtn'), msg=$('#genmsg');
  btn.disabled=true; msg.textContent='Mi verkas la frazojn…';
  const sample=await getSample();
  if(!sample){ msg.textContent='Generi ekzercojn eblas nur kun ĉi tiu paĝo malfermita en Claude.'; btn.disabled=false; return; }
  const pt=aiLang(u)==='pt';
  const prompt=`You are an expert Esperanto teacher. Write 6 NEW and varied gap-fill exercises in Esperanto on: ${u.focus}. Level ${u.lvl}.
The student is a Brazilian native speaker of Portuguese who also speaks Spanish fluently: at least 3 sentences must target typical mistakes of Portuguese/Spanish speakers on this topic (for example the accusative -n, por/pro, ke/kiu, -ig-/-iĝ-, sia, false friends).
Rules: natural, modern Esperanto that follows the Fundamento and PMEG, always with the letters ĉ ĝ ĥ ĵ ŝ ŭ (never x or h systems); ${u.band===0?'5-10 words, simple A1 vocabulary':'7-16 words'}; exactly ONE gap written "___"; after the sentence, in brackets, a hint (the base word, or the Portuguese meaning). "risposte" lists every acceptable correct answer (lower case, no punctuation). "spiegazione" in ${pt?'Portuguese':'simple Esperanto'}, max 20 words.
Answer only with a JSON array: [{"frase":"Mi trinkas ___ ĉiumatene. (kafo)","risposte":["kafon"],"spiegazione":"${pt?'Objeto direto: acusativo -n.':'Rekta objekto: akuzativo -n.'}"}]`;
  try{
    const data=await sample.json(prompt,{cache:false});
    const items=(Array.isArray(data)?data:[]).filter(x=>x&&typeof x.frase==='string'&&(x.frase.match(/___/g)||[]).length===1&&Array.isArray(x.risposte)&&x.risposte.length)
      .map(x=>[x.frase,x.risposte.map(String),x.spiegazione?String(x.spiegazione):'']);
    if(!items.length) throw {code:'invalid_json'};
    S.gen[u.id]=(S.gen[u.id]||[]).concat([items]).slice(-5); save();
    addGenSet(u,items,S.gen[u.id].length-1);
    msg.textContent='Farite: la nova aro estas sube.';
  }catch(e){ msg.textContent=errMsg(e); }
  btn.disabled=false;
}


/* ---------- escrita ---------- */
function md(t){
  const lines=esc(t).split('\n'); let out='', list=null;
  const inline=s=>s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/~~([^~]+)~~/g,'<del>$1</del>').replace(/(^|\s)_([^_]+)_/g,'$1<i>$2</i>').replace(/(^|[^*])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>');
  const close=()=>{ if(list){ out+=`</${list}>`; list=null; } };
  lines.forEach(l=>{
    let m;
    if((m=l.match(/^#{1,4}\s+(.*)/))){ close(); out+=`<h4>${inline(m[1])}</h4>`; }
    else if((m=l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){close(); out+='<ul>'; list='ul';} out+=`<li>${inline(m[1])}</li>`; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){close(); out+='<ol>'; list='ol';} out+=`<li>${inline(m[1])}</li>`; }
    else if(l.trim()===''){ close(); }
    else { close(); out+=`<p>${inline(l)}</p>`; }
  });
  close(); return out;
}
function aiLang(u){ if(S.aiLang==='pt'||S.aiLang==='eo') return S.aiLang; return (u&&u.band<2)?'pt':'eo'; }
function corrPrompt(u,text){
  const lvl=u.lvl.split('→').pop().trim();

Grammar focus of the unit: ${u.focus}.
Task: ${u.write.task}
Judge the Esperanto by the Fundamento and good modern usage (PMEG). Always write Esperanto with ĉ ĝ ĥ ĵ ŝ ŭ.
`;
  const body = aiLang(u)==='pt' ? `
Answer IN PORTUGUESE (examples in Esperanto), with exactly these markdown sections:
## Avaliação geral
Nível QECR estimado do texto e uma nota de 0 a 5 em Conteúdo, Organização, Gramática e Vocabulário; 2-3 frases sobre pontos fortes e fracos, e se a tarefa e as estruturas da unidade foram usadas.
## Erros
Lista com cada erro no formato: ~~errado~~ → **certo**: explicação curta. Marque [PT] ou [ES] quando for interferência dessas línguas. Agrupe por tipo (gramática, vocabulário, ortografia, pontuação).

O texto inteiro corrigido, mudando o mínimo possível.

3 sugestões mais naturais (afixos, tabelvortoj, expressões idiomáticas), com o trecho original e a versão melhorada.

Answer IN ESPERANTO, in clear sentences suited to level ${lvl} (if an explanation is hard, you may add a Portuguese word in brackets), with exactly these markdown sections:
## Ĝenerala takso
Taksata nivelo laŭ la Komuna Eŭropa Referenckadro, noto de 0 ĝis 5 pri Enhavo, Organizo, Gramatiko kaj Vortprovizo, 2-3 frazoj pri fortaj kaj malfortaj punktoj, kaj ĉu la tasko kaj la strukturoj de la unuo estis uzitaj.
## Eraroj
Ĉiu eraro en la formo: ~~malĝuste~~ → **ĝuste**: mallonga klarigo. Marku [PT] aŭ [ES], kiam la eraro venas el tiuj lingvoj. Grupigu laŭ tipo (gramatiko, vortprovizo, literumo, interpunkcio).

3 frazoj por kompletigi, bazitaj sur ŝiaj eraroj (kun ___), kaj la solvoj fine.
`;
  return head+body+`
STUDENT'S TEXT:
"""
${text}
"""`;
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

  $('#fnew').onclick=()=>quizFalsi(fb);
}

function vstats(){ const v=S.verbi; const el=$('#vstats'); if(el) el.textContent=`${v.ok}/${v.tot} ĝustaj · serio ${streak} · rekordo ${v.best}`; }
function nextVerb(){
  const pool=VFORMS.filter(f=>vSel.g.includes(f.g)); if(!pool.length) return;
  let v,f,n=0; do{ v=VKEYS[Math.floor(Math.random()*VKEYS.length)]; f=pool[Math.floor(Math.random()*pool.length)]; n++; }while(f.tr&&!VERBI[v].tr&&n<50);
  const p=f.g==='fin'?PRON[Math.floor(Math.random()*PRON.length)]:'';
  cur={v,f,p,done:false};
  const d=$('#drill'); if(!d) return;
  d.innerHTML=`<div class="verb">${v}</div><div class="note" style="margin-top:4px">${esc(VERBI[v].pt)}</div>

function checkVerb(){
  const a=$('#vin'); if(!a.value.trim()) return;
  const ans=vform(cur.v,cur.f,cur.p);
  const alts=[ans]; if(cur.f.g==='fin') alts.push(ans.split(' ')[1]);
  const r=judge(a.value,alts);
  cur.done=true; S.verbi.tot++; tick();
  a.style.color=r==='no'?'var(--rosso)':'var(--verde)'; if(r==='no') a.style.textDecoration='line-through';
  if(r==='ok'){ S.verbi.ok++; streak++; S.verbi.best=Math.max(S.verbi.best,streak); $('#vfb').innerHTML='<span class="mark ok">Perfekte! ✓</span>'; }
  else if(r==='acc'){ S.verbi.ok++; $('#vfb').innerHTML=`<span class="mark acc">Quase: atenção às letras com acento · ${esc(ans)}</span>`; }
  else { streak=0; addErr(`v-${cur.v}-${cur.f.k}`,'verb',{v:cur.v,k:cur.f.k,p:cur.p},'Verboj kaj participoj'); $('#vfb').innerHTML=`<span class="mark no">${esc(ans)}</span>`; }
  save(); vstats();
  $('#vtab2').innerHTML=`<p class="note" style="margin-top:14px">radiko <b>${esc(vroot(cur.v))}-</b> + <b>${esc(cur.f.k)}</b> · Enter por la sekva verbo</p>`;
  if(canSpeak) speakSeq([{text:ans}]);
}

const canon=s=>norm(s).replace(/[.,!?;:«»"—–-]/g,' ').replace(/\s+/g,' ').trim();
function shuffleTokens(toks){ let s; let n=0; do{ s=shuffle(toks); n++; }while(n<8 && s.join(' ')===toks.join(' ')); return s; }
function makeOrder(box,item){
  const sentence=item[0], alts=item[1]||[];
  const toks=sentence.split(' ');
  box.innerHTML=`<div class="build" aria-label="via frazo"><span class="ph">Tuŝu la vortojn en la ĝusta ordo</span></div><div class="pool"></div><div class="fb"></div>`;
  const build=box.querySelector('.build'), pool=box.querySelector('.pool');
  shuffleTokens(toks).forEach(t=>{ const b=document.createElement('button'); b.className='tok'; b.type='button'; b.textContent=t; pool.appendChild(b); });
  const ph=build.querySelector('.ph');
  box.addEventListener('click',e=>{
    const b=e.target.closest('.tok'); if(!b||box.dataset.locked) return;
    (b.parentElement===pool?build:pool).appendChild(b);
    ph.hidden=build.querySelectorAll('.tok').length>0;
  });
  return {
    check(){
      const built=[...build.querySelectorAll('.tok')].map(x=>x.textContent).join(' ');
      const fb=box.querySelector('.fb');
      if(pool.children.length){ fb.innerHTML='<span class="mark no">mankas vortoj</span>'; return false; }
      const ok=[sentence,...alts].some(a=>canon(a)===canon(built));
      fb.innerHTML= ok?'<span class="mark ok">✓ perfekte</span>':`<span class="mark no">✗</span> <span class="corrected">${esc(sentence)}</span>`;
      build.classList.toggle('ok',ok); build.classList.toggle('no',!ok);
      return ok;
    },
    incomplete(){ return pool.children.length>0; },
    reveal(){ box.dataset.locked='1'; box.querySelector('.fb').innerHTML=`<span class="corrected">${esc(sentence)}</span>`; }
  };
}
function orderList(ol,items,sec,record,ekey,src){
  ol.innerHTML=items.map(()=>`<li><div class="ordbox"></div></li>`).join('');
  const ctrls=[...ol.querySelectorAll('.ordbox')].map((b,i)=>makeOrder(b,items[i]));
  const done=new Array(items.length).fill(false);
  sec.querySelector('[data-a="check"]').onclick=()=>{ const r=ctrls.map((c,i)=>{ const ok=c.check(); const complete=!c.incomplete(); if(complete&&!done[i]){ done[i]=true; tick(); } if(complete&&!ok&&ekey) addErr(ekey(i),'order',{s:items[i][0],al:items[i][1]||[]},src); return ok; }); record(r.filter(Boolean).length,r.length); };
  sec.querySelector('[data-a="show"]').onclick=()=>ctrls.forEach(c=>c.reveal());
}

function hashStr(t){ let h=5381; t=String(t); for(let i=0;i<t.length;i++) h=((h<<5)+h+t.charCodeAt(i))|0; return (h>>>0).toString(36); }
let toastT;

/* ---------- ritmo quotidiano ---------- */
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=n=>{ const d=new Date(); d.setDate(d.getDate()+n); return dayKey(d); };
const todayN=()=>S.days[dayKey()]||0;
function tick(n=1){
  const k=dayKey(); S.days[k]=(S.days[k]||0)+n; save();
  updRhythm();
}

function streaks(){
  const met=k=>(S.days[k]||0)>0;
  let cur=0; const d=new Date(); if(!met(dayKey(d))) d.setDate(d.getDate()-1);
  while(met(dayKey(d))){ cur++; d.setDate(d.getDate()-1); }
  const keys=Object.keys(S.days).filter(met).sort(); let best=0,run=0,prev=null;
  keys.forEach(k=>{ if(prev){ const p=new Date(prev+'T12:00:00'); p.setDate(p.getDate()+1); run= dayKey(p)===k? run+1 : 1; } else run=1; best=Math.max(best,run); prev=k; });
  return {cur, best:Math.max(best,cur), total:keys.length};
}

function todaySess(){
  const p=planStatus(); if(p.nextIdx<0) return null;
  const i = p.todayIdx>=0 ? p.todayIdx : p.nextIdx; const s=p.ss[i];
  const n=s.tasks.filter((_,j)=>taskDone(s,j)).length;
  return {s,n,tot:s.tasks.length,isToday:p.todayIdx===i,late:p.late};
}

}

function heatmap(){
  const end=new Date(); const start=new Date(); start.setDate(start.getDate()-7*17+1);
  while(start.getDay()!==1) start.setDate(start.getDate()-1);
  let cells=''; const d=new Date(start); const months=[];
  let col=0;
  while(d<=end){
    if(d.getDay()===1){ col++; if(d.getDate()<=7) months.push([col,EO_MS[d.getMonth()]]); }
    const k=dayKey(d), n=S.days[k]||0, r=n/S.goal;
    const lv = n===0?0 : r<.34?1 : r<.67?2 : r<1?3 : 4;
    cells+=`<i class="hm l${lv}" style="grid-column:${col};grid-row:${((d.getDay()+6)%7)+1}" title="${eoDate(d)}: ${n} poentoj"></i>`;
    d.setDate(d.getDate()+1);
  }
  return `<div class="hmwrap"><div class="hmmonths" style="grid-template-columns:repeat(${col},14px)">${months.map(([c,m])=>`<span style="grid-column:${c}">${m}</span>`).join('')}</div><div class="hmgrid" style="grid-template-columns:repeat(${col},14px)">${cells}</div>

const INT=[1,3,7,15];

function addErr(key,k,d,src){
  if(!key) return;
  const e=S.err[key];
  S.err[key]={k,d,src:src||(e&&e.src)||'',b:0,due:addDays(1),u:Date.now(),w:((e&&e.w)||0)+1};
  const ks=Object.keys(S.err); if(ks.length>600) ks.sort((a,b)=>S.err[a].u-S.err[b].u).slice(0,ks.length-600).forEach(x=>delErr(x));
  save(); refreshErrBadge();
}
function delErr(key){ if(!S.err[key]) return; delete S.err[key]; S.errDel[key]=Date.now(); }
function removeErr(key){ if(key&&S.err[key]){ delErr(key); save(); refreshErrBadge(); } }
function errDue(){ const t=dayKey(); return Object.keys(S.err).filter(k=>S.err[k].due<=t); }
function refreshErrBadge(){ const r=route(); if(r.type!=='unit') return; renderNav(r); }
function reviewResult(key,ok){
  const e=S.err[key]; if(!e) return;
  if(ok){ if(e.b>=3){ delErr(key); S.mastered=(S.mastered||0)+1; } else { e.b++; e.due=addDays(INT[e.b]); e.u=Date.now(); } }
  else { e.b=0; e.due=addDays(1); e.u=Date.now(); e.w=(e.w||0)+1; }
  save();
}
function errLabel(e){
  const d=e.d;
  switch(e.k){
    case 'fill': case 'fix': return d.p.replace(/[{}]/g,'');
    case 'mc': return d.q;
    case 'order': return d.s;
    case 'verb': return `Verbo: ${d.v}${d.k?' · -'+d.k:''}`;
    case 'lab': return d.q;
    case 'falso': return `Falsa amiko: ${d.w}`;
    case 'dict': return `Dikto: ${d.s}`;
    case 'myvoc': { const w=S.myvoc[d.k]; return w?`Miaj vortoj: ${w.it}`:'Miaj vortoj'; }
    case 'vocab': { const w=LESSICO[d.t]&&LESSICO[d.t].w[d.i]; return w?`Vortaro: ${w[0]}`:'Vortaro'; }
  }
  return '';
}

function startReview(keys){

function nextReview(){
  const c=$('#rvcard');

    c.innerHTML=`<div class="drill"><div class="pen" style="font-size:40px">Farite!</div><p class="lead" style="margin:10px auto">${rvOk} ĝustaj el ${rvQueue.length}. As certas sobem de caixa; as erradas voltam amanhã.</p><div class="btnrow" style="justify-content:center"><button class="btn primary" id="rvback">Reen al la kajero</button></div></div>`;
    $('#rvback').onclick=()=>{ renderNav(route()); renderRipasso(); };
    return;
  }

  c.innerHTML=`<div class="card-h"><span class="lab">${esc(e.src)} · skatolo ${e.b+1}</span><span class="note">${rvPos+1} / ${rvQueue.length}</span></div><div id="rvbody"></div><div class="fb" id="rvfb"></div><div class="btnrow" style="margin-top:14px"><button class="btn primary" id="rvcheck">Kontroli</button><button class="btn" id="rvnext" hidden>Sekva →</button></div>`;
  let answered=false;

    if(answered) return; answered=true;
    reviewResult(key,ok); tick(); if(ok) rvOk++;
    $('#rvfb').innerHTML=(ok?'<span class="mark ok">Ĝuste! ✓</span>':'<span class="mark no">Ankoraŭ ne…</span>')+(html||'');
    $('#rvcheck').hidden=true; const nx=$('#rvnext'); nx.hidden=false; nx.focus();

function reviewCard(box,e,finish){
  if(reviewExtra(box,e,finish)) return;
  const d=e.d, chk=$('#rvcheck');
  const enterTo=(el,fn)=>el.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&!ev.shiftKey){ ev.preventDefault(); if(!$('#rvnext').hidden) $('#rvnext').click(); else fn(); } });
  if(e.k==='fill'){
    const multi=Array.isArray(d.a[0]); const answers=multi?d.a:[d.a];
    let txt=d.p, hint=''; const m=txt.match(/\s*(\([^()]*\))\s*$/); if(m){ hint=m[1]; txt=txt.slice(0,m.index); }
    let bi=0; box.innerHTML=`<div class="sent rvsent">${esc(txt).replace(/___/g,()=>{ const a=answers[bi]||['']; const w=Math.max(4,...a.map(x=>x.length))+2; return `<input class="blank" data-b="${bi++}" style="width:${w}ch" autocomplete="off" autocapitalize="off" spellcheck="false">`; })}${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;
    const ins=[...box.querySelectorAll('.blank')]; ins[0]&&ins[0].focus({preventScroll:true});
    const go=()=>{ let ok=true; ins.forEach(inp=>{ const r=judge(inp.value,answers[+inp.dataset.b]); inp.classList.add(r); if(r==='no') ok=false; }); finish(ok, `<p class="corrected">${esc(answers.map(a=>a[0]).join(' · '))}</p>${d.e?`<p class="expl">${esc(d.e)}</p>`:''}`); };
    ins.forEach(i=>enterTo(i,go)); chk.onclick=go;
  } else if(e.k==='fix'){
    box.innerHTML=`<div class="sent rvsent">${esc(d.p).replace(/\{([^}]*)\}/,'<span class="err">$1</span>')}</div><div class="fixline">Korekto: <input class="blank" style="width:${Math.max(12,...d.a.map(x=>x.length))+2}ch" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
    const inp=box.querySelector('.blank'); inp.focus({preventScroll:true});
    const go=()=>{ const r=judge(inp.value,d.a); inp.classList.add(r); finish(r!=='no',`<p class="corrected">✓ ${esc(d.c)}</p>`); };
    enterTo(inp,go); chk.onclick=go;
  } else if(e.k==='mc' || e.k==='falso' || e.k==='vocab'){
    let q,o,c,ex='';
    if(e.k==='mc'){ q=d.q; o=d.o; c=d.c; ex=d.e; }
    else if(e.k==='falso'){ const f=FALSI.find(x=>x[0]===d.w)||FALSI[0]; o=shuffle([f[1],...shuffle(FALSI.filter(x=>x!==f)).slice(0,3).map(x=>x[1])]); q=`Kion signifas «${f[0]}»?`; c=o.indexOf(f[1]); ex=`Atentu: ${f[2]}. Ekz.: ${f[3]}`; }
    else { const th=LESSICO[d.t], w=th.w[d.i]; o=shuffle([w[0],...shuffle(th.w.filter(x=>x!==w)).slice(0,3).map(x=>x[0])]); q=`Kiel oni diras «${w[1]}» en Esperanto?`; c=o.indexOf(w[0]); ex=w[2]; }
    box.innerHTML=`<div class="q rvsent">${esc(q)}</div><div class="opts">${o.map((x,j)=>`<button class="opt" data-j="${j}">${esc(x)}</button>`).join('')}</div>`;
    chk.hidden=true;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ const j=+b.dataset.j; box.querySelectorAll('.opt').forEach((x,k)=>{ x.disabled=true; if(k===c) x.classList.add('ok'); }); if(j!==c) b.classList.add('no'); finish(j===c, ex?`<p class="expl">${esc(ex)}</p>`:''); });
  } else if(e.k==='order'){
    const ctl=makeOrder(box,[d.s,d.al||[]]); box.querySelector('.ordbox')||box.classList.add('ordbox');
    chk.onclick=()=>{ const ok=ctl.check(); if(ctl.incomplete()) return; finish(ok,''); };
  } else if(e.k==='verb'){
    const f=VFORMS.find(x=>x.k===d.k)||VFORMS[0], V=VERBI[d.v]||{pt:''}, ans=vform(d.v,f,d.p||'mi');
    box.innerHTML=`<div class="drill" style="padding:6px 0"><div class="verb" style="font-size:40px">${esc(d.v)}</div><div class="note">${esc(V.pt||'')}</div><div class="meta"><b>${esc(f.lab)}</b>${f.g==='fin'?` · ${esc(d.p||'mi')}`:''}</div><div class="pers">${esc(f.pt)}</div><input id="rvin" autocomplete="off" autocapitalize="off" spellcheck="false"></div>`;
    const inp=$('#rvin'); inp.focus({preventScroll:true});
    const go=()=>{ if(!inp.value.trim()) return; const ok=judge(inp.value,[ans,ans.split(' ').pop()])!=='no'; finish(ok,`<p class="corrected">${esc(ans)}</p>`); };
    enterTo(inp,go); chk.onclick=go;
  } else if(e.k==='lab'){
    box.innerHTML=`<span class="lab note">${esc(d.s)}</span><p class="labq">${esc(d.q)}</p><textarea class="labin" rows="2" id="rvin" spellcheck="false" autocapitalize="off"></textarea>`;
    const inp=$('#rvin'); inp.focus({preventScroll:true});
    const strip2=x=>canon(x).normalize('NFD').replace(/[̀-ͯ]/g,'');
    const go=()=>{ if(!inp.value.trim()) return; const ok=d.a.some(a=>strip2(a)===strip2(inp.value)); finish(ok,`<div class="sols"><span class="note">Respondoj:</span><ul>${d.a.map(a=>`<li>${esc(a)}</li>`).join('')}</ul></div>${d.n?`<p class="expl">${esc(d.n)}</p>`:''}`); };
    enterTo(inp,go); chk.onclick=go;
  }
}

function gradeTest(T){
  if(!testState||testState.result) return;
  stopTestTimer();
  const src=`${T.title}`;
  const read=T.reading.q.map((q,i)=>{ const ok=testState.ans.read[i]===q[2]; if(!ok) addErr(`t${T.id}-r-${i}`,'mc',{q:q[0],o:q[1],c:q[2],e:''},src+' · legado'); return ok; });
  const clozeVals=[...$('#tbody').querySelectorAll('[data-c]')].sort((a,b)=>a.dataset.c-b.dataset.c).map(x=>x.value);
  const cloze=T.cloze.a.map((a,i)=>{ const ok=judge(clozeVals[i]||'',a)==='ok'; if(!ok) addErr(`t${T.id}-c-${i}`,'fill',{p:clozeSentence(T,i),a:a,e:''},src+' · kompletigo'); return ok; });
  const mc=T.mc.map((q,i)=>{ const ok=testState.ans.mc[i]===q[2]; if(!ok) addErr(`t${T.id}-m-${i}`,'mc',{q:q[0],o:q[1],c:q[2],e:''},src+' · gramatiko'); return ok; });
  const score=[...read,...cloze,...mc].filter(Boolean).length;
  const passed=score>=12;
  const prev=S.tests[T.id]||{};
  S.tests[T.id]={best:Math.max(prev.best||0,score),last:score,date:Date.now(),passed:prev.passed||passed,pdate:prev.passed?prev.pdate:(passed?Date.now():null),dist:(prev.dist||score>=17)};
  tick(20);
  save();
  testState.result={score,read,cloze,mc,clozeVals,passed};
  renderNav(route());
  showTestResult(T);
}
function clozeSentence(T,i){
  const plain=T.cloze.text.replace(/\[(\d)\]\s*(\([^)]*\))?/g,(m,n,h)=>+n-1===i?`___ ${h||''}`:T.cloze.a[+n-1][0]);
  const parts=plain.split(/(?<=[.!?»])\s+/); const p=parts.find(x=>x.includes('___'))||plain;
  const hm=p.match(/___ (\([^)]*\))/); return (hm? p.replace(hm[0],'___')+' '+hm[1] : p).trim();
}
